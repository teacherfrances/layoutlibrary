{c:'O14',p:'O',n:'Word assembly',t:['reveal','vocabulary','tap','live'],
 s:['scatter','assemble','word'],
 pairs:['O03','W03','X10'],
 note:'The letters fly in from the edges and tumble into place. Use it to reveal the word at the end of a puzzle, or the topic at the start of a lesson. It can run again as many times as you like.',
 h:'<div class="wrap"><div class="ransom"><canvas id="cv"></canvas></div>'+
   '<div class="barrow"><button class="btn solid" id="go">Bring it together</button>'+
   '<button class="btn quiet" id="next">A different word</button></div>'+
   '<p class="sub" id="say"></p></div>',
 k:'.ransom{position:relative;height:calc(var(--base)*6);background:var(--surface-quiet);'+
   'border:2px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s4)}'+
   '.ransom canvas{position:absolute;inset:0;width:100%;height:100%}',
 j:"var words=['APPOINTMENT','DEADLINE','RECEIPT','INSPECTION'],wi=0;"+
   "var cols=['#0b2e4f','#0f7d7d','#c97a1a','#1c7a3e','#7a3f7a'];"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var wrap=document.querySelector('.ransom'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var bits=[],raf=null;"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;build();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function build(){var w=cv.width||360,h=cv.height||220,word=words[wi];"+
   "var n=word.length,box=Math.min(Math.floor(w/(n+1)),Math.floor(h*0.42));"+
   "var startX=(w-box*n)/2;bits=[];"+
   "word.split('').forEach(function(ch,i){"+
   "var tx=startX+i*box,ty=h/2-box/2;"+
   "var edge=Math.floor(Math.random()*4);"+
   "var sx=edge===0?-box:edge===1?w+box:Math.random()*w;"+
   "var sy=edge===2?-box:edge===3?h+box:Math.random()*h;"+
   "bits.push({ch:ch,tx:tx,ty:ty,box:box,"+
   "x:calm?tx:sx,y:calm?ty:sy,vx:0,vy:0,"+
   "rot:calm?0:(Math.random()-0.5)*3,vr:0,c:cols[i%cols.length],"+
   "tilt:(Math.random()-0.5)*0.14});});"+
   "draw();document.getElementById('say').textContent=calm?word:'Tap Bring it together.';}"+
   "function draw(){if(!cv.width)return;cx.clearRect(0,0,cv.width,cv.height);"+
   "bits.forEach(function(b){cx.save();cx.translate(b.x+b.box/2,b.y+b.box/2);cx.rotate(b.rot);"+
   "cx.fillStyle=b.c;cx.fillRect(-b.box/2+2,-b.box/2+2,b.box-4,b.box-4);"+
   "cx.fillStyle='#ffffff';cx.textAlign='center';cx.textBaseline='middle';"+
   "cx.font='900 '+Math.round(b.box*0.56)+'px Arial, sans-serif';"+
   "cx.fillText(b.ch,0,0);cx.restore();});}"+
   "function run(){if(raf)cancelAnimationFrame(raf);"+
   "function tick(){var moving=false;"+
   "bits.forEach(function(b){"+
   "b.vx=(b.vx+(b.tx-b.x)*0.06)*0.82;b.vy=(b.vy+(b.ty-b.y)*0.06)*0.82;"+
   "b.vr=(b.vr+(b.tilt-b.rot)*0.09)*0.8;"+
   "b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;"+
   "if(Math.abs(b.vx)+Math.abs(b.vy)>0.3||Math.abs(b.tx-b.x)>0.8)moving=true;});"+
   "draw();"+
   "if(moving){raf=requestAnimationFrame(tick);}"+
   "else{raf=null;document.getElementById('say').textContent=words[wi]+'. Say it, then use it in a sentence.';}}"+
   "raf=requestAnimationFrame(tick);}"+
   "document.getElementById('go').onclick=function(){build();if(calm){"+
   "document.getElementById('say').textContent=words[wi]+'. Say it, then use it in a sentence.';return;}run();};"+
   "document.getElementById('next').onclick=function(){wi=(wi+1)%words.length;build();"+
   "if(!calm)run();};"},

{c:'O15',p:'O',n:'Shatter reveal',t:['reveal','game','tap','live'],
 s:['picture','cells','guess'],
 pairs:['O14','W08','C05'],
 note:'A picture under a pane of glass. Each tap takes one piece away, so the class can guess early for more points or wait and be sure. It counts how much is still covered.',
 h:'<div class="wrap"><div class="shatter"><canvas id="cv"></canvas></div>'+
   '<p class="sub" id="say"></p>'+
   '<div class="guessrow" id="gs"></div>'+
   '<div class="fb" id="fb" style="display:none"></div>'+
   '<button class="btn quiet" id="rs">Put the glass back</button></div>',
 k:'.shatter{position:relative;height:calc(var(--base)*8);border:2px solid var(--line);'+
   'border-radius:var(--r-lg);overflow:hidden;touch-action:none;margin-bottom:var(--s3)}'+
   '.shatter canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}'+
   '.guessrow{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}',
 j:"var COLS=6,ROWS=4,gone={},pts=[],answered=false;"+
   "var wrap=document.querySelector('.shatter'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;lattice();draw();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function lattice(){pts=[];var w=cv.width||360,h=cv.height||260;"+
   "for(var r=0;r<=ROWS;r++){pts[r]=[];for(var c=0;c<=COLS;c++){"+
   "var jx=(r===0||r===ROWS||c===0||c===COLS)?0:(Math.random()-0.5)*w/COLS*0.5;"+
   "var jy=(r===0||r===ROWS||c===0||c===COLS)?0:(Math.random()-0.5)*h/ROWS*0.5;"+
   "pts[r][c]={x:c*w/COLS+jx,y:r*h/ROWS+jy};}}}"+
   "function picture(){var w=cv.width,h=cv.height;"+
   "cx.fillStyle='#bfe0f0';cx.fillRect(0,0,w,h);"+
   "cx.fillStyle='#2f6f9e';cx.fillRect(0,h*0.72,w,h*0.28);"+
   "cx.fillStyle='#f7d774';cx.beginPath();cx.arc(w*0.82,h*0.2,h*0.1,0,7);cx.fill();"+
   "cx.fillStyle='#c9ced3';cx.fillRect(w*0.08,h*0.66,w*0.84,h*0.06);"+
   "cx.fillStyle='#ffffff';"+
   "[[0.18,0.30],[0.36,0.40],[0.54,0.34]].forEach(function(s){"+
   "cx.beginPath();cx.moveTo(w*s[0],h*0.68);"+
   "cx.quadraticCurveTo(w*(s[0]+s[1]/2),h*0.16,w*(s[0]+s[1]),h*0.68);cx.closePath();cx.fill();});"+
   "cx.strokeStyle='#8b98a5';cx.lineWidth=2;"+
   "[[0.18,0.30],[0.36,0.40],[0.54,0.34]].forEach(function(s){"+
   "cx.beginPath();cx.moveTo(w*s[0],h*0.68);"+
   "cx.quadraticCurveTo(w*(s[0]+s[1]/2),h*0.16,w*(s[0]+s[1]),h*0.68);cx.closePath();cx.stroke();});}"+
   "function draw(){if(!cv.width)return;picture();"+
   "for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){"+
   "if(gone[r+'-'+c])continue;"+
   "var a=pts[r][c],b=pts[r][c+1],d2=pts[r+1][c+1],e=pts[r+1][c];"+
   "cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.lineTo(d2.x,d2.y);cx.lineTo(e.x,e.y);cx.closePath();"+
   "cx.fillStyle=(r+c)%2?'#183c5e':'#1d4a73';cx.fill();"+
   "cx.strokeStyle='#0b2e4f';cx.lineWidth=2;cx.stroke();}"+
   "var left=COLS*ROWS-Object.keys(gone).length;"+
   "document.getElementById('say').textContent=left?"+
   "left+' pieces still covering it. Guess now and it is worth '+left+' points.':"+
   "'All uncovered.';}"+
   "cv.addEventListener('pointerdown',function(e){e.preventDefault();"+
   "var rct=cv.getBoundingClientRect();"+
   "var c=Math.floor((e.clientX-rct.left)/(rct.width/COLS));"+
   "var r=Math.floor((e.clientY-rct.top)/(rct.height/ROWS));"+
   "if(r<0||c<0||r>=ROWS||c>=COLS)return;gone[r+'-'+c]=1;draw();});"+
   "var gs=document.getElementById('gs');"+
   "['The Opera House','A shopping centre','The airport'].forEach(function(o){"+
   "var b=document.createElement('button');b.className='opt';b.textContent=o;"+
   "b.onclick=function(){if(answered)return;answered=true;"+
   "var ok=o==='The Opera House',left=COLS*ROWS-Object.keys(gone).length;"+
   "b.classList.add(ok?'right':'wrong');"+
   "var f=document.getElementById('fb');f.className='fb '+(ok?'good':'bad');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+(ok?'Yes, '+left+' points.':'Not that one.')+'</span>'+"+
   "'White sails on the water, in Sydney.';};gs.appendChild(b);});"+
   "document.getElementById('rs').onclick=function(){gone={};answered=false;"+
   "[].forEach.call(gs.children,function(b){b.className='opt';});"+
   "document.getElementById('fb').style.display='none';lattice();draw();};"},

{c:'R07',p:'R',n:'Confetti',t:['feedback','reward','tap','live'],
 s:['burst','fall','stop'],
 pairs:['U03','H01','R01'],
 note:'A burst where the finger lands, and a bigger one from the corners when a whole part is finished. It clears itself, so it never sits spinning in the background.',
 h:'<div class="wrap"><div class="confw" id="w"><canvas id="cv"></canvas>'+
   '<div class="q" style="position:relative;z-index:2;text-align:center;margin:0;padding:var(--s6) var(--s4)">'+
   'Tap anywhere in here</div></div>'+
   '<button class="btn solid" id="big">They finished the whole part</button>'+
   '<p class="sub" id="say"></p></div>',
 k:'.confw{position:relative;height:calc(var(--base)*7);background:var(--accent-wash);'+
   'border:2px solid var(--accent);border-radius:var(--r-lg);overflow:hidden;'+
   'touch-action:none;margin-bottom:var(--s4);cursor:pointer}'+
   '.confw canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}',
 j:"var cols=["+"TOK('--warm','#f2a541')"+","+"TOK('--accent','#0f7d7d')"+","+"TOK('--brand','#0b2e4f')"+","+"TOK('--good','#1c7a3e')"+","+"TOK('--bad','#b3261e')"+",'#7a3f7a'];"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var wrap=document.getElementById('w'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var bits=[],raf=null;"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function fire(x,y,n,spread){"+
   "if(calm){document.getElementById('say').textContent='Well done. Confetti is off because motion is turned down.';return;}"+
   "for(var i=0;i<n;i++){var a=(-90+(Math.random()-0.5)*spread)*Math.PI/180;"+
   "var sp=4+Math.random()*7;"+
   "bits.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,"+
   "w:5+Math.random()*6,h:8+Math.random()*7,rot:Math.random()*6,"+
   "vr:(Math.random()-0.5)*0.4,c:cols[Math.floor(Math.random()*cols.length)],life:1});}"+
   "run();}"+
   "function run(){if(raf)return;"+
   "function tick(){cx.clearRect(0,0,cv.width,cv.height);"+
   "bits=bits.filter(function(b){return b.life>0&&b.y<cv.height+40;});"+
   "bits.forEach(function(b){b.vy+=0.28;b.vx*=0.995;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;"+
   "if(b.y>cv.height*0.7)b.life-=0.012;"+
   "cx.save();cx.globalAlpha=Math.max(0,b.life);cx.translate(b.x,b.y);cx.rotate(b.rot);"+
   "cx.fillStyle=b.c;cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);cx.restore();});"+
   "if(bits.length){raf=requestAnimationFrame(tick);}"+
   "else{raf=null;cx.clearRect(0,0,cv.width,cv.height);}}"+
   "raf=requestAnimationFrame(tick);}"+
   "wrap.addEventListener('pointerdown',function(e){e.preventDefault();"+
   "if(!cv.width)size();"+
   "var r=cv.getBoundingClientRect();"+
   "fire(e.clientX-r.left,e.clientY-r.top,26,70);"+
   "if(!calm)document.getElementById('say').textContent='One burst where you tapped.';});"+
   "document.getElementById('big').onclick=function(){if(!cv.width)size();"+
   "fire(10,cv.height,60,50);fire(cv.width-10,cv.height,60,50);"+
   "if(!calm)document.getElementById('say').textContent='Both corners. Save this one for the end of a part.';};"}

   "var layout=[[0,'sn'],[0,'ew'],[0,'ne'],[0,'bl'],"+
   "[0,'ns'],[0,'bl'],[0,'ns'],[0,'bl'],"+
   "[0,'es'],[0,'ew'],[0,'nw'],[0,'bl'],"+
   "[0,'bl'],[0,'bl'],[0,'bl'],[0,'bl']];"+
   "var shapes={ew:[0,1,0,1],ns:[1,0,1,0],ne:[1,1,0,0],es:[0,1,1,0],sw:[0,0,1,1],nw:[1,0,0,1],"+
   "sn:[1,0,1,0],bl:[0,0,0,0]};"+
   "var rot=[],g=document.getElementById('g');"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "function conns(i){var s=shapes[layout[i][1]].slice(),r=rot[i]%4,out=[0,0,0,0];"+
   "for(var k=0;k<4;k++)out[(k+r)%4]=s[k];return out;}"+
   "function build(){g.innerHTML='';rot=[];"+
   "layout.forEach(function(t,i){rot.push(t[1]==='bl'?0:Math.floor(Math.random()*4));"+
   "var b=document.createElement('button');b.className='tcell'+(t[1]==='bl'?' fixed':'');"+
   "b.innerHTML=svgFor(t[1]);"+
   "b.onclick=function(){if(t[1]==='bl')return;rot[i]=(rot[i]+1)%4;"+
   "var s=b.querySelector('svg');if(s)s.style.transform='rotate('+(rot[i]*90)+'deg)';check();};"+
   "g.appendChild(b);"+
   "var s=b.querySelector('svg');"+
   "if(s){if(calm)s.style.transition='none';s.style.transform='rotate('+(rot[i]*90)+'deg)';}});"+
   "check();}"+
   "function svgFor(kind){if(kind==='bl')return '';"+
   "var c=shapes[kind],d2='';"+
   "if(c[0])d2+='M50,50 L50,0 ';if(c[1])d2+='M50,50 L100,50 ';"+
   "if(c[2])d2+='M50,50 L50,100 ';if(c[3])d2+='M50,50 L0,50 ';"+
   "return '<svg viewBox=\"0 0 100 100\" aria-hidden=\"true\">'+"+
   "'<path d=\"'+d2+'\" stroke=\"'+"+"TOK('--accent','#0f7d7d')"+"+'\" stroke-width=\"16\" fill=\"none\" stroke-linecap=\"round\"></path></svg>';}"+
   "function check(){"+
   "var seen={},queue=[0],ok=false;"+
   "while(queue.length){var i=queue.shift();if(seen[i])continue;seen[i]=1;"+
   "var c=conns(i),x=i%W,y=Math.floor(i/W);"+
   "if(i===10&&c[1]===0){}"+
   "if(c[0]&&y>0&&conns(i-W)[2])queue.push(i-W);"+
   "if(c[2]&&y<H-1&&conns(i+W)[0])queue.push(i+W);"+
   "if(c[3]&&x>0&&conns(i-1)[1])queue.push(i-1);"+
   "if(c[1]&&x<W-1&&conns(i+1)[3])queue.push(i+1);}"+
   "ok=!!seen[10];"+
   "[].forEach.call(g.children,function(b,i){b.classList.toggle('joined',!!seen[i]&&layout[i][1]!=='bl');});"+
   "var n=Object.keys(seen).filter(function(i){return layout[i][1]!=='bl';}).length;"+
   "document.getElementById('say').textContent=n+' tile'+(n===1?'':'s')+' joined to the station.';"+
   "var f=document.getElementById('fb');"+
   "if(ok){f.className='fb good';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">The road is joined.</span>'+"+
   "'Now say the route out loud: out of the station, along the road, then left at the corner.';}"+
   "else f.style.display='none';}"+
   "document.getElementById('rs').onclick=build;build();"},

{c:'C12',p:'C',n:'Walk the maze',t:['game','directions','tap','live'],
 s:['maze','arrows','gates'],
 pairs:['C11','Y07','A11'],
 note:'A maze that draws itself, then you walk it with four arrows. Two squares hold a question, and a wrong answer sends you back a step, so it is reading and direction words rather than luck.',
 h:'<div class="wrap"><div class="mazew"><canvas id="cv"></canvas></div>'+
   '<p class="sub" id="say"></p>'+
   '<div class="mazebtn">'+
   '<button class="btn" data-d="up">Up</button>'+
   '<button class="btn" data-d="left">Left</button>'+
   '<button class="btn" data-d="right">Right</button>'+
   '<button class="btn" data-d="down">Down</button></div>'+
   '<div id="gate"></div>'+
   '<div class="fb" id="fb" style="display:none"></div>'+
   '<button class="btn quiet" id="rs">A new maze</button></div>',
 k:'.mazew{position:relative;height:calc(var(--base)*8);background:var(--surface);'+
   'border:2px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s3)}'+
   '.mazew canvas{position:absolute;inset:0;width:100%;height:100%}'+
   '.mazebtn{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-bottom:var(--s3)}',
 j:"var CW=7,CH=5,cells=[],at=0,raf=null,drawn=0;"+
   "var QS=[['Which one is a place to borrow books?',['The library','The chemist','The bakery'],0],"+
   "['You are lost. What do you say?',['Excuse me, where is the station?','Give me the station.','Station!'],0]];"+
   "var gates={};"+
   "var done={};"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var wrap=document.querySelector('.mazew'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;draw();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function make(){cells=[];for(var i=0;i<CW*CH;i++)cells.push({n:1,e:1,s:1,w:1,v:0});"+
   "var stack=[0];cells[0].v=1;"+
   "while(stack.length){var c=stack[stack.length-1],x=c%CW,y=Math.floor(c/CW),opts=[];"+
   "if(y>0&&!cells[c-CW].v)opts.push(['n',c-CW]);"+
   "if(y<CH-1&&!cells[c+CW].v)opts.push(['s',c+CW]);"+
   "if(x>0&&!cells[c-1].v)opts.push(['w',c-1]);"+
   "if(x<CW-1&&!cells[c+1].v)opts.push(['e',c+1]);"+
   "if(!opts.length){stack.pop();continue;}"+
   "var pick=opts[Math.floor(Math.random()*opts.length)];"+
   "var opp={n:'s',s:'n',e:'w',w:'e'};"+
   "cells[c][pick[0]]=0;cells[pick[1]][opp[pick[0]]]=0;cells[pick[1]].v=1;stack.push(pick[1]);}"+
   "at=0;done={};drawn=calm?CW*CH:0;gates={};"+
   "var path=route();"+
   "if(path.length>3){gates[path[Math.floor(path.length/3)]]=QS[0];"+
   "gates[path[Math.floor(path.length*2/3)]]=QS[1];}"+
   "document.getElementById('gate').innerHTML='';"+
   "document.getElementById('fb').style.display='none';"+
   "say();if(calm)draw();else run();}"+
   "function route(){var prev={},q=[0],seen={0:1};"+
   "while(q.length){var i=q.shift();if(i===CW*CH-1)break;"+
   "var c=cells[i],x=i%CW,y=Math.floor(i/CW),nb=[];"+
   "if(!c.n&&y>0)nb.push(i-CW);if(!c.s&&y<CH-1)nb.push(i+CW);"+
   "if(!c.w&&x>0)nb.push(i-1);if(!c.e&&x<CW-1)nb.push(i+1);"+
   "nb.forEach(function(k){if(!seen[k]){seen[k]=1;prev[k]=i;q.push(k);}});}"+
   "var out=[],at2=CW*CH-1;"+
   "while(at2!==undefined&&at2!==0){out.unshift(at2);at2=prev[at2];}"+
   "return out;}"+
   "function say(){document.getElementById('say').textContent=at===CW*CH-1?"+
   "'You made it out.':'Use the arrows. Two squares have a question on them.';}"+
   "function draw(){if(!cv.width)return;var w=cv.width,h=cv.height,cwid=w/CW,chg=h/CH;"+
   "cx.clearRect(0,0,w,h);"+
   "cx.fillStyle='#e7f5ec';cx.fillRect((CW-1)*cwid,(CH-1)*chg,cwid,chg);"+
   "Object.keys(gates).forEach(function(k){var i=+k,x=i%CW,y=Math.floor(i/CW);"+
   "cx.fillStyle=done[i]?'#e7f5ec':'#fdf3e0';cx.fillRect(x*cwid,y*chg,cwid,chg);});"+
   "cx.strokeStyle='#0b2e4f';cx.lineWidth=3;cx.lineCap='round';"+
   "for(var i=0;i<Math.min(drawn,CW*CH);i++){var c=cells[i],x=(i%CW)*cwid,y=Math.floor(i/CW)*chg;"+
   "cx.beginPath();"+
   "if(c.n){cx.moveTo(x,y);cx.lineTo(x+cwid,y);}"+
   "if(c.w){cx.moveTo(x,y);cx.lineTo(x,y+chg);}"+
   "if(c.e&&(i%CW)===CW-1){cx.moveTo(x+cwid,y);cx.lineTo(x+cwid,y+chg);}"+
   "if(c.s&&Math.floor(i/CW)===CH-1){cx.moveTo(x,y+chg);cx.lineTo(x+cwid,y+chg);}"+
   "cx.stroke();}"+
   "var px=(at%CW+0.5)*cwid,py=(Math.floor(at/CW)+0.5)*chg;"+
   "cx.beginPath();cx.arc(px,py,Math.min(cwid,chg)*0.26,0,7);cx.fillStyle='#c97a1a';cx.fill();}"+
   "function run(){if(raf)cancelAnimationFrame(raf);"+
   "function tick(){drawn+=1;draw();"+
   "if(drawn<CW*CH)raf=requestAnimationFrame(tick);else raf=null;}"+
   "raf=requestAnimationFrame(tick);}"+
   "function move(dir){if(drawn<CW*CH)drawn=CW*CH;"+
   "var c=cells[at],x=at%CW,y=Math.floor(at/CW),to=null;"+
   "if(dir==='up'&&!c.n&&y>0)to=at-CW;"+
   "if(dir==='down'&&!c.s&&y<CH-1)to=at+CW;"+
   "if(dir==='left'&&!c.w&&x>0)to=at-1;"+
   "if(dir==='right'&&!c.e&&x<CW-1)to=at+1;"+
   "var f=document.getElementById('fb');"+
   "if(to===null){f.className='fb bad';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">There is a wall that way.</span>Try another direction.';draw();return;}"+
   "at=to;f.style.display='none';draw();"+
   "if(gates[at]&&!done[at]){gate(at);return;}"+
   "if(at===CW*CH-1){f.className='fb good';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">You got out.</span>Now tell a partner the way you went.';}"+
   "say();}"+
   "function gate(i){var q=gates[i],host=document.getElementById('gate');host.innerHTML='';"+
   "var p2=document.createElement('p');p2.className='q';p2.textContent=q[0];host.appendChild(p2);"+
   "q[1].forEach(function(o,k){var b=document.createElement('button');b.className='opt';b.textContent=o;"+
   "b.onclick=function(){var f=document.getElementById('fb');f.style.display='block';"+
   "if(k===q[2]){done[i]=1;host.innerHTML='';f.className='fb good';"+
   "f.innerHTML='<span class=\"lead\">Right, the gate is open.</span>Keep going.';draw();}"+
   "else{f.className='fb bad';"+
   "f.innerHTML='<span class=\"lead\">Not that one.</span>You go back one square. Read it again.';"+
   "at=Math.max(0,at-1);host.innerHTML='';draw();}};host.appendChild(b);});}"+
   "document.addEventListener('click',function(e){var b=e.target.closest('[data-d]');"+
   "if(b)move(b.getAttribute('data-d'));});"+
   "document.getElementById('rs').onclick=make;make();"},

{c:'X12',p:'X',n:'Three column sort',t:['sort','tap','drag','live'],

 pairs:['X03','D03','Z09'],
 note:'Three columns instead of two, which is where most sorting really sits. Cards can be dragged or tapped across, and they spring into their new place so the move is easy to follow.',

 k:'.kanb{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:var(--s4) 0}'+
   '.kcol{border:3px dashed var(--line);border-radius:var(--r-lg);background:var(--surface-quiet);'+

   'cursor:grab;touch-action:none;min-height:var(--tap-min)}'+

   '.kcard.right{border-color:var(--good);background:var(--good-wash)}'+
   '.kcard.wrong{border-color:var(--bad);background:var(--bad-wash)}',
 j:"var cols=[['done','Already done'],['now','Doing now'],['next','Still to do']];"+
   "var cards=[['I sent the form',0],['I am waiting for the letter',1],['I will ring the office',2],"+
   "['I filled in the details',0],['I am reading the notice',1],['I will book the appointment',2]];"+
   "var b=document.getElementById('b'),held=null,drag=null;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "function build(){b.innerHTML='';"+
   "cols.forEach(function(c){var col=document.createElement('div');col.className='kcol';"+
   "col.setAttribute('data-c',c[0]);col.innerHTML='<h4>'+c[1]+'</h4>';b.appendChild(col);});"+
   "cards.forEach(function(c,i){var el=document.createElement('button');el.className='kcard';"+
   "el.textContent=c[0];el.setAttribute('data-i',i);"+
   "el.onclick=function(){if(drag)return;"+
   "[].forEach.call(b.querySelectorAll('.kcard'),function(x){x.classList.remove('lifted');});"+
   "held=el;el.classList.add('lifted');};"+
   "el.addEventListener('pointerdown',function(e){e.preventDefault();drag=el;"+
   "try{el.setPointerCapture(e.pointerId);}catch(err){}});"+
   "['pointerup','pointercancel'].forEach(function(ev){el.addEventListener(ev,function(e){"+
   "if(drag!==el)return;drag=null;"+
   "var t=document.elementFromPoint(e.clientX,e.clientY);"+
   "var col=t&&t.closest?t.closest('.kcol'):null;"+
   "[].forEach.call(b.children,function(c){c.classList.remove('over');});"+
   "if(col)move(el,col);});});"+
   "b.children[(i%3===0)?0:(i%3===1?1:2)];"+
   "b.children[0].appendChild(el);});}"+
   "b.addEventListener('click',function(e){var col=e.target.closest('.kcol');"+
   "if(col&&held){move(held,col);held.classList.remove('lifted');held=null;}});"+
   "function move(card,col){"+
   "var from=card.getBoundingClientRect();"+
   "col.appendChild(card);card.classList.remove('right','wrong');"+
   "if(calm)return;"+
   "var to=card.getBoundingClientRect();"+
   "card.style.transition='none';"+
   "card.style.transform='translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px)';"+
   "setTimeout(function(){card.style.transition='transform .32s cubic-bezier(.2,1.2,.4,1)';"+

   "document.getElementById('chk').onclick=function(){var right=0;"+
   "[].forEach.call(b.querySelectorAll('.kcard'),function(el){"+
   "var want=cols[cards[+el.getAttribute('data-i')][1]][0];"+

   "var f=document.getElementById('fb');f.className='fb '+(right===cards.length?'good':'bad');"+

   "f.innerHTML='<span class=\"lead\">'+right+' of '+cards.length+' in the right column.</span>'+"+
   "'Already done uses the past, doing now uses am or are with -ing, still to do uses will.';};"+
   "document.getElementById('rs').onclick=function(){held=null;build();"+
   "document.getElementById('fb').style.display='none';};build();"}

 note:'Two deliberate taps before anything happens: lift the cover, then throw the switch. For the actions you do not want an elbow on the smartscreen doing by accident, like clearing the scores.',
 h:'<div class="wrap" style="text-align:center"><div class="guard" id="g">'+

{c:'Q09',p:'Q',n:'Spin the globe',t:['world','speaking','drag','live'],

 h:'<div class="wrap"><div class="globe2"><canvas id="cv"></canvas></div>'+
   '<p class="sub" id="say">Spin it, then tap a pin.</p>'+
   '<div class="barrow" id="jump"></div></div>',
 k:'.globe2{position:relative;height:calc(var(--base)*9);background:var(--brand-deep);'+

   '.globe2 canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}',
 j:"var pins=[['Sydney',-33.9,151.2],['Baghdad',33.3,44.4],['Kabul',34.5,69.2],"+
   "['Hanoi',21.0,105.8],['Guangzhou',23.1,113.3],['Khartoum',15.5,32.5],"+
   "['Kathmandu',27.7,85.3],['Santiago',-33.4,-70.6]];"+
   "var wrap=document.querySelector('.globe2'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var spin=0,vel=0,down=false,lastX=0,raf=null,tilt=0.38;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;draw();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function R(){return Math.min(cv.width,cv.height)*0.42;}"+
   "function project(lat,lon){var la=lat*Math.PI/180,lo=(lon+spin)*Math.PI/180;"+
   "var x=Math.cos(la)*Math.sin(lo),y=Math.sin(la),z=Math.cos(la)*Math.cos(lo);"+
   "var y2=y*Math.cos(tilt)-z*Math.sin(tilt),z2=y*Math.sin(tilt)+z*Math.cos(tilt);"+
   "return {x:cv.width/2+x*R(),y:cv.height/2-y2*R(),z:z2};}"+
   "function draw(){if(!cv.width)return;var r=R();"+
   "cx.clearRect(0,0,cv.width,cv.height);"+
   "cx.beginPath();cx.arc(cv.width/2,cv.height/2,r,0,7);"+
   "cx.fillStyle='#0f2f4d';cx.fill();"+
   "cx.strokeStyle='rgba(126,224,208,.55)';cx.lineWidth=1.5;"+
   "for(var lat=-60;lat<=60;lat+=30){cx.beginPath();var first=true;"+
   "for(var lon=-180;lon<=180;lon+=6){var p=project(lat,lon);"+
   "if(p.z<0){first=true;continue;}if(first){cx.moveTo(p.x,p.y);first=false;}else cx.lineTo(p.x,p.y);}"+
   "cx.stroke();}"+

var S = {pack:'all', q:'', tags:[], view:'wall', den:'m', theme:'screen', motion:true, skin:'default'};
var DEN = {s:'Small', m:'Medium', l:'Large'};
var THEMES = ['screen','contrast','print'];
var THEMEN = {screen:'Screen', contrast:'Contrast', print:'Print'};
var SKINS = ['default','editorial','primary','marker','soft','paper','toolkit'];
var SKINN = {'default':'No skin', editorial:'Editorial', primary:'Primary', marker:'Marker', soft:'Soft', paper:'Paper', toolkit:'Toolkit'};
var NOMOTION = '*{animation:none!important;transition:none!important}';

function packOf(k){ for(var i=0;i<PACKS.length;i++) if(PACKS[i].k===k) return PACKS[i]; return PACKS[0]; }
function byCode(c){ for(var i=0;i<L.length;i++) if(L[i].c===c) return L[i]; return null; }
function allTags(){
  var seen={}, out=[];
  L.forEach(function(x){ x.t.forEach(function(t){ if(!seen[t]){ seen[t]=1; out.push(t); } }); });
  return out.sort();
}
function match(x){
  if(S.pack!=='all' && x.p!==S.pack) return false;
  for(var i=0;i<S.tags.length;i++) if(x.t.indexOf(S.tags[i])<0) return false;
  if(!S.q) return true;
  var hay = (x.c+' '+x.n+' '+x.t.join(' ')+' '+x.s.join(' ')+' '+x.note+' '+packOf(x.p).name).toLowerCase();
  var w = S.q.toLowerCase().split(/\s+/);
  for(var k=0;k<w.length;k++) if(hay.indexOf(w[k])<0) return false;
  return true;
}
function found(){ return L.filter(match); }

/* One complete standalone file for a layout. */
function fileFor(x, theme, size, motion, skin){
  var css = TOKENS + (x.k || '') + (motion === false ? NOMOTION : '') + fontCss() + colourCss();
  var script = '<scr'+'ipt>'+SHIM+(x.j||'')+'</scr'+'ipt>';
  var sk = (skin && skin !== 'default') ? ' data-skin="'+skin+'"' : '';
  return '<!DOCTYPE html>\n<html lang="en-AU" data-theme="'+(theme||'screen')+'" data-size="'+(size||'1')+'"'+sk+'>\n'+
    '<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<title>'+x.c+' '+x.n+'</title>\n<style>'+css+'</style>\n</head>\n<body>\n'+
    x.h+'\n'+script+'\n</body>\n</html>';
}

function wall(list){

var io = null, LIVE = 0;
function mountFrames(){
  LIVE = 0; countLive();
  if(io) io.disconnect();
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      var el = e.target; io.unobserve(el);
      var x = byCode(el.getAttribute('data-code'));
      if(!x) return;
      var f = document.createElement('iframe');
      f.setAttribute('sandbox','allow-scripts');
      f.setAttribute('title', x.c+' preview');
      f.srcdoc = fileFor(x, S.theme, '1', S.motion, S.skin);
      el.innerHTML = ''; el.appendChild(f);
      scaleFrame(el, f);
      LIVE++; countLive();
    });
  }, {rootMargin: (window.innerWidth < 820 ? '200px' : '500px')});
  [].forEach.call(document.querySelectorAll('.stage'), function(el){ io.observe(el); });
}
function scaleFrame(stage, f){ f.style.transform = 'scale(' + ((stage.clientWidth || 330)/1000) + ')'; }
function countLive(){ document.getElementById('live').textContent = LIVE + ' live'; }
window.addEventListener('resize', function(){
  [].forEach.call(document.querySelectorAll('.stage'), function(el){
    var f = el.querySelector('iframe'); if(f) scaleFrame(el, f);
  });
});

var CUR = null, PTHEME = 'screen', PSIZE = '1', PSKIN = 'default';
function setHash(v){ try{ history.replaceState(null, '', v ? '#'+v : location.pathname); }catch(e){} }

function openSheet(code){
  var x = byCode(code); if(!x) return;
  CUR = x; PTHEME = S.theme; PSIZE = '1'; PSKIN = S.skin;
  setHash(code);
  document.getElementById('dcode').textContent = x.c;
  document.getElementById('dname').textContent = x.n;
  drawSheet();
  document.getElementById('drawer').classList.add('on');
}
function closeSheet(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('dbody').innerHTML = '';

}
function step(d){
  var list = found(); if(!CUR || !list.length) return;
  var i = -1;
  for(var k=0;k<list.length;k++) if(list[k].c===CUR.c) i = k;
  if(i < 0) i = 0;
  openSheet(list[(i + d + list.length) % list.length].c);
}

function paintPreview(){ document.getElementById('pv').srcdoc = fileFor(CUR, PTHEME, PSIZE, true, PSKIN); }
function markOn(sel, attr, val){
  [].forEach.call(document.querySelectorAll(sel), function(b){
    b.classList.toggle('on', b.getAttribute(attr) === val);
  });

/* One delegated listener, so the typed hand off text survives every control. */
document.getElementById('dbody').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b || !CUR) return;
  if(b.hasAttribute('data-pt')){ PTHEME = b.getAttribute('data-pt'); markOn('[data-pt]','data-pt',PTHEME); paintPreview(); return; }
  if(b.hasAttribute('data-ps')){ PSIZE  = b.getAttribute('data-ps'); markOn('[data-ps]','data-ps',PSIZE);  paintPreview(); return; }
  if(b.hasAttribute('data-pk')){ PSKIN  = b.getAttribute('data-pk'); markOn('[data-pk]','data-pk',PSKIN);  paintPreview(); return; }
  if(b.hasAttribute('data-go')){ openSheet(b.getAttribute('data-go')); return; }
  if(b.hasAttribute('data-act')){
    if(b.getAttribute('data-act')==='dl') download(); else standalone();
    return;
  }
  var w = b.getAttribute('data-copy');
  if(!w) return;
  if(w==='file')   copy(fileFor(CUR, PTHEME, PSIZE, true, PSKIN), b);
  if(w==='markup') copy(CUR.h, b);
  if(w==='script') copy(CUR.j || '', b);
  if(w==='css')    copy(CUR.k || '', b);
  if(w==='prompt') copy(handoff(), b);
});

function handoff(){

  'Library rules:\n'+
  '- One self-contained HTML file. Inline CSS and JS. No dependencies. Works offline.\n'+
  '- Use the style layer below unchanged. Use its tokens and classes. No raw hex, no raw px font sizes.\n'+

function recipeHandoff(){

/* Clipboard that also works on a file opened from a USB stick. */
function copy(text, btn){
  var old = btn.textContent;
  function flash(m){ btn.textContent = m; setTimeout(function(){ btn.textContent = old; }, 1500); }
  function legacy(){
    var a = document.createElement('textarea');
    a.value = text; a.style.position='fixed'; a.style.top='-999px';
    document.body.appendChild(a); a.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    a.remove(); flash(ok ? 'Copied' : 'Select it from the code box');
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){ flash('Copied'); }, legacy);
  } else { legacy(); }
}

/* does this machine actually have the font, or is it quietly falling back? */
var _fcv = null;
function haveFont(name){
  try{
    if(!_fcv) _fcv = document.createElement('canvas').getContext('2d');
    var probe = 'Handgloves 12345 mwi';
    var base = {};
    ['monospace','serif','sans-serif'].forEach(function(g){
      _fcv.font = '48px '+g; base[g] = _fcv.measureText(probe).width;
    });
    return ['monospace','serif','sans-serif'].some(function(g){
      _fcv.font = '48px "'+name+'",'+g;
      return Math.abs(_fcv.measureText(probe).width - base[g]) > 0.6;
    });
  }catch(e){ return true; }
}
function fontStack(name, kind){
  var tail = kind === 'display'
    ? '"Segoe UI Black","Arial Black",Carlito,Calibri,system-ui,sans-serif'
    : 'Carlito,Calibri,"Segoe UI",Candara,Arial,sans-serif';
  return '"'+name+'",'+tail;
}
function fontCss(){
  if(!PICK) return '';
  return ':root{--f-display:'+fontStack(PICK[0],'display')+
         ';--f-body:'+fontStack(PICK[1],'body')+';}';
}
function applyFonts(pair){
  PICK = pair ? [pair[0], pair[1]] : null;
  pair = PICK;
  try{ if(pair) localStorage.setItem('lib.fonts', JSON.stringify(pair));
       else localStorage.removeItem('lib.fonts'); }catch(e){}
  var tag = document.getElementById('fontover');
  if(!tag){ tag = document.createElement('style'); tag.id='fontover'; document.head.appendChild(tag); }

  if(lab) lab.textContent = pair ? pair[0]+' + '+pair[1] : 'Fonts';
  render();
  openFonts();

var COL = null;

function hex2rgb(h){h=h.replace('#','');
  if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r){return '#'+r.map(function(v){
  var s=Math.max(0,Math.min(255,Math.round(v))).toString(16);return s.length<2?'0'+s:s;}).join('');}
function mix(a,b,t){var A=hex2rgb(a),B=hex2rgb(b);
  return rgb2hex([0,1,2].map(function(i){return A[i]+(B[i]-A[i])*t;}));}
function lum(h){return hex2rgb(h).map(function(v){v/=255;
  return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);})
  .reduce(function(a,v,i){return a+v*[0.2126,0.7152,0.0722][i];},0);}
function ratio(a,b){var l1=lum(a),l2=lum(b),hi=Math.max(l1,l2),lo=Math.min(l1,l2);
  return (hi+0.05)/(lo+0.05);}

function palTokens(p){
  var brand=p[1], accent=p[2], warm=p[3], page=p[4];
  var dark = lum(page) < 0.22;                       // a dark page flips the paper and the ink
  var ink  = dark ? mix(page,'#ffffff',0.86) : mix(brand,'#000000',0.45);
  var surf = dark ? mix(page,'#ffffff',0.07) : '#ffffff';
  // some mid tone colours carry neither white nor dark text at 4.5 to 1,
  // so the colour itself is deepened by as little as it takes
  var fixed = {};
  var settle = function(bg){
    var dk = mix(bg,'#000000',0.74);
    for(var k=0;k<14;k++){
      if(ratio('#ffffff',bg) >= 4.5) return {bg:bg, on:'#ffffff', moved:k>0};
      if(ratio(dk,bg) >= 4.5) return {bg:bg, on:dk, moved:k>0};
      bg = mix(bg,'#000000',0.10); dk = mix(bg,'#000000',0.74);
    }
    return {bg:bg, on:'#ffffff', moved:true};
  };
  var B = settle(brand), A = settle(accent);
  brand = B.bg; accent = A.bg;
  fixed.moved = B.moved || A.moved;
  var best = function(bg){ return bg===brand ? B.on : (bg===accent ? A.on : '#ffffff'); };
  return {
    '--moved': fixed.moved ? '1' : '0',
    '--on-brand':B.on,'--on-accent':A.on,
    '--brand':brand,'--brand-deep':mix(brand,'#000000',0.35),'--brand-soft':mix(brand,page,0.86),
    '--accent':accent,'--accent-deep':mix(accent,'#000000',0.25),'--accent-wash':mix(accent,page,0.86),
    '--warm':warm,'--warm-light':mix(warm,'#ffffff',0.55),'--warm-wash':mix(warm,page,0.86),
    '--good':'#1c7a3e','--good-wash':mix('#1c7a3e',page,0.88),'--bad':'#b3261e','--bad-wash':mix('#b3261e',page,0.90),
    '--ink':ink,'--ink-soft':mix(ink,'#ffffff',0.42),
    '--surface':surf,'--surface-alt':page,
    '--surface-quiet':dark?mix(page,'#ffffff',0.10):mix(page,'#000000',0.04),
    '--band':dark?mix(page,'#ffffff',0.14):mix(page,'#000000',0.07),
    '--line':dark?mix(page,'#ffffff',0.22):mix(page,'#000000',0.13),
    '--focus':warm
  };
}
function colourCss(){
  if(!COL) return '';
  var t=palTokens(COL), out=':root{';
  Object.keys(t).forEach(function(k){ if(k!=='--moved') out += k+':'+t[k]+';'; });
  return out+'}';
}
function applyColours(pal){
  COL = pal;
  try{ if(pal) localStorage.setItem('lib.colours', JSON.stringify(pal));
       else localStorage.removeItem('lib.colours'); }catch(e){}
  var tag=document.getElementById('colourover');
  if(!tag){ tag=document.createElement('style'); tag.id='colourover'; document.head.appendChild(tag); }
  tag.textContent=colourCss();
  var lab=document.getElementById('colbtn');
  if(lab) lab.textContent = pal ? pal[0] : 'Colours';
  if(pal && pal[6]) COLGRP = pal[6];
  render();
  openColours();
}

function checkBuild(src){
  var out = [], lines = src.split('\n'), inStyle = false, inSvg = false;
  function add(level, ttl, ln, fix){ out.push({level:level, ttl:ttl, ln:ln, fix:fix}); }

  var classesUsed = {}, classesDefined = {};
  for(var i=0;i<lines.length;i++){
    var L1 = lines[i], n = i+1;
    // a line that opens or closes a style block still holds css, so judge it as css
    var styleLine = inStyle || /<style/i.test(L1) || /<\/style/i.test(L1);
    if(/<style/i.test(L1)) inStyle = true;
    if(/<\/style/i.test(L1)) inStyle = false;

    if(L1.indexOf('\u2014') >= 0) add('bad','Em dash', n, 'Replace it with a full stop, a comma or a new sentence.');
    var inp = L1.match(/<(input|textarea)\b[^>]*/gi);
    if(inp) inp.forEach(function(t){
      var type = (t.match(/type\s*=\s*"([^"]+)"/i)||[])[1] || 'text';
      if(/textarea/i.test(t) || /^(text|search|email|number|tel|url|password)$/i.test(type)){
        add('warn','Typed input ('+type+')', n, 'Tap only, unless this is a team or class name field.');
      }
    });
    if(/<footer/i.test(L1)) add('bad','Footer', n, 'No footers. A fixed bottom bar with Back and Next is fine.');
    // a file's script runs at the top level, so these names collide with the window itself
    // and the assignment is thrown away without a word
    var owned = L1.match(/\b(?:var|let|const)\s+([^;]*)/);
    if(owned){
      owned[1].split(',').forEach(function(part){
        var nm = (part.split('=')[0]||'').trim();
        if(/^(top|self|parent|frames|length|origin|closed|name|status|location|history|screen|navigator|document)$/.test(nm))
          add('bad','Name the browser owns: '+nm, n,
            'Rename it. At the top level, var '+nm+' is thrown away and '+nm+' stays as the window.');
      });
    }
    // svg attributes and canvas calls must carry a literal colour, so they are not raw hex
    var svgLine = inSvg || /<svg/i.test(L1) ||
      /(fill|stroke|stop-color|shadowColor)\s*[=:]|fillStyle|strokeStyle|addColorStop/.test(L1);
    if(/<svg/i.test(L1)) inSvg = true;
    if(/<\/svg/i.test(L1)) inSvg = false;
    if(!styleLine && !svgLine){
      // a colour inside TOK('--name','#fallback') is the documented way to read a token in script,
      // and plain white on a brand bar is the house style, so neither is a fault
      var probe = L1.replace(/TOK\(\s*['"][^'"]+['"]\s*,\s*['"]#[0-9a-fA-F]{3,6}['"]\s*\)/g, '')
        .replace(/&#\d+;/g, '');   // emoji entities such as &#128276; are not colours
      var hx = probe.match(/#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b/g);
      if(hx) hx = hx.filter(function(h){ return !/^#(fff|ffffff)$/i.test(h); });
      if(hx && hx.length) add('bad','Raw hex colour '+hx[0], n,
        'Use a token: var(--accent) in css, or TOK(\'--accent\',\'#0f7d7d\') in script.');
    }
    var fs = L1.match(/font-size\s*:\s*(\d+(?:\.\d+)?)px/g);
    if(fs) fs.forEach(function(m){
      var v = parseFloat(m.match(/(\d+(?:\.\d+)?)px/)[1]);
      if(v < 19) add('bad','Type at '+v+'px', n, 'Below the 19px floor. Use var(--fs-xs) or larger.');
      else add('warn','Raw px font size '+v+'px', n, 'Use a step: var(--fs-sm), var(--fs-md), var(--fs-lg).');
    });
    var cal = L1.match(/font-size\s*:\s*calc\(\s*var\(--base\)\s*\*\s*(\.\d+|0\.\d+)/g);
    if(cal) cal.forEach(function(m){
      var v = parseFloat(m.split('*')[1]);
      if(v < 0.68) add('bad','Type at '+Math.round(v*28)+'px on the default step', n, 'Nothing below 19px. The floor is var(--base)*.68.');
    });
    var cu = L1.match(/class\s*=\s*[\"']([^\"']+)[\"']/g) || [];
    cu.forEach(function(m){
      m.replace(/class\s*=\s*[\"']([^\"']+)[\"']/,'$1').split(/\s+/).forEach(function(c){
        if(c) classesUsed[c] = classesUsed[c] || n;
      });
    });
    if(styleLine){
      var cd = L1.match(/\.[a-zA-Z][\w-]*/g) || [];
      cd.forEach(function(c){ classesDefined[c.slice(1)] = true; });
    }
  }

  // whole file checks
  var idx = src.indexOf('localStorage');
  while(idx > -1){
    var around = src.slice(Math.max(0, idx-260), idx+260);
    if(!/try\s*\{/.test(around) || !/catch/.test(around)){
      add('bad','Storage with no try and catch', src.slice(0, idx).split('\n').length,
        'Wrap it. A blocked device must still run the page.');
      break;
    }
    idx = src.indexOf('localStorage', idx+1);
  }
  if(/pointerdown|pointermove/.test(src) && src.indexOf('ontouchstart') < 0)
    add('bad','Drag with no touch shim', 0, 'Paste the touch shim at the top of the script or it will not drag on a phone.');
  if(/classList\.add\(['\"]right|class=\"opt right/.test(src) && src.indexOf('fb ') < 0)
    add('warn','Answers with no reason', 0, 'Every answer needs a feedback box saying why. The reason is the teaching.');
  if(src.indexOf('--base') < 0)
    add('bad','No style layer', 0, 'Paste the library style layer in, or the tokens resolve to nothing.');
  if(!/prefers-reduced-motion/.test(src) && /animate\(|@keyframes|transition:/.test(src))
    add('warn','Motion with no reduced-motion check', 0, 'Guard anything that animates.');

  var undef = [];
  for(var c in classesUsed){ if(!classesDefined[c] && undef.length < 12) undef.push(c); }
  if(undef.length) add('warn','Classes with no style: '+undef.join(', '), 0,
    'Either a typo, or the style block for them was not pasted in.');

  if(!out.length) add('ok','Nothing to fix', 0, 'It passes every check in the house rules.');
  return out;
}

function runCheck(){
  var src = document.getElementById('paste').value || '';
  var box = document.getElementById('findings');
  if(!src.trim()){ box.innerHTML = '<div class="fnd warn"><div class="ttl">Nothing pasted</div></div>'; return; }
  var found = checkBuild(src), bad = 0, warn = 0;
  found.forEach(function(f){ if(f.level==='bad') bad++; if(f.level==='warn') warn++; });
  var h = '<div class="tally"><span>'+src.split('\n').length+' lines</span>'+
          '<span>'+bad+' to fix</span><span>'+warn+' to look at</span></div>';
  found.forEach(function(f){
    h += '<div class="fnd '+f.level+'">'+(f.ln?'<div class="ln">line '+f.ln+'</div>':'')+
         '<div class="ttl">'+f.ttl+'</div><div class="fix">'+f.fix+'</div></div>';
  });
  box.innerHTML = h;
}

/* ===========================================================================
   6. CONTROLS
   =========================================================================== */
function setPack(k){ S.pack = k; drawNav(); drawMain(); document.getElementById('nav').classList.remove('open'); }
function toggleTag(t){
  var i = S.tags.indexOf(t);
  if(i<0) S.tags.push(t); else S.tags.splice(i,1);
  drawNav(); drawMain();
}
function setView(v){
  S.view = v;
  document.getElementById('vwall').classList.toggle('on', v==='wall');
  document.getElementById('vindex').classList.toggle('on', v==='index');
  drawMain();
}
function cycleDen(){
  var o = ['s','m','l']; S.den = o[(o.indexOf(S.den)+1)%3];
  document.getElementById('den').textContent = DEN[S.den];
  drawMain();
}
function cycleTheme(){
  S.theme = THEMES[(THEMES.indexOf(S.theme)+1)%3];
  document.getElementById('thm').textContent = THEMEN[S.theme];
  drawMain();
}
function cycleSkin(){
  S.skin = SKINS[(SKINS.indexOf(S.skin)+1) % SKINS.length];
  var b = document.getElementById('skn');
  b.textContent = SKINN[S.skin];
  b.classList.toggle('on', S.skin !== 'default');
  drawMain();
}
function toggleMotion(){
  S.motion = !S.motion;
  var b = document.getElementById('mot');
  b.textContent = S.motion ? 'Motion on' : 'Motion off';
  b.classList.toggle('on', S.motion);
  drawMain();
}
function teleport(){
  var list = found(); if(!list.length) return;
  var x = list[Math.floor(Math.random()*list.length)];
  if(S.view==='wall'){
    S.pack = x.p; drawNav(); drawMain();
    setTimeout(function(){
      var el = document.getElementById('t_'+x.c);
      if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash');
        setTimeout(function(){ el.classList.remove('flash'); }, 1400); }
    }, 60);
  } else { openSheet(x.c); }
}

document.getElementById('q').addEventListener('input', function(e){ S.q = e.target.value; drawMain(); });
document.addEventListener('keydown', function(e){
  var typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key === '/' && !typing){ e.preventDefault(); document.getElementById('q').focus(); return; }
  if(e.key === 'Escape'){ closeSheet(); return; }
  if(document.getElementById('drawer').classList.contains('on') && !typing){
    if(e.key === 'ArrowRight') step(1);
    if(e.key === 'ArrowLeft')  step(-1);
  }
});

if(COL){
  var _ct=document.createElement('style'); _ct.id='colourover';
  _ct.textContent=colourCss(); document.head.appendChild(_ct);
  var _cb=document.getElementById('colbtn');
  if(_cb) _cb.textContent=COL[0];
}

/* a pairing chosen last time is put back before anything is drawn */
if(PICK){
  var _ft = document.createElement('style'); _ft.id='fontover';
  _ft.textContent = fontCss(); document.head.appendChild(_ft);
  var _fb = document.getElementById('fontbtn');
  if(_fb) _fb.textContent = PICK[0]+' + '+PICK[1];
}

setView('wall');
drawNav();
drawMain();
if(location.hash && byCode(location.hash.slice(1))) openSheet(location.hash.slice(1));
</script>
</body>
