<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Library</title>

<!-- The style layer. Not applied to this page. It is injected into every preview
     and into every file you copy, so a layout carries structure only. -->
<script type="text/plain" id="tokens">
:root,[data-theme="screen"]{
  --brand:#0b2e4f;--brand-deep:#071f36;--brand-soft:#e8eef4;
  --accent:#0f7d7d;--accent-deep:#0b5f5f;--accent-wash:#e4f2f2;
  --warm:#c97a1a;--warm-light:#f2c98a;--warm-wash:#fdf3e0;
  --good:#1c7a3e;--good-wash:#e7f4ec;--bad:#b3261e;--bad-wash:#fbeceb;
  --ink:#0b2e4f;--ink-soft:#5a6772;--surface:#fff;--surface-alt:#f6f2ea;
  --surface-quiet:#f5f7f9;--band:#eaf0f6;--line:#e3ddd0;--focus:#1a73b8;
  --on-brand:#fff;--shadow:0 2px 0 rgba(11,46,79,.10);
}
[data-theme="contrast"]{
  --brand:#04182b;--brand-deep:#000;--brand-soft:#dbe6f0;
  --accent:#075c5c;--accent-deep:#043f3f;--accent-wash:#d3ebeb;
  --warm:#8a5210;--warm-light:#ffd79a;--warm-wash:#fbeac6;
  --good:#125c2c;--good-wash:#d9eee1;--bad:#8c1a13;--bad-wash:#f7dcd9;
  --ink:#04182b;--ink-soft:#3b4650;--surface:#fff;--surface-alt:#fff;
  --surface-quiet:#eef1f4;--band:#dee7f0;--line:#04182b;--focus:#0a4f8a;
  --on-brand:#fff;--shadow:0 0 0 2px var(--line);
}
[data-theme="print"]{
  --brand:#1b3a5c;--brand-deep:#12293f;--brand-soft:#dce7f0;
  --accent:#17868a;--accent-deep:#0e5f63;--accent-wash:#e4f2f2;
  --warm:#c07a12;--warm-light:#f2c98a;--warm-wash:#fdf3e0;
  --good:#1e7a46;--good-wash:#e6f4ec;--bad:#a6301f;--bad-wash:#fbeae7;
  --ink:#000;--ink-soft:#5a6772;--surface:#fff;--surface-alt:#fff;
  --surface-quiet:#f5f7f9;--band:#f2f2f2;--line:#bfbfbf;--focus:#1a73b8;
  --on-brand:#fff;--shadow:none;
}
:root{
  --f-display:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --f-body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --f-num:Consolas,"Lucida Console","DejaVu Sans",monospace;
  --base:28px;
  --fs-xs:calc(var(--base)*.68);--fs-sm:calc(var(--base)*.82);--fs-md:var(--base);
  --fs-lg:calc(var(--base)*1.22);--fs-xl:calc(var(--base)*1.62);--fs-2xl:calc(var(--base)*2.15);
  --lh-tight:1.18;--lh-body:1.5;
  --s1:4px;--s2:8px;--s3:12px;--s4:18px;--s5:26px;--s6:38px;--s7:56px;
  --r-sm:8px;--r-md:14px;--r-lg:22px;--r-pill:999px;
  --dur:180ms;--ease:cubic-bezier(.2,.7,.3,1);
  --tap-min:48px;--tap-opt:calc(var(--base)*2.3);--tap-chip:calc(var(--base)*2.45);
  --bar-h:calc(var(--base)*2.6);--wrap:900px;
}
[data-size="2"]{--base:34px}
[data-size="3"]{--base:42px}
[data-theme="print"]{--base:21px}
@media (prefers-reduced-motion:reduce){:root{--dur:1ms}*{animation:none!important;transition:none!important}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--surface-alt);color:var(--ink);font-family:var(--f-body);
  font-size:var(--fs-md);line-height:var(--lh-body);
  overflow-wrap:break-word;word-break:break-word;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display{font-family:var(--f-display);font-weight:900;line-height:var(--lh-tight);margin:0 0 var(--s3)}
h1{font-size:var(--fs-2xl)}h2{font-size:var(--fs-xl)}h3{font-size:var(--fs-lg)}
p{margin:0 0 var(--s4)}
b,strong{color:var(--accent-deep)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:var(--s5) var(--s4)}
.num-face{font-family:var(--f-num)}
.eyebrow{font-family:var(--f-display);font-weight:900;font-size:var(--fs-xs);letter-spacing:.06em;color:var(--warm);margin-bottom:var(--s2)}
.sub{color:var(--ink-soft);font-size:var(--fs-sm)}

.topbar{display:flex;align-items:center;gap:var(--s3);min-height:var(--bar-h);
  padding:0 var(--s4);padding-top:env(safe-area-inset-top,0px);
  background:var(--brand);color:var(--on-brand)}
.topbar .part{font-family:var(--f-display);font-weight:900;color:var(--warm-light)}
.topbar .count{margin-left:auto;background:#fff;color:var(--brand);border-radius:var(--r-pill);
  padding:var(--s1) var(--s4);font-family:var(--f-num);font-size:var(--fs-sm)}
.bottombar{background:var(--surface);border-top:2px solid var(--line);
  padding:var(--s3) var(--s4);padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px))}
.bottombar .tip{color:var(--ink-soft);font-size:var(--fs-xs);margin-bottom:var(--s2)}
.barrow{display:flex;gap:var(--s3);flex-wrap:wrap}

.btn{font-family:var(--f-body);font-size:var(--fs-md);min-height:var(--tap-min);
  padding:var(--s3) var(--s5);border:2px solid var(--brand);border-radius:var(--r-md);
  background:var(--surface);color:var(--brand);cursor:pointer}
.btn.solid{background:var(--brand);color:var(--on-brand)}
.btn.go{background:var(--good);border-color:var(--good);color:#fff}
.btn.wait{background:var(--warm-wash);border-color:var(--warm);color:var(--warm)}
.btn.quiet{border-color:var(--line);color:var(--ink-soft)}

.opt{display:block;width:100%;text-align:left;min-height:var(--tap-opt);padding:var(--s3) var(--s4);
  margin-bottom:var(--s3);font-size:var(--fs-md);font-family:var(--f-body);background:var(--surface);
  color:var(--ink);border:2px solid var(--line);border-radius:var(--r-md);cursor:pointer}
.opt.picked{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--good);background:var(--good-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.chip{display:inline-flex;align-items:center;min-height:var(--tap-chip);padding:var(--s2) var(--s5);
  margin:0 var(--s2) var(--s2) 0;font-size:var(--fs-md);font-family:var(--f-body);background:var(--surface);
  color:var(--ink);border:2px solid var(--accent);border-radius:var(--r-pill);cursor:pointer}
.chip.used{opacity:.35}
.chip.held{background:var(--brand);color:#fff;border-color:var(--brand)}
.bin{flex:1;min-height:var(--tap-opt);border:2px dashed var(--accent);border-radius:var(--r-md);
  background:var(--accent-wash);color:var(--accent-deep);font-family:var(--f-display);font-weight:900;
  font-size:var(--fs-sm);cursor:pointer}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s5);margin-bottom:var(--s5);box-shadow:var(--shadow)}
.card.is-right{border-left:10px solid var(--good)}
.card.is-wrong{border-left:10px solid var(--bad)}
.chead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.chead .n{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--base)*1.7);
  height:calc(var(--base)*1.7);border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);
  font-family:var(--f-num);font-size:var(--fs-sm)}
.tag{margin-left:auto;background:var(--warm-wash);color:var(--warm);border-radius:var(--r-pill);
  padding:var(--s1) var(--s3);font-size:var(--fs-xs)}
.q{font-family:var(--f-display);font-weight:900;font-size:var(--fs-lg);margin-bottom:var(--s4)}

.mcard{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-left:10px solid var(--accent);border-radius:var(--r-lg);padding:var(--s4) var(--s5);
  margin-bottom:var(--s4);cursor:pointer}
.mcard .step{font-size:var(--fs-xs);color:var(--warm);font-family:var(--f-display);font-weight:900;display:block}
.mcard .t{font-family:var(--f-display);font-weight:900;font-size:var(--fs-lg);display:block}
.mcard .desc{font-size:var(--fs-sm);color:var(--ink-soft);display:block}
.mcard .score{display:inline-block;margin-top:var(--s2);border-radius:var(--r-pill);padding:var(--s1) var(--s3);
  font-size:var(--fs-xs);background:var(--band);color:var(--ink-soft)}
.mcard .score.done{background:var(--good-wash);color:var(--good)}
.mcard.needs-device{border-left-color:var(--warm)}

.fb{border-radius:var(--r-md);padding:var(--s4);font-size:var(--fs-sm);margin-top:var(--s4)}
.fb .lead{font-family:var(--f-display);font-weight:900;display:block;margin-bottom:var(--s1)}
.fb.good{background:var(--good-wash);border-left:8px solid var(--good);color:var(--good)}
.fb.bad{background:var(--bad-wash);border-left:8px solid var(--bad);color:var(--bad)}
.fb.info{background:var(--surface-quiet);border-left:8px solid var(--ink-soft);color:var(--ink)}

.callout{border-radius:var(--r-md);padding:var(--s4);margin-bottom:var(--s5);font-size:var(--fs-sm)}
.callout.warm{background:var(--warm-wash);border:2px solid var(--warm)}
.callout.cool{background:var(--accent-wash);border-left:8px solid var(--accent)}
.prog{height:calc(var(--base)*.5);background:var(--band);border-radius:var(--r-pill);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);transition:width var(--dur) var(--ease)}

.sectionbar{display:flex;background:var(--brand);color:var(--on-brand);border-radius:var(--r-sm);
  overflow:hidden;margin:var(--s6) 0 var(--s4)}
.sectionbar .icon{width:calc(var(--base)*2.4);display:flex;align-items:center;justify-content:center;
  background:var(--brand-deep);font-size:var(--fs-lg)}
.sectionbar .txt{padding:var(--s3) var(--s4)}
.sectionbar .k{font-size:var(--fs-xs);color:var(--warm-light);font-family:var(--f-display);font-weight:900}
.sectionbar .t{font-family:var(--f-display);font-weight:900;font-size:var(--fs-lg)}
.activitybar{background:var(--accent-wash);border-left:10px solid var(--accent);padding:var(--s3) var(--s4);
  margin:var(--s5) 0 var(--s3);font-size:var(--fs-sm)}
.activitybar b{color:var(--brand)}
.gt{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin-bottom:var(--s5)}
.gt th{background:var(--accent);color:var(--on-accent);text-align:left;padding:var(--s3);font-family:var(--f-display);font-weight:900}
.gt td{border:1px solid var(--line);padding:var(--s3);vertical-align:top}
.gt tr:nth-child(even) td{background:var(--band)}
.tscroll{overflow-x:auto}
.answerline{border-bottom:2px solid var(--line);height:calc(var(--base)*1.6);margin-bottom:var(--s3)}
.tickbox{display:inline-block;width:calc(var(--base)*.9);height:calc(var(--base)*.9);
  border:2px solid var(--ink);margin-right:var(--s3);vertical-align:middle}

.sms{background:var(--surface-quiet);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.bubble{max-width:80%;padding:var(--s3) var(--s4);border-radius:var(--r-lg);margin-bottom:var(--s3);font-size:var(--fs-sm)}
.bubble.them{background:var(--surface);border:2px solid var(--line)}
.bubble.me{background:var(--accent-wash);border:2px solid var(--accent);margin-left:auto}
.email{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md)}
.email .head{background:var(--band);padding:var(--s3) var(--s4);font-size:var(--fs-xs);color:var(--ink-soft)}
.email .body{padding:var(--s4);font-size:var(--fs-sm)}
.notice{background:var(--surface);border:4px solid var(--brand);border-radius:var(--r-md);padding:var(--s5);text-align:center}
.notice .big{font-family:var(--f-display);font-weight:900;font-size:var(--fs-xl);color:var(--bad)}

.j{background:#d3ebeb;color:#0b5f5f;border-bottom:3px solid #0f7d7d;border-radius:var(--r-sm);padding:0 var(--s2)}
.p{background:#fadfba;color:#8a5210;border-bottom:3px solid #c97a1a;border-radius:var(--r-sm);padding:0 var(--s2)}
.comma{color:var(--bad);font-size:1.5em;font-weight:900}
.gapbox{display:inline-block;min-width:5ch;border:2px dashed var(--ink-soft);border-radius:var(--r-sm);padding:0 var(--s3)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);font-size:var(--fs-xs);color:var(--ink-soft);margin-bottom:var(--s4)}

.board{display:grid;gap:var(--s2)}
.board .cat{background:var(--brand);color:var(--on-brand);font-family:var(--f-display);font-weight:900;
  font-size:var(--fs-sm);padding:var(--s3);text-align:center;border-radius:var(--r-sm)}
.board .val{background:var(--accent-wash);border:2px solid var(--accent);color:var(--accent-deep);
  font-family:var(--f-num);font-size:var(--fs-lg);padding:var(--s4);text-align:center;border-radius:var(--r-sm);cursor:pointer}
.board .val.gone{background:var(--surface-quiet);border-color:var(--line);color:var(--line)}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.door{aspect-ratio:3/4;border:3px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  font-family:var(--f-display);font-weight:900}
.door .no{font-size:var(--fs-xl);color:var(--ink-soft)}
.door.open{border-color:var(--good);background:var(--good-wash);color:var(--good)}
.door.started{border-color:var(--warm);background:var(--warm-wash);color:var(--warm)}

.stage-pan{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface-quiet);height:340px;touch-action:none;cursor:grab}
.stage-pan.grabbing{cursor:grabbing}
.stage-pan>.inner{position:absolute;top:0;left:0;transform-origin:top left}
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);background:var(--brand);
  color:#fff;border-radius:var(--r-pill);padding:var(--s3) var(--s5);font-size:var(--fs-sm);
  box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:60}
.skel{background:linear-gradient(90deg,var(--band) 25%,var(--surface) 37%,var(--band) 63%);
  background-size:400% 100%;border-radius:var(--r-sm);height:calc(var(--base)*.9);margin-bottom:var(--s3);
  animation:shim 1.4s linear infinite}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}

/* --- promoted components (were duplicated in single layouts) --- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.flip{perspective:1200px;cursor:pointer;height:calc(var(--base)*6)}
.fin{position:relative;width:100%;height:100%;transition:transform .5s var(--ease);transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);padding:var(--s3);text-align:center}
.back{transform:rotateY(180deg);background:var(--accent);border-color:var(--accent)}
.gut{display:grid;grid-template-columns:1fr minmax(170px,.45fr);gap:var(--s5)}
.gut aside{border-left:4px solid var(--accent);padding-left:var(--s4)}
.gw{margin-bottom:var(--s4);font-size:var(--fs-sm)}
.gw b{display:block;color:var(--accent-deep)}
.gw span{color:var(--ink-soft)}
.frow{display:grid;grid-template-columns:minmax(110px,.35fr) 1fr;gap:var(--s4);align-items:center;margin-bottom:var(--s3)}
.frow span{font-size:var(--fs-sm);color:var(--ink-soft)}
.fbox{border:2px solid var(--line);border-radius:var(--r-sm);background:var(--surface-quiet);
  padding:var(--s2) var(--s3);min-height:var(--tap-min);font-family:var(--f-num);display:flex;align-items:center}
.fbox.on{border-color:var(--good);background:var(--good-wash)}
.scr{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s4);align-items:start}
.who{font-family:var(--f-display);font-weight:900;color:var(--accent);min-width:2ch}
.line{font-size:var(--fs-sm);border-bottom:1px solid var(--line);padding-bottom:var(--s2)}
.hid .line.b{color:transparent;background:var(--surface-quiet);border-radius:var(--r-sm)}
.tin{font-family:var(--f-body);font-size:var(--fs-md);min-height:var(--tap-min);padding:var(--s2) var(--s3);
  border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);width:100%}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s4)}
.mock{border:3px solid var(--brand);border-radius:var(--r-md);background:var(--surface);overflow:hidden;margin-bottom:var(--s4)}
.mockbar{background:var(--brand);color:#fff;padding:var(--s2) var(--s3);font-size:var(--fs-xs);display:flex;gap:var(--s2);align-items:center}
.mockbody{padding:var(--s4);font-size:var(--fs-sm)}
.taglet{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--base)*1.2);
  height:calc(var(--base)*1.2);border-radius:var(--r-pill);background:var(--warm);color:#fff;
  font-family:var(--f-display);font-weight:900;font-size:var(--fs-xs);cursor:pointer;border:0}
.syl{font-family:var(--f-display);font-weight:900;font-size:var(--fs-lg);padding:var(--s3) var(--s4);
  border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);cursor:pointer;
  min-height:var(--tap-opt);transition:transform var(--dur) var(--ease)}
.syl.on{background:var(--accent-wash);border-color:var(--accent);transform:scale(1.18)}

.trk{position:relative;height:calc(var(--base)*1.6);background:var(--band);border-radius:var(--r-pill);
  margin:var(--s5) 0;touch-action:none;cursor:pointer}
.trk .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-wash);border-radius:var(--r-pill)}
.knb{position:absolute;top:50%;width:calc(var(--base)*1.7);height:calc(var(--base)*1.7);
  border-radius:var(--r-pill);background:var(--accent);border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);transition:left var(--dur) var(--ease)}
.stops{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;
  padding:0 var(--s3);pointer-events:none}
.stops span{font-family:var(--f-num);font-size:var(--fs-xs);color:var(--ink-soft)}

.scenebox{position:relative;height:300px;border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s4)}
.sclab{position:absolute;left:var(--s4);bottom:var(--s4);right:var(--s4);display:flex;gap:var(--s3);
  flex-wrap:wrap;align-items:center}
.sclab .btn{background:rgba(255,255,255,.92)}


/* === SKINS ================================================================
   A second axis. data-skin restyles every part without touching any of it.
   The default is no skin at all, so nothing already built changes.
   ========================================================================= */
[data-skin="editorial"]{
  --r-sm:2px;--r-md:3px;--r-lg:4px;--r-pill:3px;
  --line:#d8d2c6;--surface-alt:#fff;--band:#f4f1ea;--shadow:none;
  --f-display:Calibri,Carlito,"Segoe UI",Candara,Arial,sans-serif;
}
[data-skin="editorial"] h1,[data-skin="editorial"] h2,[data-skin="editorial"] h3,
[data-skin="editorial"] .display{letter-spacing:-.015em}
[data-skin="editorial"] .eyebrow{letter-spacing:.16em}
[data-skin="editorial"] .card,[data-skin="editorial"] .opt,
[data-skin="editorial"] .chip,[data-skin="editorial"] .mcard{border-width:1px}
[data-skin="editorial"] .mcard{border-left-width:4px}
[data-skin="editorial"] .btn{border-width:1px}
[data-skin="editorial"] .gt th{background:none;color:var(--ink);border-bottom:3px solid var(--ink)}
[data-skin="editorial"] .sectionbar{background:none;color:var(--ink);border-top:4px solid var(--ink)}
[data-skin="editorial"] .sectionbar .icon{background:none;color:var(--accent)}
[data-skin="editorial"] .sectionbar .t{color:var(--ink)}
[data-skin="editorial"] .sectionbar .k{color:var(--accent)}
[data-skin="editorial"] .activitybar{background:none;border-left-width:3px}
[data-skin="editorial"] .prog,[data-skin="editorial"] .prog>i{border-radius:0}

[data-skin="primary"]{
  --brand:#111111;--brand-deep:#000;--brand-soft:#f2f2ef;
  --accent:#0b5bd3;--accent-deep:#083f93;--accent-wash:#dce8fb;
  --warm:#e8a90c;--warm-light:#ffd977;--warm-wash:#fdf1d2;
  --good:#0b7a3e;--good-wash:#ddf0e4;--bad:#d0202a;--bad-wash:#fbdcdd;
  --ink:#111111;--line:#111111;--band:#f2f2ef;--shadow:none;
  --r-sm:0;--r-md:0;--r-lg:0;--r-pill:0;
}
[data-skin="primary"] .card,[data-skin="primary"] .mcard,[data-skin="primary"] .opt,
[data-skin="primary"] .chip,[data-skin="primary"] .btn,[data-skin="primary"] .bin{border-width:3px}

[data-skin="marker"]{
  --line:#0b2e4f;--band:#e8eef4;--shadow:5px 5px 0 var(--ink);

}
[data-skin="marker"] .card,[data-skin="marker"] .mcard,[data-skin="marker"] .opt,
[data-skin="marker"] .chip,[data-skin="marker"] .btn,[data-skin="marker"] .email,
[data-skin="marker"] .notice,[data-skin="marker"] .sms{border-width:3px;border-color:var(--ink);
  box-shadow:5px 5px 0 var(--ink)}
[data-skin="marker"] .btn:active,[data-skin="marker"] .opt:active{transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--ink)}
[data-skin="marker"] .fb{border:3px solid var(--ink);border-left-width:12px;box-shadow:5px 5px 0 var(--ink)}
[data-skin="marker"] .prog{border:3px solid var(--ink)}
[data-skin="marker"] .tag{border:2px solid var(--ink)}

[data-skin="soft"]{
  --surface:#eef1f5;--surface-alt:#eef1f5;--surface-quiet:#e8ecf2;--band:#e2e7ee;
  --line:#e2e7ee;--shadow:7px 7px 16px rgba(10,30,50,.12), -7px -7px 16px #ffffff;
  --r-sm:10px;--r-md:16px;--r-lg:24px;
}
[data-skin="soft"] .card,[data-skin="soft"] .mcard,[data-skin="soft"] .opt,
[data-skin="soft"] .chip,[data-skin="soft"] .btn{border-color:transparent;box-shadow:var(--shadow)}
[data-skin="soft"] .opt.picked,[data-skin="soft"] .chip.held{box-shadow:inset 5px 5px 12px rgba(10,30,50,.16),
  inset -5px -5px 12px #ffffff;background:var(--surface)}
[data-skin="soft"] .prog{box-shadow:inset 3px 3px 7px rgba(10,30,50,.16), inset -3px -3px 7px #fff;background:var(--surface)}
[data-skin="soft"] .gt td{border-color:var(--band)}

[data-skin="paper"]{
  --surface:#fbf7ef;--surface-alt:#f3ece0;--surface-quiet:#f6f1e6;--band:#f0e9db;
  --line:#cfc4ae;--shadow:none;--r-sm:3px;--r-md:5px;--r-lg:7px;
}
[data-skin="paper"] .card,[data-skin="paper"] .opt,[data-skin="paper"] .chip,
[data-skin="paper"] .mcard{border-width:1px}
[data-skin="paper"] .gt th{background:var(--accent-deep)}
[data-skin="paper"] .gt td{border-color:var(--line)}
[data-skin="paper"] .sectionbar{border-radius:3px}

[data-skin="toolkit"]{
  --brand:#173a5e;--brand-deep:#22303f;--brand-soft:#e8eff6;
  --accent:#0f766e;--accent-deep:#0c5f59;--accent-wash:#e6f3f2;
  --warm:#f2a541;--warm-light:#fdd9a0;--warm-wash:#fdf3e2;
  --good:#1e7d46;--good-wash:#e7f5ec;--bad:#b3383e;--bad-wash:#fbeaea;
  --ink:#22303f;--ink-soft:#5b6b7b;
  --surface:#ffffff;--surface-alt:#f6f4ef;--surface-quiet:#f1efe9;
  --band:#eef1f5;--line:#e3dfd6;--focus:#f2a541;--on-brand:#ffffff;--on-accent:#ffffff;
  --shadow:0 1px 4px rgba(34,48,63,.10);
  --r-sm:8px;--r-md:10px;--r-lg:14px;--r-pill:999px;
  --f-display:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-skin="toolkit"] h1,[data-skin="toolkit"] h2,[data-skin="toolkit"] h3,
[data-skin="toolkit"] .display,[data-skin="toolkit"] .q{font-weight:800;letter-spacing:-.01em}
[data-skin="toolkit"] .topbar,[data-skin="toolkit"] .sectionbar{
  background:linear-gradient(135deg,#22303f,#1d517f)}
[data-skin="toolkit"] .sectionbar .icon{background:rgba(255,255,255,.12)}
[data-skin="toolkit"] .card,[data-skin="toolkit"] .mcard,[data-skin="toolkit"] .email,
[data-skin="toolkit"] .notice{border-width:1px;box-shadow:var(--shadow)}
[data-skin="toolkit"] .btn{border-width:1.5px;border-color:#cfd9e4;color:var(--brand)}
[data-skin="toolkit"] .btn:hover{border-color:#1d517f}
[data-skin="toolkit"] .btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
[data-skin="toolkit"] .btn.wait{background:var(--warm);border-color:var(--warm);color:var(--brand-deep);font-weight:700}
[data-skin="toolkit"] .opt,[data-skin="toolkit"] .chip{border-width:1.5px;border-color:#cfd9e4;color:var(--brand)}

[data-skin="toolkit"] .chead .n{background:var(--warm);color:var(--brand-deep);font-weight:800}
[data-skin="toolkit"] .tag{background:var(--warm-wash);border:1px solid var(--warm);color:#7a5310;font-weight:700}
[data-skin="toolkit"] .eyebrow{color:var(--accent);letter-spacing:.11em;text-transform:uppercase}
[data-skin="toolkit"] .gt th{background:var(--brand)}
[data-skin="toolkit"] .callout.warm{background:var(--warm-wash);border-color:var(--warm)}
[data-skin="toolkit"] .callout.cool{background:var(--accent-wash);border-left-color:var(--accent)}
[data-skin="toolkit"] .mcard{border-left-width:6px}
[data-skin="toolkit"] :focus-visible{outline:3px solid var(--warm);outline-offset:1px}


.rtop{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.rtop .prog{flex:1}
.mcard.built{border-left-color:var(--good);background:var(--good-wash)}

.kbd{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:var(--s2);max-width:520px;margin:0 auto}
.keyb{min-height:var(--tap-min);border:2px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-family:var(--f-display);font-weight:900;font-size:var(--fs-sm);color:var(--ink);cursor:pointer}
.keyb.hit{background:var(--good);border-color:var(--good);color:#fff}
.keyb.miss{background:var(--surface-quiet);border-color:var(--line);color:var(--line)}
.keyb.used{opacity:.35}

/* --- dragging on a touch screen -------------------------------------------
   On a phone the browser takes a drag as a scroll or a text selection and
   cancels the pointer stream. touch-action is not inherited, so the rule has
   to reach the children of a drag surface as well as the surface itself. */
.ba,.ba *,.trk,.trk *,.slide,.slide *,.split,.split *,.sdiv,
.dial,.dial *,.stage-pan,.stage-pan *,.stk,.stk *,.swc,.swc *,
.hold,.hold *,.pullbox,.pullbox *,.whl,.whl *,.dr,.fan,.fan *,.cfl,.cfl *{
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.car{touch-action:pan-y}

/* --- small screens: every layout has to survive a phone --- */
img,svg,canvas,video{max-width:100%}
@media (max-width:640px){
  .wrap{padding:var(--s4) var(--s3)}
  h1{font-size:var(--fs-xl)}
  .two,.gut,.frow{grid-template-columns:1fr}
  .gut aside{border-left:0;border-top:4px solid var(--accent);padding:var(--s4) 0 0}
  .doors{grid-template-columns:repeat(2,1fr)}
  .board .val{font-size:var(--fs-md);padding:var(--s3) var(--s2)}
  .board .cat{font-size:var(--fs-xs);padding:var(--s2)}
  .bubble{max-width:92%}
  .barrow>.btn{flex:1 1 100%}
  .sectionbar .icon{width:calc(var(--base)*1.8)}
  .gt{font-size:var(--fs-xs)}
  .chip,.opt{width:auto}
  /* a wide table scrolls sideways instead of crushing its columns */
  .gt{display:block;overflow-x:auto;white-space:normal}
  .gt th,.gt td{min-width:7ch}
}
@media print{body{background:#fff;font-size:11pt}.topbar,.bottombar,.no-print{display:none!important}
  /* floating furniture has no place on paper */
  .fab,.helppanel,.toast,.stack,.snack,.jump,.ptr,.dwr,.shade,.ov,.dock,.pnav,.burger{display:none!important}
  /* anything that opens on a tap prints open */
  .accb,.drawer2{max-height:none!important}
  .brb{display:block!important}
  .fold .fp,.cbs i,.stg i,.stg .stt,.pst .pl{transform:none!important;opacity:1!important}
  .xp{position:static;opacity:1;transform:none;pointer-events:auto}
  .dimwrap.dimming .fq{opacity:1!important;filter:none!important}
  /* three dimensions do not print, so lay both faces out flat */
  .flip,.bk2{height:auto;perspective:none}
  .fin{transform:none!important}
  .face,.pg{position:static;backface-visibility:visible;transform:none!important;margin-bottom:var(--s3)}
  .back{background:var(--surface);color:var(--ink)}
  /* wide things print in full, canvases print as nothing */
  .tscroll{overflow:visible}
  canvas{display:none}
  .scenebox,.fall,.stg,.cfl,.fan,.stk,.pic2{height:auto;min-height:150px}
  .spot:before,.blk i{display:none}
  .blk h1{opacity:1!important}
  .fana{opacity:1!important;position:static;transform:none!important;margin:var(--s2) var(--s2) 0 0}
  .fanwrap{height:auto;display:block}
  .tt span,.wm span{opacity:1!important}
  .ft{display:none}
  .cvi{position:static;transform:none!important;opacity:1!important;display:inline-flex;margin:var(--s2)}
  .cfl{display:block}
  .pc .pin{transform:none!important}
  .pc .pf{position:static;backface-visibility:visible}
  .pb{background:var(--surface);color:var(--ink)}
  .cf{position:static;transform:none!important;display:inline-flex;margin:var(--s2);background:var(--surface);color:var(--ink);border-color:var(--line)}
  .cube,.cubew{transform:none!important;width:auto;height:auto;perspective:none;display:block}
  .fcd{position:static;transform:none!important;display:inline-flex;margin:var(--s2)}
  .card,.mcard{box-shadow:none;break-inside:avoid-page}.wrap{max-width:none;padding:0}}
</script>

<style>

   '<div class="door"><div class="no">7</div></div><div class="door"><div class="no">8</div></div></div></div>',
 j:"var KEY='demo.doors',won={};try{won=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){won={};}var doors=document.querySelectorAll('.door');function save(){try{localStorage.setItem(KEY,JSON.stringify(won));}catch(e){}}function paint(){var n=0;[].forEach.call(doors,function(d,i){if(won[i]){d.className='door open';d.innerHTML='<div class=\"no\">'+(i+1)+'</div><div class=\"sub\">Done</div>';n++;}});document.querySelector('.callout').innerHTML='<b>Welcome back.</b> You have '+n+' key'+(n===1?'':'s')+'.';}[].forEach.call(doors,function(d,i){d.style.cursor='pointer';d.onclick=function(){won[i]=1;save();paint();};});paint();"},

{c:'I13',p:'I',n:'Shuffle and deal',t:['live','random','engine'],

 j:"var OPTS=['Send me the form.','Could you send me the form?','You send it now.'],RIGHT=1;"+

   "function deal(){var idx=shuffle(OPTS.map(function(o,i){return i;}));var host=document.getElementById('opts');host.innerHTML='';"+

{c:'I18',p:'I',n:'Constellation background',t:['live','background','canvas','motion'],
 s:['canvas host'],
 pairs:['J02','Q07','D01'],
 note:'Canvas dots joined by lines. Caps at 40 dots so an old classroom laptop keeps up.',
 h:'<div style="position:relative;background:#071f36;min-height:300px">'+
   '<canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>'+
   '<div class="wrap" style="position:relative;text-align:center;padding:var(--s7) var(--s4)">'+
   '<h1 style="color:#fff">Vocabulary review</h1></div></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=[],N=40,stop=false;"+
   "function size(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;}size();"+
   "for(var i=0;i<N;i++)P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,"+
   "vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35});"+
   "if(matchMedia('(prefers-reduced-motion:reduce)').matches)stop=true;"+
   "function tick(){cx.clearRect(0,0,cv.width,cv.height);"+
   "for(var i=0;i<N;i++){var p=P[i];if(!stop){p.x+=p.vx;p.y+=p.vy;}"+
   "if(p.x<0||p.x>cv.width)p.vx*=-1;if(p.y<0||p.y>cv.height)p.vy*=-1;"+
   "cx.fillStyle='rgba(63,179,179,.9)';cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill();"+
   "for(var k=i+1;k<N;k++){var q=P[k],d=Math.hypot(p.x-q.x,p.y-q.y);"+
   "if(d<110){cx.strokeStyle='rgba(63,179,179,'+(1-d/110)*.35+')';cx.beginPath();"+
   "cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}}}"+
   "requestAnimationFrame(tick);}tick();window.addEventListener('resize',size);"},

{c:'I19',p:'I',n:'Save and resume',t:['live','storage','engine'],

 h:'<div class="wrap"><div class="callout warm" id="back" style="display:none"><b>Welcome back.</b> '+

   'This device will not save your answers. You can still do every part.</div></div>',
 j:"var KEY='demo.progress',done={},ok=true;"+
   "try{localStorage.setItem('probe','1');localStorage.removeItem('probe');}catch(e){ok=false;}"+
   "if(!ok)document.getElementById('warn').style.display='block';"+
   "try{done=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){done={};}"+
   "function paint(){var qs=document.getElementById('qs').children,n=0;"+
   "for(var i=0;i<qs.length;i++){if(done[i]){qs[i].classList.add('right');n++;}else{qs[i].classList.remove('right');}}"+
   "var b=document.getElementById('back');b.style.display=n?'block':'none';"+
   "document.getElementById('cnt').textContent='You have '+n+' done.';}"+
   "function save(){if(!ok)return;try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}"+

   "done[[].indexOf.call(b.parentNode.children,b)]=1;save();paint();});"+
   "document.getElementById('reset').onclick=function(){done={};save();paint();};"+
   "setInterval(save,1500);window.addEventListener('pagehide',save);paint();"},

{c:'D02',p:'D',n:'Tick two',t:['drill','choose','tap','live'],

   "held=null;});"},

{c:'F09',p:'F',n:'Mic level meter',t:['audio','record','live'],
 s:['meter','permission','warning'],
 pairs:['F04','F11','F03'],
 note:'Live bars while recording. Most failed recordings are level problems, and the meter catches them before playback.',
 h:'<div class="wrap"><div class="card"><div class="q">Check your voice level</div>'+
   '<canvas id="cv" height="90" style="width:100%;height:90px;background:var(--surface-quiet);'+
   'border:2px solid var(--line);border-radius:var(--r-md)"></canvas>'+
   '<p class="sub" id="say">Tap Start, then speak normally.</p>'+
   '<div class="barrow"><button class="btn solid" id="go">Start</button>'+
   '<button class="btn quiet" id="stop">Stop</button></div>'+
   '<div class="fb" id="fb" style="display:none"></div></div></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),ac=null,an=null,st=null,run=false;"+
   "function note(k,m){var f=document.getElementById('fb');f.className='fb '+k;f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+(k==='good'?'Good level.':'Note')+'</span>'+m;}"+
   "function draw(){if(!run)return;cv.width=cv.offsetWidth;var n=an.frequencyBinCount,a=new Uint8Array(n);"+
   "an.getByteFrequencyData(a);cx.clearRect(0,0,cv.width,cv.height);var bars=24,w=cv.width/bars,peak=0;"+
   "for(var i=0;i<bars;i++){var v=a[Math.floor(i*n/bars/2)]/255;if(v>peak)peak=v;"+
   "cx.fillStyle=v>0.75?'#b3261e':(v>0.18?'#0f7d7d':'#c9d4de');"+
   "cx.fillRect(i*w+2,cv.height-(v*cv.height),w-4,v*cv.height);}"+
   "document.getElementById('say').textContent=peak<0.12?'Too quiet. Move closer.':"+
   "(peak>0.85?'Too loud. Move back a little.':'That level is good.');"+
   "requestAnimationFrame(draw);}"+
   "document.getElementById('go').onclick=function(){if(!navigator.mediaDevices){"+
   "note('info','This device will not record. Read the sentence aloud to a partner instead.');return;}"+
   "navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){st=s;"+
   "ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;"+
   "ac.createMediaStreamSource(s).connect(an);run=true;draw();note('good','Speak normally. Keep the bars in the middle.');})"+
   ".catch(function(){note('info','The microphone was not allowed. Everything else still works.');});};"+
   "document.getElementById('stop').onclick=function(){run=false;if(st)st.getTracks().forEach(function(t){t.stop();});"+
   "try{if(ac)ac.close();}catch(e){}cx.clearRect(0,0,cv.width,cv.height);};"},

{c:'F10',p:'F',n:'Waveform compare',t:['audio','record','speaking','live'],
 s:['model bar','your wave','length'],
 pairs:['F04','F12','H01'],
 note:'Draws the shape of the recording under the model, so a student sees where they rushed or stopped.',
 h:'<div class="wrap"><div class="card"><div class="q">Could you tell me where the library is?</div>'+
   '<p class="sub">The model takes about 3 seconds.</p>'+
   '<div class="prog" style="margin-bottom:var(--s3)"><i style="width:60%"></i></div>'+
   '<canvas id="cv" height="80" style="width:100%;height:80px;background:var(--surface-quiet);'+
   'border:2px solid var(--line);border-radius:var(--r-md)"></canvas>'+
   '<div class="barrow" style="margin-top:var(--s4)"><button class="btn solid" id="model">Hear the model</button>'+
   '<button class="btn wait" id="rec">Record</button></div>'+
   '<div class="fb" id="fb" style="display:none"></div></div></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),marks=[],run=false,ac=null,an=null,st=null,t0=0;"+
   "function note(m){var f=document.getElementById('fb');f.className='fb info';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">Note</span>'+m;}"+
   "document.getElementById('model').onclick=function(){try{var u=new SpeechSynthesisUtterance("+
   "'Could you tell me where the library is?');u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);}"+
   "catch(e){note('No voice here. The teacher can read it.');}};"+
   "function paint(){cv.width=cv.offsetWidth;cx.clearRect(0,0,cv.width,cv.height);"+
   "var mid=cv.height/2;cx.strokeStyle='#c9d4de';cx.beginPath();cx.moveTo(0,mid);cx.lineTo(cv.width,mid);cx.stroke();"+
   "var span=Math.max(marks.length,60);cx.fillStyle='#0f7d7d';"+
   "marks.forEach(function(v,i){var x=i/span*cv.width,hgt=v*mid;cx.fillRect(x,mid-hgt,2,hgt*2);});}"+
   "function loop(){if(!run)return;var a=new Uint8Array(an.frequencyBinCount);an.getByteTimeDomainData(a);"+
   "var peak=0;for(var i=0;i<a.length;i++){var v=Math.abs(a[i]-128)/128;if(v>peak)peak=v;}"+
   "marks.push(peak);paint();"+
   "if((Date.now()-t0)>6000){stop();return;}requestAnimationFrame(loop);}"+
   "function stop(){run=false;if(st)st.getTracks().forEach(function(t){t.stop();});try{if(ac)ac.close();}catch(e){}"+
   "document.getElementById('rec').textContent='Record';document.getElementById('rec').className='btn wait';"+
   "var secs=(marks.length/60).toFixed(1);note('Yours ran about '+secs+' seconds. The model takes about 3. '+"+
   "'If yours is much shorter, you are rushing.');}"+
   "document.getElementById('rec').onclick=function(){if(run){stop();return;}"+
   "if(!navigator.mediaDevices){note('This device will not record. Everything else still works.');return;}"+
   "navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){st=s;marks=[];"+
   "ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=1024;"+
   "ac.createMediaStreamSource(s).connect(an);run=true;t0=Date.now();"+
   "document.getElementById('rec').textContent='Stop';document.getElementById('rec').className='btn go';loop();})"+
   ".catch(function(){note('The microphone was not allowed. Everything else still works.');});};paint();"},

   "(n>12?'Long round. Watch the clock.':'About right for one round.');"+
   "if(!matchMedia('(prefers-reduced-motion:reduce)').matches)"+
   "el.animate([{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:220});}"+
   "document.getElementById('up').onclick=function(){n=Math.min(20,n+1);paint();};"+
   "document.getElementById('dn').onclick=function(){n=Math.max(3,n-1);paint();};paint();"},

{c:'K04',p:'K',n:'Magnetic button',t:['live','control','motion'],
 s:['button','pull'],
 pairs:['J04','U02','G02'],
 note:'The main action leans towards the finger. Small pull only, or it becomes hard to hit.',
 h:'<div class="wrap" style="text-align:center;padding:var(--s7) var(--s4)">'+
   '<button class="btn go" id="b" style="font-size:var(--fs-lg)">Start the game</button>'+
   '<p class="sub">Move over the button.</p></div>',
 j:"var b=document.getElementById('b'),off=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "document.addEventListener('pointermove',function(e){if(off)return;var r=b.getBoundingClientRect();"+
   "var cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy;"+
   "var dist=Math.hypot(dx,dy);if(dist>160){b.style.transform='';return;}"+
   "b.style.transform='translate('+(dx*0.18)+'px,'+(dy*0.18)+'px)';});"+
   "b.addEventListener('pointerleave',function(){b.style.transform='';});"},

{c:'K05',p:'K',n:'Floating help',t:['live','control','help'],
 s:['button','panel'],
 pairs:['N05','K13','G02'],
 note:'Help that follows the page. It opens in place, so nobody loses their spot.',
 h:'<div class="wrap"><div class="card"><div class="q">Write your reply to Julia.</div>'+
   '<p class="sub">Scroll down. The help button stays with you.</p><div style="height:320px"></div>'+
   '<p class="sub">Still here.</p></div></div>'+
   '<button class="fab" id="fab" aria-label="Help">?</button>'+
   '<div class="helppanel" id="hp"><b>How to start</b>'+
   '<div>1. Say hello with the name.</div><div>2. Answer the question.</div>'+
   '<div>3. Put the closing and your name on separate lines.</div>'+
   '<button class="btn quiet" id="sh" style="margin-top:var(--s3)">Close</button></div>',
 k:'.fab{position:fixed;right:var(--s4);bottom:var(--s4);width:calc(var(--base)*2.2);height:calc(var(--base)*2.2);'+
   'border-radius:var(--r-pill);background:var(--accent);color:#fff;border:0;font-family:var(--f-display);'+
   'font-weight:900;font-size:var(--fs-lg);box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:40;cursor:pointer}'+
   '.helppanel{position:fixed;right:var(--s4);bottom:calc(var(--base)*3.4);max-width:320px;background:var(--surface);'+
   'border:2px solid var(--accent);border-radius:var(--r-lg);padding:var(--s4);font-size:var(--fs-sm);'+
   'display:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}'+
   '.helppanel.on{display:block}',
 j:"var hp=document.getElementById('hp');"+
   "document.getElementById('fab').onclick=function(){hp.classList.toggle('on');};"+
   "document.getElementById('sh').onclick=function(){hp.classList.remove('on');};"},

{c:'K06',p:'K',n:'Part dock',t:['live','navigation'],
 s:['dock','current part'],
 pairs:['N03','I20','G02'],
 note:'Jump between parts without going back to the menu. The one under the finger grows.',
 h:'<div class="wrap"><div class="card" id="now"><div class="q">Part 1</div></div>'+
   '<div class="dock" id="dk"></div></div>',
 k:'.dock{position:sticky;bottom:var(--s3);display:flex;justify-content:center;gap:var(--s2);'+
   'background:var(--surface);border:2px solid var(--line);border-radius:var(--r-pill);padding:var(--s2);margin-top:var(--s5)}'+
   '.dk{min-width:var(--tap-min);min-height:var(--tap-min);border-radius:var(--r-pill);border:2px solid transparent;'+
   'background:var(--surface-quiet);font-family:var(--f-num);cursor:pointer;'+
   'transition:transform var(--dur) var(--ease),background var(--dur)}'+
   '.dk:hover{transform:scale(1.25)}'+
   '.dk.on{background:var(--accent);color:#fff;border-color:var(--accent)}',
 j:"var dk=document.getElementById('dk'),at=0,names=['Read it','Say it','Write it','Check it'];"+
   "names.forEach(function(nm,i){var b=document.createElement('button');b.className='dk'+(i?'':' on');"+
   "b.textContent=i+1;b.onclick=function(){at=i;"+
   "[].forEach.call(dk.children,function(c,k){c.classList.toggle('on',k===i);});"+
   "document.getElementById('now').innerHTML='<div class=\"q\">Part '+(i+1)+'</div><p>'+nm+'</p>';};"+
   "dk.appendChild(b);});"},

{c:'K07',p:'K',n:'Menu morph',t:['live','navigation'],
 s:['button','drawer'],
 pairs:['N04','N03','G02'],
 note:'The three lines become a cross, so it is obvious the same button closes it.',
 h:'<div class="wrap"><button class="burger" id="bg" aria-label="Menu"><i></i><i></i><i></i></button>'+
   '<div class="drawer2" id="dw"><button class="mcard"><span class="t">Part 1</span></button>'+
   '<button class="mcard"><span class="t">Part 2</span></button>'+
   '<button class="mcard"><span class="t">Part 3</span></button></div></div>',
 k:'.burger{width:var(--tap-min);height:var(--tap-min);border:2px solid var(--brand);border-radius:var(--r-md);'+
   'background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;cursor:pointer}'+
   '.burger i{display:block;height:3px;background:var(--brand);transition:transform var(--dur) var(--ease),opacity var(--dur)}'+
   '.burger.on i:nth-child(1){transform:translateY(8px) rotate(45deg)}'+
   '.burger.on i:nth-child(2){opacity:0}'+
   '.burger.on i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}'+
   '.drawer2{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}'+
   '.drawer2.on{max-height:600px;margin-top:var(--s4)}',
 j:"var b=document.getElementById('bg'),d=document.getElementById('dw');"+
   "b.onclick=function(){b.classList.toggle('on');d.classList.toggle('on');};"},

{c:'K08',p:'K',n:'Tab bar',t:['live','navigation'],
 s:['tabs','panels','indicator'],
 pairs:['M01','N03','G02'],
 note:'Reading, writing and speaking in one file. The bar slides so the class sees which one moved.',
 h:'<div class="wrap"><div class="tabs" id="tb"><span class="ink" id="ink"></span></div>'+
   '<div class="card" id="pane"></div></div>',
 k:'.tabs{position:relative;display:flex;border-bottom:3px solid var(--line);margin-bottom:var(--s4)}'+
   '.tab{flex:1;min-height:var(--tap-min);background:none;border:0;font-family:var(--f-body);'+
   'font-size:var(--fs-sm);color:var(--ink-soft);cursor:pointer;padding:var(--s3)}'+
   '.tab.on{color:var(--accent-deep);font-weight:700}'+
   '.ink{position:absolute;bottom:-3px;height:3px;background:var(--accent);transition:all var(--dur) var(--ease)}',
 j:"var names=['Read','Write','Speak'],body=['Read the message from Julia.','Write your reply.',"+
   "'Say your reply to a partner.'],tb=document.getElementById('tb'),ink=document.getElementById('ink');"+
   "function go(i){[].forEach.call(tb.querySelectorAll('.tab'),function(t,k){t.classList.toggle('on',k===i);});"+
   "ink.style.width=(100/names.length)+'%';ink.style.left=(i*100/names.length)+'%';"+
   "document.getElementById('pane').innerHTML='<div class=\"q\">'+names[i]+'</div><p>'+body[i]+'</p>';}"+
   "names.forEach(function(nm,i){var b=document.createElement('button');b.className='tab';b.textContent=nm;"+
   "b.onclick=function(){go(i);};tb.insertBefore(b,ink);});go(0);"},

{c:'K09',p:'K',n:'Tilt card',t:['live','flashcard','3d','motion'],
 s:['card','tilt'],
 pairs:['O11','D09','G02'],
 note:'The card tips towards the finger. Turn it off for anyone who finds movement uncomfortable.',
 h:'<div class="wrap"><div class="tiltwrap"><div class="card tiltc" id="c">'+
   '<div class="q" style="margin:0">receipt</div>'+
   '<p class="sub">the paper that proves you paid</p></div></div>'+
   '<button class="btn quiet" id="off">Turn the movement off</button></div>',
 k:'.tiltwrap{perspective:900px}'+
   '.tiltc{transition:transform var(--dur) var(--ease);will-change:transform}',
 j:"var c=document.getElementById('c'),off=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "document.addEventListener('pointermove',function(e){if(off)return;var r=c.getBoundingClientRect();"+
   "var x=(e.clientX-r.left)/r.width-0.5,y=(e.clientY-r.top)/r.height-0.5;"+
   "if(Math.abs(x)>1||Math.abs(y)>1){c.style.transform='';return;}"+
   "c.style.transform='rotateY('+(x*10)+'deg) rotateX('+(-y*10)+'deg)';});"+
   "document.getElementById('off').onclick=function(){off=!off;c.style.transform='';"+
   "this.textContent=off?'Turn the movement on':'Turn the movement off';};"},

{c:'K10',p:'K',n:'Frosted panel',t:['live','overlay'],
 s:['panel','page behind'],
 pairs:['N04','K11','G02'],
 note:'An overlay that keeps the page readable behind it. It falls back to a solid panel where blur is not supported.',
 h:'<div class="wrap"><div class="card"><div class="q">Part 2 of 6</div>'+
   '<p>Read the message and answer the questions about the day and the time.</p></div>'+
   '<button class="btn solid" id="go">Show the instructions</button>'+
   '<div class="ov" id="ov"><div class="fr"><div class="q">Before you start</div>'+
   '<p>Read the whole message once. Do not answer yet.</p>'+
   '<button class="btn go" id="cl">I am ready</button></div></div></div>',
 k:'.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:var(--s4);z-index:40;'+
   'background:rgba(11,46,79,.45)}'+
   '@supports (backdrop-filter:blur(6px)){.ov{backdrop-filter:blur(6px);background:rgba(246,242,234,.55)}}'+
   '.ov.on{display:flex}'+
   '.fr{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);max-width:520px}',
 j:"var ov=document.getElementById('ov');"+
   "document.getElementById('go').onclick=function(){ov.classList.add('on');};"+
   "document.getElementById('cl').onclick=function(){ov.classList.remove('on');};"},

{c:'K11',p:'K',n:'Spotlight card',t:['live','cards','motion'],
 s:['cards','light'],
 pairs:['K09','O03','G02'],
 note:'A soft light follows the finger across the tiles, so the one being chosen is obvious on a big screen.',
 h:'<div class="wrap"><div class="tiles" id="t"></div></div>',
 k:'.spot{position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);'+
   'border-radius:var(--r-lg);padding:var(--s5);cursor:pointer;text-align:left;width:100%;'+
   'font-family:var(--f-body);font-size:var(--fs-md);color:var(--ink)}'+
   '.spot:before{content:"";position:absolute;inset:0;opacity:0;transition:opacity var(--dur);'+
   'background:radial-gradient(160px circle at var(--mx) var(--my),var(--accent-wash),transparent 70%)}'+
   '.spot.lit:before{opacity:1}'+
   '.spot span{position:relative}',
 j:"var names=['Openings','Closings','Days and times','Polite requests'],t=document.getElementById('t');"+
   "names.forEach(function(n){var b=document.createElement('button');b.className='spot';"+
   "b.innerHTML='<span><b>'+n+'</b><br>6 questions</span>';"+
   "b.addEventListener('pointermove',function(e){var r=b.getBoundingClientRect();"+
   "b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px');"+
   "b.classList.add('lit');});"+
   "b.addEventListener('pointerleave',function(){b.classList.remove('lit');});t.appendChild(b);});"},

{c:'K12',p:'K',n:'Copy confirm',t:['live','control','clipboard'],
 s:['button','tick'],
 pairs:['I10','R02','G02'],
 note:'The label becomes a tick, then comes back. It falls back to the old copy command on a file opened offline.',
 h:'<div class="wrap"><div class="card"><p id="tx">Dear Ms Chen,<br>I am writing about my library card.</p>'+
   '<button class="btn" id="cp"><span id="lb">Copy this</span></button></div></div>',
 j:"var b=document.getElementById('cp'),lb=document.getElementById('lb');"+
   "var t='Dear Ms Chen,\\nI am writing about my library card.';"+
   "function ok(){lb.textContent='\\u2713 Copied';b.className='btn go';"+
   "setTimeout(function(){lb.textContent='Copy this';b.className='btn';},1600);}"+
   "function legacy(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.top='-999px';"+
   "document.body.appendChild(a);a.select();var g=false;try{g=document.execCommand('copy');}catch(e){}a.remove();"+
   "if(g)ok();else{lb.textContent='Press and hold to copy';setTimeout(function(){lb.textContent='Copy this';},1800);}}"+
   "b.onclick=function(){if(navigator.clipboard&&window.isSecureContext)"+
   "navigator.clipboard.writeText(t).then(ok,legacy);else legacy();};"},

{c:'K13',p:'K',n:'Alert bell',t:['live','feedback','motion'],
 s:['bell','count'],
 pairs:['R05','K20','G02'],
 note:'For a new task from the teacher. It rings once and keeps a count, rather than nagging.',
 h:'<div class="wrap"><div class="barrow" style="align-items:center">'+
   '<button class="bell" id="bl" aria-label="Tasks">&#128276;<span class="badge" id="bd">0</span></button>'+
   '<button class="btn" id="add">Send a new task</button></div>'+
   '<div id="list" style="margin-top:var(--s4)"></div></div>',
 k:'.bell{position:relative;width:calc(var(--base)*2);height:calc(var(--base)*2);border-radius:var(--r-pill);'+
   'border:2px solid var(--line);background:var(--surface);font-size:var(--fs-lg);cursor:pointer}'+
   '.badge{position:absolute;top:-4px;right:-4px;min-width:calc(var(--base)*.9);height:calc(var(--base)*.9);'+
   'border-radius:var(--r-pill);background:var(--bad);color:#fff;font-family:var(--f-num);'+
   'font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;padding:0 5px}',
 j:"var n=0,bd=document.getElementById('bd'),bl=document.getElementById('bl');"+
   "document.getElementById('add').onclick=function(){n++;bd.textContent=n;"+
   "if(!matchMedia('(prefers-reduced-motion:reduce)').matches)"+
   "bl.animate([{transform:'rotate(0)'},{transform:'rotate(-14deg)'},{transform:'rotate(12deg)'},"+
   "{transform:'rotate(0)'}],{duration:420});};"+
   "bl.onclick=function(){if(!n)return;var l=document.getElementById('list');l.innerHTML='';"+
   "for(var i=1;i<=n;i++){var d=document.createElement('div');d.className='fb info';"+
   "d.innerHTML='<span class=\"lead\">Task '+i+'</span>Finish Part '+i+' before Friday.';l.appendChild(d);}"+
   "n=0;bd.textContent='0';};"},

{c:'K14',p:'K',n:'Fly to the bank',t:['live','vocabulary','motion'],
 s:['word','bank','count'],
 pairs:['M05','I01','G02'],
 note:'A collected word flies into the word bank, so the class sees where it went.',
 h:'<div class="wrap"><div class="barrow" id="ws"></div>'+
   '<div class="card" id="bank" style="margin-top:var(--s5)"><div class="q">My word bank <span id="n">0</span></div>'+
   '<div id="in"></div></div></div>',
 j:"var words=['appointment','receipt','deadline','notice'],n=0;"+
   "var ws=document.getElementById('ws'),bank=document.getElementById('bank');"+
   "words.forEach(function(w){var b=document.createElement('button');b.className='chip';b.textContent=w;"+
   "b.onclick=function(){if(b.classList.contains('used'))return;b.classList.add('used');"+
   "var r1=b.getBoundingClientRect(),r2=bank.getBoundingClientRect();"+
   "var fly=document.createElement('div');fly.textContent=w;"+
   "fly.style.cssText='position:fixed;left:'+r1.left+'px;top:'+r1.top+'px;background:var(--accent);color:#fff;'+"+
   "'padding:var(--s2) var(--s4);border-radius:var(--r-pill);z-index:50;font-size:var(--fs-sm)';"+
   "document.body.appendChild(fly);"+
   "var done=function(){fly.remove();n++;document.getElementById('n').textContent=n;"+
   "var c=document.createElement('button');c.className='chip';c.textContent=w;document.getElementById('in').appendChild(c);};"+
   "if(matchMedia('(prefers-reduced-motion:reduce)').matches){done();return;}"+
   "fly.animate([{transform:'none',opacity:1},{transform:'translate('+(r2.left-r1.left+20)+'px,'+"+
   "(r2.top-r1.top+20)+'px) scale(.6)',opacity:.4}],{duration:520,easing:'cubic-bezier(.2,.7,.3,1)'});"+
   "setTimeout(done,520);};ws.appendChild(b);});"},

{c:'K15',p:'K',n:'Drag reorder',t:['live','sort','pointer'],
 s:['list','handle'],
 pairs:['N08','I15','G02'],
 note:'The dragging version, for a laptop. On the smartscreen use the tap version instead.',
 h:'<div class="wrap"><div class="card"><div class="q">Put the message in order.</div>'+
   '<div id="list"></div><p class="sub">Press and drag a line.</p></div></div>',
 k:'.dr{padding:var(--s3) var(--s4);margin-bottom:var(--s3);border:2px solid var(--line);'+
   'border-radius:var(--r-md);background:var(--surface);font-size:var(--fs-sm);cursor:grab;touch-action:none}'+
   '.dr.drag{opacity:.6;border-color:var(--accent);cursor:grabbing}',
 j:"var lines=['Hi Nan,','Are you free on Saturday?','We are meeting at ten.','See you there,'];"+
   "var host=document.getElementById('list'),held=null;"+
   "lines.forEach(function(t){var d=document.createElement('div');d.className='dr';d.textContent=t;host.appendChild(d);});"+
   "host.addEventListener('pointerdown',function(e){var d=e.target.closest('.dr');if(!d)return;"+
   "held=d;d.classList.add('drag');try{d.setPointerCapture(e.pointerId);}catch(err){}});"+
   "host.addEventListener('pointermove',function(e){if(!held)return;"+
   "var over=document.elementFromPoint(e.clientX,e.clientY);if(!over)return;"+
   "over=over.closest('.dr');if(!over||over===held)return;"+
   "var r=over.getBoundingClientRect();host.insertBefore(held,e.clientY<r.top+r.height/2?over:over.nextSibling);});"+
   "host.addEventListener('pointerup',function(){if(held)held.classList.remove('drag');held=null;});"},

{c:'K16',p:'K',n:'Column move',t:['live','sort','tap'],
 s:['two columns','cards'],
 pairs:['D03','N08','G02'],
 note:'Tap a card, then tap a column. It moves with a short slide so the change is easy to follow.',
 h:'<div class="wrap"><div class="two">'+
   '<div class="col" data-c="friend"><div class="ch">To a friend</div></div>'+
   '<div class="col" data-c="office"><div class="ch">To the office</div></div></div></div>',
 k:'.col{border:2px dashed var(--accent);border-radius:var(--r-lg);background:var(--accent-wash);padding:var(--s3);min-height:200px}'+
   '.ch{font-family:var(--f-display);font-weight:900;font-size:var(--fs-sm);color:var(--accent-deep);margin-bottom:var(--s3)}'+
   '.cc{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:var(--s3);'+
   'margin-bottom:var(--s2);font-size:var(--fs-sm);cursor:pointer}'+
   '.cc.held{border-color:var(--brand);background:var(--brand-soft)}',
 j:"var cards=[['Hi Nan,','friend'],['Dear Ms Chen,','office'],['See you Saturday,','friend'],['Kind regards,','office']];"+
   "var cols=document.querySelectorAll('.col'),held=null;"+
   "cards.forEach(function(c){var d=document.createElement('div');d.className='cc';d.textContent=c[0];"+
   "d.setAttribute('data-ok',c[1]);cols[0].appendChild(d);});"+
   "document.addEventListener('click',function(e){var c=e.target.closest('.cc');"+
   "if(c){if(held)held.classList.remove('held');held=c;c.classList.add('held');return;}"+
   "var col=e.target.closest('.col');if(!col||!held)return;col.appendChild(held);"+
   "var ok=held.getAttribute('data-ok')===col.getAttribute('data-c');"+
   "held.style.borderColor=ok?'var(--good)':'var(--bad)';"+
   "if(!matchMedia('(prefers-reduced-motion:reduce)').matches)"+
   "held.animate([{transform:'translateY(-14px)',opacity:.4},{transform:'none',opacity:1}],{duration:260});"+
   "held.classList.remove('held');held=null;});"},

{c:'K17',p:'K',n:'Pull for a new one',t:['live','gesture','drill'],
 s:['pull area','new question'],
 pairs:['N09','J04','G02'],
 note:'Pull down for another question. It also carries a button, because a gesture on its own is invisible.',
 h:'<div class="wrap"><div class="pullbox" id="pb"><div class="pullhint" id="ph">Pull down for another one</div>'+
   '<div class="card" id="q"><div class="q" id="qt"></div></div></div>'+
   '<button class="btn" id="go">Give me another one</button></div>',
 k:'.pullbox{touch-action:pan-x;overflow:hidden}'+
   '.pullhint{text-align:center;font-size:var(--fs-xs);color:var(--ink-soft);height:0;overflow:hidden;'+
   'transition:height var(--dur)}'+
   '.pullbox.pulling .pullhint{height:calc(var(--base)*1.4)}',
 j:"var qs=['Where is the library?','What time does it open?','How do I get a card?','Who can help me?'];"+
   "var at=0,pb=document.getElementById('pb'),y0=null;"+
   "function next(){at=(at+1)%qs.length;document.getElementById('qt').textContent=qs[at];"+
   "if(!matchMedia('(prefers-reduced-motion:reduce)').matches)"+
   "document.getElementById('q').animate([{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],{duration:240});}"+
   "pb.addEventListener('pointerdown',function(e){y0=e.clientY;});"+
   "pb.addEventListener('pointermove',function(e){if(y0===null)return;"+
   "pb.classList.toggle('pulling',e.clientY-y0>20);});"+
   "pb.addEventListener('pointerup',function(e){if(y0!==null&&e.clientY-y0>70)next();"+
   "y0=null;pb.classList.remove('pulling');});"+
   "document.getElementById('go').onclick=next;document.getElementById('qt').textContent=qs[0];"},

{c:'K18',p:'K',n:'Segmented stepper',t:['live','progress','navigation'],
 s:['segments','labels'],
 pairs:['G04','P08','G02'],
 note:'Five steps across the top. Done, here and not yet, with no numbers to read.',
 h:'<div class="wrap"><div class="segs" id="s"></div><div class="card" id="p"></div>'+
   '<button class="btn solid" id="go">Next step</button></div>',
 k:'.segs{display:flex;gap:var(--s2);margin-bottom:var(--s4)}'+
   '.sg{flex:1;height:calc(var(--base)*.45);border-radius:var(--r-pill);background:var(--band);'+
   'transition:background var(--dur)}'+
   '.sg.done{background:var(--good)}.sg.here{background:var(--accent)}',
 j:"var steps=['Read it','Find the day','Find the time','Write the reply','Check it'],at=0;"+
   "var s=document.getElementById('s');"+
   "steps.forEach(function(){var d=document.createElement('div');d.className='sg';s.appendChild(d);});"+

{c:'J02',p:'J',n:'Starfield drift',t:['live','background','canvas','motion'],

   '<canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>'+
   '<div class="wrap" style="position:relative;text-align:center;padding:var(--s7) var(--s4)">'+
   '<h1 style="color:#fff">Vocabulary review</h1>'+

   "function size(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;}size();"+
   "for(var i=0;i<N;i++)S.push({x:Math.random()*cv.width,y:Math.random()*cv.height,"+
   "r:Math.random()*1.8+0.4,v:Math.random()*0.25+0.05});"+

   "function tick(){cx.clearRect(0,0,cv.width,cv.height);S.forEach(function(s){"+

   'border:2px solid var(--accent);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap}',
 j:"var days=['Monday','Friday','Sunday'],other=['June','morning','April'],all=days.concat(other);"+

{c:'J10',p:'J',n:'Firework burst',t:['live','celebration','canvas','motion'],

 note:'One number big, with the parts named beside it. Tap a slice to read it out.',

   '<svg viewBox="0 0 120 120" style="max-width:220px;margin:0 auto" id="sv" role="img" aria-label="Results donut">'+
   '<circle cx="60" cy="60" r="46" fill="none" stroke="#eaf0f6" stroke-width="16"></circle>'+
   '<g id="sl"></g>'+
   '<text x="60" y="66" text-anchor="middle" font-size="20" fill="#0b2e4f" font-family="Consolas,monospace" id="mid">84%</text></svg>'+
   '<div id="lg"></div></div></div>',
 k:'.lgr{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);font-size:var(--fs-sm);cursor:pointer}'+
   '.lgd{width:calc(var(--base)*.7);height:calc(var(--base)*.7);border-radius:var(--r-sm);flex:0 0 auto}',
 j:"var data=[['Right first time',60,TOK('--good','#1c7a3e')],"+
   "['Right after a change',24,TOK('--accent','#0f7d7d')],"+
   "['Still to do',16,TOK('--warm','#c97a1a')]];"+
   "var C=2*Math.PI*46,at=0,sl=document.getElementById('sl'),lg=document.getElementById('lg');"+
   "data.forEach(function(d){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');"+
   "c.setAttribute('cx',60);c.setAttribute('cy',60);c.setAttribute('r',46);c.setAttribute('fill','none');"+
   "c.setAttribute('stroke',d[2]);c.setAttribute('stroke-width',16);"+
   "c.setAttribute('stroke-dasharray',(C*d[1]/100)+' '+C);"+
   "c.setAttribute('stroke-dashoffset',-(C*at/100));"+
   "c.setAttribute('transform','rotate(-90 60 60)');sl.appendChild(c);at+=d[1];"+
   "var r=document.createElement('div');r.className='lgr';"+
   "r.innerHTML='<span class=\"lgd\" style=\"background:'+d[2]+'\"></span>'+d[0]+' '+d[1]+'%';"+
   "r.onclick=function(){document.getElementById('mid').textContent=d[1]+'%';};lg.appendChild(r);});"},

{c:'L03',p:'L',n:'Line sweep',t:['live','data','chart','svg','motion'],
 s:['line','points','weeks'],
 pairs:['P05','L04','H01'],
 note:'Scores across a term. The line draws itself once so the class watches the shape appear.',
 h:'<div class="wrap"><div class="card"><div class="q">Your scores this term</div>'+
   '<svg viewBox="0 0 320 160" style="width:100%" role="img" aria-label="Scores across the term">'+
   '<polyline id="ln" fill="none" stroke="#0f7d7d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" '+
   'points="10,130 60,110 110,118 160,80 210,70 260,44 310,38"></polyline>'+
   '<g id="dots"></g></svg>'+
   '<button class="btn quiet" id="go">Draw it again</button></div></div>',
 j:"var ln=document.getElementById('ln'),pts=ln.getAttribute('points').split(' ');"+
   "var g=document.getElementById('dots');"+
   "pts.forEach(function(p){var xy=p.split(',');var c=document.createElementNS('http://www.w3.org/2000/svg','circle');"+
   "c.setAttribute('cx',xy[0]);c.setAttribute('cy',xy[1]);c.setAttribute('r',5);"+
   "c.setAttribute('fill',"+"TOK('--brand','#0b2e4f')"+");g.appendChild(c);});"+
   "function run(){var red=matchMedia('(prefers-reduced-motion:reduce)').matches,len=ln.getTotalLength();"+
   "ln.style.strokeDasharray=len;ln.style.transition='none';ln.style.strokeDashoffset=red?0:len;"+
   "if(red)return;setTimeout(function(){ln.style.transition='stroke-dashoffset 1.1s ease';ln.style.strokeDashoffset=0;},40);}"+
   "document.getElementById('go').onclick=run;run();"},

{c:'L04',p:'L',n:'Sparkline tile',t:['live','data','menu'],
 s:['tile','trend'],
 pairs:['G02','L03','H01'],
 note:'A small trend inside a menu tile, so progress shows without opening the part.',
 h:'<div class="wrap"><div class="tiles" id="t"></div></div>',
 j:"var parts=[['Part 1','Read the message',[3,4,4,6,7,8]],['Part 2','Say it out loud',[6,5,7,7,8,9]],"+
   "['Part 3','Write your reply',[2,3,3,4,4,6]]];var host=document.getElementById('t');"+
   "parts.forEach(function(p){var b=document.createElement('button');b.className='mcard';"+
   "var max=10,w=120,h=34,step=w/(p[2].length-1);"+
   "var pts=p[2].map(function(v,i){return (i*step).toFixed(1)+','+(h-v/max*h).toFixed(1);}).join(' ');"+
   "b.innerHTML='<span class=\"step\">'+p[0]+'</span><span class=\"t\">'+p[1]+'</span>'+"+
   "'<svg viewBox=\"0 0 '+w+' '+h+'\" style=\"width:120px;height:34px\" aria-hidden=\"true\">'+"+
   "'<polyline fill=\"none\" stroke=\"#0f7d7d\" stroke-width=\"3\" points=\"'+pts+'\"></polyline></svg>';"+
   "b.onclick=function(){b.querySelector('.step').textContent=p[0]+' . going up';};host.appendChild(b);});"},

{c:'L05',p:'L',n:'Split-flap board',t:['live','listening','directions','motion'],
 s:['rows','flip','next call'],
 pairs:['A11','T09','H01'],
 note:'A departures board. Tap to call the next service, and the class reads the time and platform as it lands.',
 h:'<div class="wrap"><div class="flapb" id="b"></div>'+
   '<button class="btn solid" id="go" style="margin-top:var(--s4)">Call the next one</button>'+
   '<p class="sub" id="say"></p></div>',
 k:'.flapb{background:#071f36;border-radius:var(--r-lg);padding:var(--s4);overflow-x:auto}'+
   '.flr{display:flex;gap:var(--s2);margin-bottom:var(--s2);align-items:center}'+
   '.flc{background:#12293f;color:#f2c98a;font-family:var(--f-num);font-size:var(--fs-sm);'+
   'min-width:calc(var(--base)*.9);text-align:center;padding:var(--s1) var(--s2);border-radius:4px}',
 j:"var rows=[['CHATSWOOD','9:14','2'],['LANE COVE','9:22','1'],['NORTH SYDNEY','9:31','3']],at=0;"+
   "var host=document.getElementById('b');"+
   "function cells(txt){return txt.split('').map(function(ch){return '<span class=\"flc\">'+(ch===' '?'&nbsp;':ch)+'</span>';}).join('');}"+
   "function paint(){host.innerHTML='';rows.forEach(function(r){var d=document.createElement('div');d.className='flr';"+
   "d.innerHTML=cells(r[0])+'<span style=\"width:var(--s4)\"></span>'+cells(r[1])+"+
   "'<span style=\"width:var(--s4)\"></span>'+cells('PLAT '+r[2]);host.appendChild(d);});}"+
   "function flip(){var red=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "var pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';"+
   "var cellsEls=host.querySelectorAll('.flr')[at].querySelectorAll('.flc');"+
   "if(red)return;var n=0,t=setInterval(function(){n++;"+
   "[].forEach.call(cellsEls,function(c){if(n<10)c.textContent=pool[Math.floor(Math.random()*pool.length)];});"+
   "if(n>=10){clearInterval(t);paint();}},60);}"+
   "document.getElementById('go').onclick=function(){flip();"+
   "document.getElementById('say').textContent='Now calling the '+rows[at][1]+' to '+rows[at][0]+', platform '+rows[at][2]+'.';"+
   "try{var u=new SpeechSynthesisUtterance('The '+rows[at][1]+' service to '+rows[at][0]+' departs from platform '+rows[at][2]);"+
   "u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}"+
   "at=(at+1)%rows.length;};paint();"},

{c:'L06',p:'L',n:'Weight morph',t:['live','pronunciation','text','motion'],
 s:['sentence','stressed word'],
 pairs:['B09','I29','B10'],
 note:'The stressed word thickens as it is said. Stress becomes something the class can see.',
 h:'<div class="wrap" style="text-align:center"><div class="wm" id="w"></div>'+
   '<button class="btn solid" id="go">Say it with the stress</button></div>',
 k:'.wm{font-family:var(--f-display);font-size:var(--fs-xl);line-height:1.6;margin:var(--s5) 0}'+
   '.wm span{transition:font-weight .2s,transform .2s,color .2s;display:inline-block;margin:0 .12em;font-weight:400}'+
   '.wm span.hit{font-weight:900;color:var(--accent-deep);transform:scale(1.12)}',
 j:"var words='I said Saturday, not Sunday.'.split(' '),host=document.getElementById('w');"+
   "words.forEach(function(w){var s=document.createElement('span');s.textContent=w;host.appendChild(s);});"+
   "var hits=[2,4];"+
   "document.getElementById('go').onclick=function(){var sp=host.children;"+
   "try{var u=new SpeechSynthesisUtterance(words.join(' '));u.rate=0.7;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}"+
   "[].forEach.call(sp,function(s,i){setTimeout(function(){s.classList.toggle('hit',hits.indexOf(i)>=0);"+
   "setTimeout(function(){s.classList.remove('hit');},600);},i*430);});};"},

{c:'L07',p:'L',n:'Stagger rise',t:['live','text','review','motion'],
 s:['list'],
 pairs:['B10','O06','H01'],
 note:'A list that arrives one line at a time, so the class reads each one rather than the whole block.',
 h:'<div class="wrap"><h1>Today we learned</h1><div id="l"></div>'+

 j:"var items=['how to ask with Could you','how to say a day and a time',"+
   "'where the closing and the name go','three ways to say you are not sure'];"+
   "document.getElementById('go').onclick=function(){var l=document.getElementById('l');l.innerHTML='';"+
   "var red=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "items.forEach(function(t,i){var d=document.createElement('div');d.className='callout cool';d.textContent=t;"+
   "l.appendChild(d);if(red)return;d.style.opacity=0;"+
   "setTimeout(function(){d.style.opacity=1;"+
   "d.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:320});},i*150);});};"},

{c:'L08',p:'L',n:'Gradient wipe',t:['live','text','deck','motion'],
 s:['heading'],
 pairs:['O09','S08','H01'],
 note:'A heading revealed left to right. One per slide at most, or the deck starts to feel restless.',
 h:'<div class="wrap" style="text-align:center"><h1 class="wipe" id="w">Writing to friends</h1>'+
   '<button class="btn solid" id="go">Reveal it again</button></div>',
 k:'.wipe{background:linear-gradient(90deg,var(--brand) 0 50%,var(--band) 50% 100%);background-size:220% 100%;'+
   'background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;'+
   'transition:background-position 1.1s var(--ease)}'+
   '.wipe.on{background-position:0 0}',
 j:"var w=document.getElementById('w');"+
   "function run(){if(matchMedia('(prefers-reduced-motion:reduce)').matches){w.classList.add('on');return;}"+
   "w.classList.remove('on');setTimeout(function(){w.classList.add('on');},60);}"+
   "document.getElementById('go').onclick=run;run();"},

{c:'L09',p:'L',n:'Family tree',t:['live','vocabulary','diagram'],
 s:['people','words'],
 pairs:['L10','T03','H01'],
 note:'Relationship words in a shape the class can point at. Tap a box for the word and how to say it.',
 h:'<div class="wrap"><div class="tree" id="t"></div><div class="fb info" id="fb" style="display:none"></div></div>',
 k:'.tree{display:grid;gap:var(--s3);justify-items:center}'+
   '.trow{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center}'+
   '.tnode{border:2px solid var(--accent);border-radius:var(--r-md);background:var(--accent-wash);'+
   'padding:var(--s3) var(--s4);font-size:var(--fs-sm);cursor:pointer;min-height:var(--tap-min)}'+
   '.tbar{width:70%;height:3px;background:var(--line)}',
 j:"var rows=[[['grandmother','your mother\\u2019s mother'],['grandfather','your mother\\u2019s father']],"+
   "[['mother','the woman who raised you'],['father','the man who raised you'],['aunt','your parent\\u2019s sister']],"+
   "[['sister','a girl with the same parents'],['brother','a boy with the same parents'],['cousin','your aunt\\u2019s child']]];"+
   "var t=document.getElementById('t');"+
   "rows.forEach(function(r,i){var d=document.createElement('div');d.className='trow';"+
   "r.forEach(function(n){var b=document.createElement('button');b.className='tnode';b.textContent=n[0];"+
   "b.onclick=function(){var f=document.getElementById('fb');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+n[0]+'</span>'+n[1];"+
   "try{var u=new SpeechSynthesisUtterance(n[0]);u.rate=0.75;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}};"+
   "d.appendChild(b);});t.appendChild(d);"+
   "if(i<rows.length-1){var bar=document.createElement('div');bar.className='tbar';t.appendChild(bar);}});"},

{c:'L10',p:'L',n:'Collapsible tree',t:['live','teacher','diagram'],
 s:['branches','answers'],
 pairs:['G06','N01','H01'],
 note:'Answers hidden under branches, so a teacher opens only the part the class is on.',

 k:'.br{border-left:4px solid var(--accent);margin-bottom:var(--s3);padding-left:var(--s4)}'+

   '.brb{display:none;font-size:var(--fs-sm);color:var(--ink-soft)}'+
   '.br.on .brb{display:block}',

   "var t=document.getElementById('t');"+

{c:'L11',p:'L',n:'Branch timeline',t:['live','planning','diagram'],
 s:['weeks','markers'],
 pairs:['P08','G04','H01'],
 note:'The shape of a term on one screen. Tap a week to see what is in it.',
 h:'<div class="wrap"><div class="tl" id="t"></div><div class="fb info" id="fb" style="display:none"></div></div>',
 k:'.tl{position:relative;padding-left:var(--s6)}'+
   '.tl:before{content:"";position:absolute;left:calc(var(--base)*.7);top:0;bottom:0;width:3px;background:var(--line)}'+
   '.tli{position:relative;margin-bottom:var(--s4);cursor:pointer}'+
   '.tli:before{content:"";position:absolute;left:calc(var(--s6) * -1 + var(--base)*.7 - 6px);top:6px;'+

   '.tli.done:before{background:var(--good);border-color:var(--good)}'+
   '.tli b{font-size:var(--fs-sm)}',
 j:"var weeks=[['Week 1','Writing to friends',1],['Week 2','Emails to the office',1],"+
   "['Week 3','Signs and notices',0],['Week 4','Assessment',0]];var t=document.getElementById('t');"+
   "weeks.forEach(function(w){var d=document.createElement('div');d.className='tli'+(w[2]?' done':'');"+
   "d.innerHTML='<b>'+w[0]+'</b><div class=\"sub\">'+w[1]+'</div>';"+
   "d.onclick=function(){var f=document.getElementById('fb');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+w[0]+'</span>'+w[1]+'. '+(w[2]?'This one is done.':'Still to come.');};"+
   "t.appendChild(d);});"},

{c:'L12',p:'L',n:'Word marquee',t:['live','expressions','motion'],
 s:['strip','pause'],
 pairs:['A09','T07','H01'],
 note:'Today\'s expressions across the top of the screen. Tap it to stop, because a moving line is hard to read aloud.',
 h:'<div class="wrap"><div class="marq" id="m"><div class="mrun" id="r"></div></div>'+
   '<p class="sub">Tap the strip to stop it.</p></div>',
 k:'.marq{overflow:hidden;background:var(--brand);border-radius:var(--r-pill);padding:var(--s3) 0;cursor:pointer}'+
   '.mrun{display:inline-flex;gap:var(--s6);white-space:nowrap;color:#fff;font-size:var(--fs-sm);'+

   '.marq.stop .mrun{animation-play-state:paused}'+
   '@keyframes mq{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}',
 j:"var words=[\"she'll be right\",\"we've all been there\",\"it's early days\",'no worries',\"I'll give you that\"];"+
   "var r=document.getElementById('r'),html=words.concat(words).map(function(w){return '<span>'+w+'</span>';}).join('');"+
   "r.innerHTML=html;var m=document.getElementById('m');"+

   "m.onclick=function(){m.classList.toggle('stop');};"}

,

{c:'O01',p:'O',n:'Reading glass',t:['live','reading','access'],
 s:['text','lens','off switch'],
 pairs:['E01','J11'],
 note:'A magnifier the class can move over the text. The one part on this list that will get used every reading lesson.',
 h:'<div class="wrap"><p class="sub">Move over the text. Tap the button to put the glass away.</p>'+
   '<div class="glass" id="g"><div class="gsrc" id="src">'+
   '<p>Grace sent a message to the class group. She is having a barbecue at Riverside Park '+
   'on Saturday to celebrate her daughter finishing high school. Please confirm by Thursday '+
   'and bring a plate to share.</p></div>'+
   '<div class="lens" id="lens"><div class="linner" id="li"></div></div></div>'+
   '<button class="btn quiet" id="off">Put the glass away</button></div>',
 k:'.glass{position:relative;border:2px solid var(--line);border-radius:var(--r-lg);background:var(--surface);'+
   'padding:var(--s5);margin-bottom:var(--s4);touch-action:none;overflow:hidden}'+
   '.gsrc p{font-size:var(--fs-md);line-height:1.8;margin:0}'+
   '.lens{position:absolute;width:220px;height:220px;border-radius:var(--r-pill);border:4px solid var(--accent);'+
   'box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;background:var(--surface);pointer-events:none;'+
   'display:none;transform:translate(-50%,-50%)}'+
   '.lens.on{display:block}'+
   '.linner{position:absolute;top:0;left:0;transform-origin:0 0}'+
   '.linner p{font-size:var(--fs-md);line-height:1.8;margin:0}',
 j:"var g=document.getElementById('g'),src=document.getElementById('src'),lens=document.getElementById('lens');"+
   "var li=document.getElementById('li'),Z=2.1,L=220,live=true;"+
   "li.innerHTML=src.innerHTML;li.style.width=src.offsetWidth+'px';"+
   "window.addEventListener('resize',function(){li.style.width=src.offsetWidth+'px';});"+
   "g.addEventListener('pointermove',function(e){if(!live)return;"+
   "var r=g.getBoundingClientRect(),sr=src.getBoundingClientRect();"+
   "var x=e.clientX-sr.left,y=e.clientY-sr.top;"+
   "lens.style.left=(e.clientX-r.left)+'px';lens.style.top=(e.clientY-r.top)+'px';"+
   "li.style.transform='translate('+(L/2-x*Z)+'px,'+(L/2-y*Z)+'px) scale('+Z+')';"+
   "lens.classList.add('on');});"+
   "g.addEventListener('pointerleave',function(){lens.classList.remove('on');});"+
   "document.getElementById('off').onclick=function(){live=!live;lens.classList.remove('on');"+
   "this.textContent=live?'Put the glass away':'Get the glass out';};"},

{c:'O02',p:'O',n:'Tooltip pop',t:['live','reading','vocabulary'],
 s:['text','glosses','bubble'],
 pairs:['E02','L09','E01'],
 note:'Tap an underlined word and the meaning pops beside it. Keep every gloss to six words.',
 h:'<div class="wrap"><div class="card tipwrap" id="w" style="font-size:var(--fs-md);line-height:2.1"></div></div>',
 k:'.tipwrap{position:relative}'+
   '.tipw{background:#d3ebeb;border-bottom:3px solid #0f7d7d;border-radius:var(--r-sm);padding:0 var(--s2);cursor:pointer}'+
   '.tipbox{position:absolute;z-index:5;background:var(--brand);color:#fff;border-radius:var(--r-md);'+
   'padding:var(--s2) var(--s4);font-size:var(--fs-sm);max-width:260px;transform:translate(-50%,-115%);'+
   'box-shadow:0 6px 18px rgba(0,0,0,.25)}'+
   '.tipbox:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;'+
   'border-top-color:var(--brand);border-bottom:0}',
 j:"var text='Please confirm by Thursday and bring a plate to the barbecue at Riverside Park.';"+
   "var gloss={confirm:'say yes or no for sure',plate:'food to share with everyone',"+
   "barbecue:'a meal cooked outside'};var w=document.getElementById('w'),open=null;"+
   "text.split(' ').forEach(function(t){var key=t.replace(/[^a-z]/gi,'').toLowerCase();"+
   "var s=document.createElement('span');s.textContent=t;"+
   "if(gloss[key]){s.className='tipw';s.onclick=function(e){e.stopPropagation();if(open)open.remove();"+
   "var b=document.createElement('div');b.className='tipbox';b.textContent=gloss[key];"+
   "var r=s.getBoundingClientRect(),wr=w.getBoundingClientRect();"+
   "b.style.left=(r.left-wr.left+r.width/2)+'px';b.style.top=(r.top-wr.top)+'px';"+
   "w.appendChild(b);open=b;};}"+
   "w.appendChild(s);w.appendChild(document.createTextNode(' '));});"+
   "document.addEventListener('click',function(){if(open){open.remove();open=null;}});"},

{c:'O03',p:'O',n:'Reveal on tap',t:['live','drill','reveal'],
