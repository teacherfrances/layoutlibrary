 j:"var items=[['Yesterday I ___ to the shops.','went'],['The picnic is ___ Saturday.','on'],"+
   "['Could you ___ me the form?','send']];var set=document.getElementById('set');"+
   "items.forEach(function(it){var d=document.createElement('div');d.className='rev';"+
   "d.innerHTML='<div class=\"q\" style=\"margin:0\">'+it[0].replace('___','<b>'+it[1]+'</b>')+'</div>'+"+
   "'<div class=\"cover\">'+it[0]+'</div>';"+

{c:'O04',p:'O',n:'Flip tiles grid',t:['live','game','vocabulary'],
 s:['picture','tiles','guess'],
 pairs:['T03','C08','E01'],
 note:'Tiles come away one at a time until the class can name the picture. Fewer tiles taken is a better guess.',
 h:'<div class="wrap"><div class="pic">'+
   '<svg viewBox="0 0 400 240" role="img" aria-label="A park with a tree and a bench">'+
   '<rect x="0" y="0" width="400" height="240" fill="#e4f2f2"></rect>'+
   '<rect x="0" y="180" width="400" height="60" fill="#1c7a3e"></rect>'+
   '<rect x="180" y="95" width="18" height="90" fill="#8a5210"></rect>'+
   '<circle cx="189" cy="80" r="52" fill="#1c7a3e"></circle>'+
   '<rect x="60" y="160" width="90" height="10" rx="4" fill="#c97a1a"></rect>'+
   '<rect x="66" y="170" width="8" height="18" fill="#8a5210"></rect>'+
   '<rect x="136" y="170" width="8" height="18" fill="#8a5210"></rect>'+
   '<circle cx="330" cy="50" r="26" fill="#f2c98a"></circle></svg>'+
   '<div class="tiles2" id="t"></div></div>'+
   '<p class="sub" id="cnt"></p>'+
   '<div class="barrow" id="g"><button class="opt" data-ok="0" style="flex:1">a station</button>'+
   '<button class="opt" data-ok="1" style="flex:1">a park</button>'+
   '<button class="opt" data-ok="0" style="flex:1">a library</button></div>'+
   '<div class="fb" id="fb" style="display:none"></div></div>',
 k:'.pic{position:relative;border:2px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s4)}'+
   '.tiles2{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr)}'+
   '.ft{background:var(--brand);border:1px solid var(--brand-deep);cursor:pointer;'+
   'transition:transform .4s var(--ease),opacity .4s}'+
   '.ft.gone{transform:rotateY(90deg);opacity:0;pointer-events:none}',
 j:"var t=document.getElementById('t'),n=12,taken=0;"+
   "for(var i=0;i<n;i++){var b=document.createElement('button');b.className='ft';"+
   "b.onclick=function(){if(this.classList.contains('gone'))return;this.classList.add('gone');taken++;"+
   "document.getElementById('cnt').textContent=taken+' of '+n+' tiles taken.';};t.appendChild(b);}"+
   "document.getElementById('cnt').textContent='0 of '+n+' tiles taken.';"+
   "document.getElementById('g').addEventListener('click',function(e){var b=e.target.closest('.opt');if(!b)return;"+
   "var ok=b.getAttribute('data-ok')==='1';b.classList.add(ok?'right':'wrong');"+
   "var f=document.getElementById('fb');f.className='fb '+(ok?'good':'bad');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+(ok?'Yes, a park.':'Take one more tile.')+'</span>'+"+
   "'A tree, a bench and grass. You found it with '+taken+' tiles.';"+
   "if(ok)[].forEach.call(t.children,function(c){c.classList.add('gone');});});"},

{c:'O05',p:'O',n:'Prompt dice',t:['live','speaking','3d','game'],
 s:['cube','prompts','roll'],
 pairs:['T05','B07','E01'],
 note:'Six speaking prompts on a cube. The prompt is also printed under it, so nobody has to read a moving face.',
 h:'<div class="wrap" style="text-align:center"><div class="cubew"><div class="cube" id="c">'+
   '<div class="cf f1">Where do you live?</div><div class="cf f2">What did you do yesterday?</div>'+
   '<div class="cf f3">Who helps you at home?</div><div class="cf f4">What time do you start?</div>'+
   '<div class="cf f5">How do you get here?</div><div class="cf f6">What will you do on Saturday?</div>'+
   '</div></div><div class="q" id="out" style="margin-top:var(--s6)"></div>'+
   '<button class="btn solid" id="go">Roll</button></div>',
 k:'.cubew{perspective:900px;height:220px;display:flex;align-items:center;justify-content:center}'+
   '.cube{position:relative;width:150px;height:150px;transform-style:preserve-3d;'+
   'transition:transform 1s var(--ease)}'+
   '.cf{position:absolute;width:150px;height:150px;display:flex;align-items:center;justify-content:center;'+
   'text-align:center;padding:var(--s3);background:var(--accent);color:#fff;border:2px solid var(--accent-deep);'+
   'font-size:var(--fs-xs);border-radius:var(--r-sm)}'+
   '.f1{transform:translateZ(75px)}.f2{transform:rotateY(180deg) translateZ(75px)}'+
   '.f3{transform:rotateY(90deg) translateZ(75px)}.f4{transform:rotateY(-90deg) translateZ(75px)}'+
   '.f5{transform:rotateX(90deg) translateZ(75px)}.f6{transform:rotateX(-90deg) translateZ(75px)}',
 j:"var faces=[[0,0],[0,180],[0,-90],[0,90],[-90,0],[90,0]];"+
   "var texts=['Where do you live?','What did you do yesterday?','Who helps you at home?',"+
   "'What time do you start?','How do you get here?','What will you do on Saturday?'];"+
   "var c=document.getElementById('c'),red=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "document.getElementById('go').onclick=function(){var i=Math.floor(Math.random()*6);"+
   "var f=faces[i],spin=red?0:360;"+
   "c.style.transition=red?'none':'';"+
   "c.style.transform='rotateX('+(f[0]+spin)+'deg) rotateY('+(f[1]+spin)+'deg)';"+
   "document.getElementById('out').textContent=texts[i];};"},

{c:'O06',p:'O',n:'Typewriter reveal',t:['live','reading','text','motion'],
 s:['text','skip'],
 pairs:['F02','L07','E01'],
 note:'Text arrives at reading speed so the class reads with it rather than ahead of it. Skip is always there.',
 h:'<div class="wrap"><div class="card"><div class="q" id="t" style="min-height:calc(var(--base)*4)"></div>'+
   '<span class="caret" id="cr"></span></div>'+
   '<div class="barrow"><button class="btn solid" id="go">Start</button>'+
   '<button class="btn quiet" id="skip">Show it all</button></div></div>',
 k:'.caret{display:inline-block;width:3px;height:var(--fs-lg);background:var(--accent);'+
   'animation:cb 1s steps(2) infinite;vertical-align:middle}'+
   '@keyframes cb{0%,50%{opacity:1}51%,100%{opacity:0}}',
 j:"var line='Hi Nan, the picnic is on Saturday at ten at Riverside Park. Please bring a plate.';"+
   "var el=document.getElementById('t'),t=null;"+
   "function go(){clearInterval(t);el.textContent='';var i=0;"+
   "if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=line;return;}"+
   "t=setInterval(function(){el.textContent=line.slice(0,++i);if(i>=line.length)clearInterval(t);},45);}"+
   "document.getElementById('go').onclick=go;"+
   "document.getElementById('skip').onclick=function(){clearInterval(t);el.textContent=line;};go();"},

{c:'O07',p:'O',n:'Ticker tape fall',t:['live','vocabulary','text','motion'],
 s:['word','letters'],
 pairs:['I14','B08','E01'],
 note:'Letters drop into place one at a time. Use it for one word, never for a sentence.',
 h:'<div class="wrap" style="text-align:center"><div class="tt" id="t"></div>'+
   '<button class="btn solid" id="go">Drop the word</button></div>',
 k:'.tt{font-family:var(--f-display);font-weight:900;font-size:var(--fs-2xl);color:var(--brand);'+
   'min-height:calc(var(--base)*2.6);margin:var(--s5) 0}'+
   '.tt span{display:inline-block}',
 j:"var word='timetable',host=document.getElementById('t');"+
   "function go(){host.innerHTML='';var red=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "word.split('').forEach(function(ch,i){var s=document.createElement('span');s.textContent=ch;"+
   "host.appendChild(s);if(red)return;s.style.opacity=0;"+
   "setTimeout(function(){s.style.opacity=1;"+
   "s.animate([{transform:'translateY(-40px)',opacity:0},{transform:'none',opacity:1}],"+
   "{duration:280,easing:'cubic-bezier(.2,.7,.3,1)'});},i*90);});}"+
   "document.getElementById('go').onclick=go;go();"},

{c:'O08',p:'O',n:'Pivot flip row',t:['live','vocabulary','3d'],
 s:['row','fronts','backs'],
 pairs:['D09','C08','E01'],
 note:'A row of words that flip to their meanings. Tap one, or flip the whole row at once.',
 h:'<div class="wrap"><div class="pv" id="r"></div>'+
   '<button class="btn solid" id="all">Flip them all</button></div>',
 k:'.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin-bottom:var(--s4)}'+
   '.pc{perspective:800px;height:calc(var(--base)*4);cursor:pointer}'+
   '.pin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s var(--ease)}'+
   '.pc.on .pin{transform:rotateX(180deg)}'+
   '.pf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;'+
   'padding:var(--s3);backface-visibility:hidden;border:2px solid var(--line);border-radius:var(--r-md);'+
   'background:var(--surface);font-size:var(--fs-sm)}'+
   '.pb{transform:rotateX(180deg);background:var(--accent);color:#fff;border-color:var(--accent)}',
 j:"var pairs=[['notice','a sign that tells you something'],['receipt','proof that you paid'],"+
   "['deadline','the last day to do it'],['appointment','a booked time']];"+
   "var r=document.getElementById('r');"+
   "pairs.forEach(function(p){var c=document.createElement('div');c.className='pc';"+
   "c.innerHTML='<div class=\"pin\"><div class=\"pf\"><b>'+p[0]+'</b></div>'+"+
   "'<div class=\"pf pb\">'+p[1]+'</div></div>';"+
   "c.onclick=function(){c.classList.toggle('on');};r.appendChild(c);});"+
   "document.getElementById('all').onclick=function(){var any=r.querySelector('.pc:not(.on)');"+
   "[].forEach.call(r.children,function(c){c.classList.toggle('on',!!any);});"+
   "this.textContent=any?'Turn them back':'Flip them all';};"},

{c:'O09',p:'O',n:'Block reveal',t:['live','deck','text','motion'],
 s:['heading','block'],
 pairs:['L08','S08','E01'],
 note:'A block slides off the heading. One per slide, and never on a sentence the class has to read quickly.',
 h:'<div class="wrap" style="text-align:center"><div class="blk" id="b"><h1>Writing to friends</h1><i></i></div>'+
   '<button class="btn solid" id="go">Reveal it again</button></div>',
 k:'.blk{position:relative;display:inline-block;overflow:hidden;margin-bottom:var(--s5)}'+
   '.blk h1{margin:0;opacity:0;transition:opacity .01s .34s}'+
   '.blk i{position:absolute;inset:0;background:var(--accent);transform:translateX(-101%)}'+
   '.blk.on h1{opacity:1}'+
   '.blk.on i{animation:blk .8s var(--ease) forwards}'+
   '@keyframes blk{0%{transform:translateX(-101%)}45%{transform:translateX(0)}100%{transform:translateX(101%)}}',
 j:"var b=document.getElementById('b');"+
   "function go(){if(matchMedia('(prefers-reduced-motion:reduce)').matches){"+
   "b.querySelector('h1').style.opacity=1;b.querySelector('i').style.display='none';return;}"+
   "b.classList.remove('on');setTimeout(function(){b.classList.add('on');},50);}"+
   "document.getElementById('go').onclick=go;go();"},

{c:'O10',p:'O',n:'Icon morph to tick',t:['live','feedback','svg'],
 s:['icon','done state'],
 pairs:['M03','H06','E01'],
 note:'The task icon becomes a tick when the part is finished. Quieter than a burst, so it suits a menu.',
 h:'<div class="wrap"><div id="rows"></div></div>',
 k:'.irow{display:flex;align-items:center;gap:var(--s4);border:2px solid var(--line);border-radius:var(--r-lg);'+
   'background:var(--surface);padding:var(--s4);margin-bottom:var(--s3);cursor:pointer;font-size:var(--fs-sm)}'+
   '.irow.done{border-color:var(--good);background:var(--good-wash);color:var(--good)}'+
   '.icm{flex:0 0 auto}'+
   '.icm path{fill:none;stroke:var(--ink-soft);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}'+
   '.irow.done .icm path{stroke:var(--good)}',
 j:"var tasks=['Read the message','Find the day and the time','Write your reply'];"+
   "var box='M12 12 H 48 V 48 H 12 Z',tick='M12 30 L 26 44 L 50 16';"+
   "var host=document.getElementById('rows');"+
   "tasks.forEach(function(t){var r=document.createElement('div');r.className='irow';"+
   "r.innerHTML='<svg class=\"icm\" width=\"46\" height=\"46\" viewBox=\"0 0 60 60\" aria-hidden=\"true\">'+"+
   "'<path d=\"'+box+'\"></path></svg><span>'+t+'</span>';"+
   "var path=r.querySelector('path');"+
   "r.onclick=function(){var on=!r.classList.contains('done');r.classList.toggle('done',on);"+
   "path.setAttribute('d',on?tick:box);"+
   "if(on&&!matchMedia('(prefers-reduced-motion:reduce)').matches){var len=path.getTotalLength();"+
   "path.style.strokeDasharray=len;path.style.strokeDashoffset=len;path.style.transition='none';"+
   "setTimeout(function(){path.style.transition='stroke-dashoffset .45s ease';path.style.strokeDashoffset=0;},20);}"+
   "else{path.style.strokeDasharray='';path.style.strokeDashoffset='';}};"+
   "host.appendChild(r);});"}

,

{c:'M01',p:'M',n:'Segmented control',t:['live','control','choice'],
 s:['segments','panel'],
 pairs:['K08','M02','D07'],
 note:'Two or three modes in one strip. The pill slides, so the class sees which way the choice moved.',
 h:'<div class="wrap"><div class="seg" id="s"><span class="pill" id="pill"></span></div>'+
   '<div class="card" id="pane"></div></div>',
 k:'.seg{position:relative;display:flex;background:var(--surface-quiet);border:2px solid var(--line);'+
   'border-radius:var(--r-pill);padding:var(--s1);margin-bottom:var(--s4)}'+
   '.sgb{flex:1;position:relative;z-index:2;min-height:var(--tap-min);background:none;border:0;'+
   'font-family:var(--f-body);font-size:var(--fs-sm);color:var(--ink-soft);cursor:pointer;border-radius:var(--r-pill)}'+
   '.sgb.on{color:#fff;font-weight:700}'+
   '.pill{position:absolute;top:var(--s1);bottom:var(--s1);background:var(--accent);border-radius:var(--r-pill);'+
   'transition:left var(--dur) var(--ease),width var(--dur) var(--ease);z-index:1}',
 j:"var modes=[['Short','The picnic is on Saturday.'],['Longer','The picnic is on Saturday at ten.'],"+
   "['Full','The picnic is on Saturday at ten at Riverside Park. Please bring a plate.']];"+
   "var s=document.getElementById('s'),pill=document.getElementById('pill');"+
   "function go(i){[].forEach.call(s.querySelectorAll('.sgb'),function(b,k){b.classList.toggle('on',k===i);});"+
   "pill.style.width='calc('+(100/modes.length)+'% - 8px)';"+
   "pill.style.left='calc('+(i*100/modes.length)+'% + 4px)';"+
   "document.getElementById('pane').innerHTML='<div class=\"q\">'+modes[i][0]+'</div><p>'+modes[i][1]+'</p>';}"+
   "modes.forEach(function(m,i){var b=document.createElement('button');b.className='sgb';b.textContent=m[0];"+
   "b.onclick=function(){go(i);};s.appendChild(b);});go(0);"},

{c:'M02',p:'M',n:'Radio dot bloom',t:['live','control','choice'],
 s:['options','one choice'],
 pairs:['D01','M03','D07'],
 note:'One answer only, and the last one taken visibly lets go. Useful where option pills would look like more than one is allowed.',
 h:'<div class="wrap"><div class="card"><div class="q">How do you get to class?</div>'+
   '<div id="rs"></div><div class="fb info" id="fb" style="display:none"></div></div></div>',
 k:'.rr{display:flex;align-items:center;gap:var(--s4);width:100%;background:none;border:0;text-align:left;'+
   'padding:var(--s3);min-height:var(--tap-opt);font-family:var(--f-body);font-size:var(--fs-md);'+
   'color:var(--ink);cursor:pointer;border-radius:var(--r-md)}'+
   '.rr:hover{background:var(--surface-quiet)}'+
   '.rd{width:calc(var(--base)*1.1);height:calc(var(--base)*1.1);border-radius:var(--r-pill);'+
   'border:3px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}'+
   '.rd i{width:0;height:0;border-radius:var(--r-pill);background:var(--accent);'+

   '.rr.on .rd{border-color:var(--accent)}'+
   '.rr.on .rd i{width:60%;height:60%}',
 j:"var ways=['I walk','I take the bus','I drive','Someone drives me'],rs=document.getElementById('rs');"+
   "ways.forEach(function(w){var b=document.createElement('button');b.className='rr';"+
   "b.innerHTML='<span class=\"rd\"><i></i></span><span>'+w+'</span>';"+
   "b.onclick=function(){[].forEach.call(rs.children,function(c){c.classList.remove('on');});"+
   "b.classList.add('on');var f=document.getElementById('fb');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+w+'</span>Now tell a partner how long it takes.';};rs.appendChild(b);});"},

{c:'M03',p:'M',n:'Checkbox morph',t:['live','control','review'],
 s:['boxes','count'],
 pairs:['A12','H06','D07'],
 note:'The tick draws itself in. Use it where a student is ticking off things they have done.',
 h:'<div class="wrap"><div id="cs"></div><p class="sub" id="cnt"></p></div>',
 k:'.cbr{display:flex;align-items:center;gap:var(--s4);width:100%;background:none;border:0;text-align:left;'+
   'padding:var(--s3);min-height:var(--tap-opt);font-family:var(--f-body);font-size:var(--fs-md);'+
   'color:var(--ink);cursor:pointer}'+
   '.cbx{width:calc(var(--base)*1.1);height:calc(var(--base)*1.1);border:3px solid var(--line);'+
   'border-radius:var(--r-sm);flex:0 0 auto;display:flex;align-items:center;justify-content:center;'+
   'transition:background var(--dur),border-color var(--dur)}'+
   '.cbr.on .cbx{background:var(--good);border-color:var(--good)}'+
   '.cbx path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}',
 j:"var items=['I brought my book','I did the homework','I know my class time'];"+
   "var cs=document.getElementById('cs'),n=0;"+
   "items.forEach(function(t){var b=document.createElement('button');b.className='cbr';"+
   "b.innerHTML='<span class=\"cbx\"><svg viewBox=\"0 0 40 40\" width=\"70%\" aria-hidden=\"true\">'+"+
   "'<path d=\"M8 21 L 17 30 L 32 11\"></path></svg></span><span>'+t+'</span>';"+
   "var path=b.querySelector('path'),len=34;"+
   "path.style.strokeDasharray=len;path.style.strokeDashoffset=len;"+
   "b.onclick=function(){var on=!b.classList.contains('on');b.classList.toggle('on',on);n+=on?1:-1;"+
   "if(on&&!matchMedia('(prefers-reduced-motion:reduce)').matches){path.style.transition='none';"+
   "path.style.strokeDashoffset=len;setTimeout(function(){path.style.transition='stroke-dashoffset .35s ease';"+
   "path.style.strokeDashoffset=0;},20);}else{path.style.strokeDashoffset=on?0:len;}"+
   "document.getElementById('cnt').textContent=n+' of '+items.length+' ticked.';};cs.appendChild(b);});"+
   "document.getElementById('cnt').textContent='0 of '+items.length+' ticked.';"},

{c:'M04',p:'M',n:'Code boxes',t:['live','game','escape','tap'],
 s:['boxes','digit pad','check'],
 pairs:['C09','C04','D07'],
 note:'The lock for an escape room. Digits are tapped in, the boxes fill left to right, and a wrong code shakes and clears.',
 h:'<div class="wrap" style="text-align:center"><div class="otp" id="o"></div>'+
   '<div id="pad" class="pad"></div>'+
   '<button class="btn quiet" id="del">Take one back</button>'+
   '<div class="fb" id="fb" style="display:none"></div></div>',
 k:'.otp{display:flex;gap:var(--s3);justify-content:center;margin:var(--s5) 0}'+
   '.ob{width:calc(var(--base)*1.8);height:calc(var(--base)*2.2);border:3px solid var(--line);'+
   'border-radius:var(--r-md);background:var(--surface);font-family:var(--f-num);font-size:var(--fs-xl);'+
   'display:flex;align-items:center;justify-content:center}'+
   '.ob.filled{border-color:var(--accent);background:var(--accent-wash)}'+
   '.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);max-width:420px;margin:0 auto var(--s4)}',
 j:"var CODE='4172',at=0,o=document.getElementById('o'),fb=document.getElementById('fb');"+
   "for(var i=0;i<4;i++){var b=document.createElement('div');b.className='ob';o.appendChild(b);}"+
   "var pad=document.getElementById('pad');"+
   "'1234567890'.split('').forEach(function(dg){var b=document.createElement('button');b.className='chip';"+
   "b.style.justifyContent='center';b.textContent=dg;b.onclick=function(){push(dg);};pad.appendChild(b);});"+
   "function push(dg){if(at>3)return;o.children[at].textContent=dg;o.children[at].classList.add('filled');at++;"+
   "if(at===4)check();}"+
   "function check(){var got='';[].forEach.call(o.children,function(c){got+=c.textContent;});"+
   "var ok=got===CODE;fb.className='fb '+(ok?'good':'bad');fb.style.display='block';"+
   "fb.innerHTML='<span class=\"lead\">'+(ok?'The door opens.':'Not that code.')+'</span>'+"+
   "(ok?'Take the key and go back to the map.':'Read the note again and try once more.');"+
   "if(ok)return;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)"+
   "o.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},"+
   "{transform:'translateX(0)'}],{duration:320});"+
   "setTimeout(function(){[].forEach.call(o.children,function(c){c.textContent='';c.classList.remove('filled');});"+
   "at=0;},420);}"+
   "document.getElementById('del').onclick=function(){if(!at)return;at--;"+
   "o.children[at].textContent='';o.children[at].classList.remove('filled');};"},

{c:'M05',p:'M',n:'Tag chips',t:['live','vocabulary','tap'],
 s:['pool','chosen','count'],
 pairs:['K14','G05','D07'],
 note:'Build a set by tapping. Tap a chosen chip to take it out again, which is the bit students look for.',
 h:'<div class="wrap"><div class="card"><div class="q">Which words do you know already?</div>'+
   '<div id="pool"></div></div>'+
   '<div class="card"><div class="q">My words <span id="n">0</span></div>'+
   '<div id="mine"><p class="sub" id="ph">Tap a word above.</p></div></div></div>',
 j:"var words=['notice','receipt','deadline','appointment','timetable','platform'];"+
   "var pool=document.getElementById('pool'),mine=document.getElementById('mine'),n=0;"+
   "function count(){document.getElementById('n').textContent=n;"+
   "document.getElementById('ph').style.display=n?'none':'block';}"+
   "words.forEach(function(w){var b=document.createElement('button');b.className='chip';b.textContent=w;"+
   "b.onclick=function(){if(b.classList.contains('used'))return;b.classList.add('used');n++;count();"+
   "var c=document.createElement('button');c.className='chip';c.textContent=w+'  \\u00d7';"+
   "c.onclick=function(){c.remove();b.classList.remove('used');n--;count();};mine.appendChild(c);};"+
   "pool.appendChild(b);});count();"},

{c:'M06',p:'M',n:'Clock dial',t:['live','time','tap'],
 s:['dial','hour','say it'],
 pairs:['M07','A11','D07'],
 note:'A dial with twelve stops for practising the hour. It says the time aloud, so listening and reading go together.',
 h:'<div class="wrap" style="text-align:center">'+
   '<svg viewBox="0 0 200 200" class="dial" id="d" role="img" aria-label="Clock dial">'+
   '<circle cx="100" cy="100" r="88" fill="#fff" stroke="#e3ddd0" stroke-width="4"></circle>'+
   '<g id="ticks"></g><line id="hand" x1="100" y1="100" x2="100" y2="30" stroke="#0f7d7d" '+
   'stroke-width="8" stroke-linecap="round"></line>'+
   '<circle cx="100" cy="100" r="8" fill="#0b2e4f"></circle></svg>'+
   '<div class="q" id="out"></div>'+
   '<div class="barrow" style="justify-content:center"><button class="btn" id="dn">Back an hour</button>'+
   '<button class="btn" id="up">On an hour</button><button class="btn solid" id="say">Say it</button></div></div>',
 k:'.dial{width:100%;max-width:280px;touch-action:none;cursor:pointer}',
 j:"var h=9,hand=document.getElementById('hand'),d=document.getElementById('d');"+
   "var tk=document.getElementById('ticks');"+
   "for(var i=1;i<=12;i++){var a=(i/12)*Math.PI*2-Math.PI/2;"+
   "var t=document.createElementNS('http://www.w3.org/2000/svg','text');"+
   "t.setAttribute('x',100+Math.cos(a)*68);t.setAttribute('y',100+Math.sin(a)*68+6);"+
   "t.setAttribute('text-anchor','middle');t.setAttribute('font-size','16');"+
   "t.setAttribute('font-family','Consolas,monospace');"+
   "t.setAttribute('fill',TOK('--ink-soft','#5a6772'));"+
   "t.textContent=i;tk.appendChild(t);}"+
   "function paint(){var a=(h%12)/12*Math.PI*2-Math.PI/2;"+
   "hand.setAttribute('x2',100+Math.cos(a)*70);hand.setAttribute('y2',100+Math.sin(a)*70);"+
   "document.getElementById('out').textContent=(h%12||12)+\" o'clock\";}"+
   "function say(){try{var u=new SpeechSynthesisUtterance('It is '+(h%12||12)+\" o'clock\");u.rate=0.8;"+
   "speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}"+
   "document.getElementById('up').onclick=function(){h=h%12+1;paint();};"+
   "document.getElementById('dn').onclick=function(){h=(h+10)%12+1;paint();};"+
   "document.getElementById('say').onclick=say;"+
   "d.addEventListener('pointerdown',function(e){e.preventDefault();var r=d.getBoundingClientRect();"+
   "var x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;"+
   "var a=Math.atan2(y,x)+Math.PI/2;if(a<0)a+=Math.PI*2;"+
   "h=Math.round(a/(Math.PI*2)*12)||12;paint();});paint();"},

{c:'M07',p:'M',n:'Snap slider',t:['live','time','pointer'],
 s:['track','stops','label'],
 pairs:['M08','K02','D07'],
 note:'Slides, then snaps to the nearest hour. Nobody has to land on an exact pixel.',
 h:'<div class="wrap"><div class="q" id="out">9:00</div>'+
   '<div class="trk" id="t"><div class="fill" id="f"></div><div class="knb" id="k"></div>'+
   '<div class="stops" id="s"></div></div>'+
   '<p class="sub">What time does the library open?</p></div>',
 j:"var hours=[8,9,10,11,12,1],at=1,t=document.getElementById('t'),k=document.getElementById('k');"+
   "var f=document.getElementById('f'),s=document.getElementById('s');"+
   "hours.forEach(function(h){var e=document.createElement('span');e.textContent=h;s.appendChild(e);});"+
   "function paint(){var pc=at/(hours.length-1)*100;k.style.left=pc+'%';f.style.width=pc+'%';"+
   "document.getElementById('out').textContent=hours[at]+':00';}"+
   "function set(e){var r=t.getBoundingClientRect();var pc=(e.clientX-r.left)/r.width;"+
   "at=Math.max(0,Math.min(hours.length-1,Math.round(pc*(hours.length-1))));paint();}"+
   "var down=false;t.addEventListener('pointerdown',function(e){down=true;e.preventDefault();"+
   "try{t.setPointerCapture(e.pointerId);}catch(err){}set(e);});"+
   "t.addEventListener('pointermove',function(e){if(!down)return;e.preventDefault();set(e);});"+
   "['pointerup','pointercancel'].forEach(function(ev){"+
   "t.addEventListener(ev,function(){down=false;});});paint();"},

{c:'M08',p:'M',n:'Dual range',t:['live','time','pointer'],
 s:['two handles','from','to'],
 pairs:['M07','T09','D07'],
 note:'Opening hours on one track. The handles cannot cross, so the answer always reads the right way round.',
 h:'<div class="wrap"><div class="q" id="out"></div>'+
   '<div class="trk" id="t"><div class="fill" id="f" style="left:0"></div>'+
   '<div class="knb" id="a"></div><div class="knb" id="b"></div></div>'+
   '<p class="sub">The library is open from ... to ...</p></div>',

 j:"var hours=[8,9,10,11,12,13,14,15,16],lo=1,hi=6;"+
   "var t=document.getElementById('t'),A=document.getElementById('a'),B=document.getElementById('b');"+
   "var f=document.getElementById('f');"+
   "function fmt(h){return (h>12?h-12:h)+(h<12?'am':'pm');}"+
   "function paint(){var n=hours.length-1;A.style.left=(lo/n*100)+'%';B.style.left=(hi/n*100)+'%';"+
   "f.style.left=(lo/n*100)+'%';f.style.width=((hi-lo)/n*100)+'%';"+
   "document.getElementById('out').textContent=fmt(hours[lo])+' to '+fmt(hours[hi]);}"+
   "var grab=null;"+
   "function near(e){var r=t.getBoundingClientRect(),n=hours.length-1;"+
   "var v=Math.round((e.clientX-r.left)/r.width*n);return Math.max(0,Math.min(n,v));}"+
   "t.addEventListener('pointerdown',function(e){e.preventDefault();var v=near(e);"+
   "grab=Math.abs(v-lo)<=Math.abs(v-hi)?'lo':'hi';"+
   "try{t.setPointerCapture(e.pointerId);}catch(err){}move(e);});"+
   "function move(e){var v=near(e);if(grab==='lo')lo=Math.min(v,hi-1);else hi=Math.max(v,lo+1);paint();}"+
   "t.addEventListener('pointermove',function(e){if(!grab)return;e.preventDefault();move(e);});"+
   "['pointerup','pointercancel'].forEach(function(ev){"+
   "t.addEventListener(ev,function(){grab=null;});});paint();"},

{c:'M09',p:'M',n:'Slide to confirm',t:['live','control','state'],

   '<div class="sknob" id="k">&#9654;</div></div>'+

 k:'.slide{position:relative;height:calc(var(--base)*2.4);background:var(--surface-quiet);'+
   'border:2px solid var(--line);border-radius:var(--r-pill);overflow:hidden;touch-action:none;margin-top:var(--s4)}'+
   '.slab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'+
   'font-size:var(--fs-sm);color:var(--ink-soft)}'+
   '.sknob{position:absolute;top:4px;left:4px;width:calc(var(--base)*2);height:calc(var(--base)*2);'+
   'border-radius:var(--r-pill);background:var(--accent);color:#fff;display:flex;align-items:center;'+
   'justify-content:center;cursor:grab;transition:left var(--dur) var(--ease)}'+
   '.slide.done{background:var(--good-wash);border-color:var(--good)}'+
   '.slide.done .sknob{background:var(--good)}',
 j:"var s=document.getElementById('s'),k=document.getElementById('k'),down=false,done=false;"+
   "function end(){if(done)return;k.style.transition='';k.style.left='4px';}"+
   "s.addEventListener('pointerdown',function(e){if(done)return;down=true;e.preventDefault();"+
   "k.style.transition='none';try{s.setPointerCapture(e.pointerId);}catch(err){}});"+
   "s.addEventListener('pointermove',function(e){if(!down||done)return;e.preventDefault();"+
   "var r=s.getBoundingClientRect(),max=r.width-k.offsetWidth-8;"+
   "var x=Math.max(0,Math.min(max,e.clientX-r.left-k.offsetWidth/2));k.style.left=(x+4)+'px';"+
   "if(x>=max-2){done=true;down=false;s.classList.add('done');"+
   "document.getElementById('lab').textContent='Handed in';"+
   "var f=document.getElementById('fb');f.className='fb good';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">Sent.</span>Your teacher has your work.';}});"+
   "s.addEventListener('pointerup',function(){down=false;end();});"+
   "s.addEventListener('pointercancel',function(){down=false;end();});"},

{c:'M10',p:'M',n:'Hold to confirm',t:['live','control','reset'],

   '</svg><span id="lab">Hold to clear</span></button>'+

 k:'.hold{display:inline-flex;flex-direction:column;align-items:center;gap:var(--s2);background:none;'+
   'border:0;cursor:pointer;font-family:var(--f-body);font-size:var(--fs-sm);color:var(--ink-soft);'+
   'touch-action:none;padding:var(--s3)}'+
   '.hold svg{width:calc(var(--base)*3.4);height:calc(var(--base)*3.4)}',
 j:"var ring=document.getElementById('ring'),t=null,k=0,C=214;"+
   "function stop(){clearInterval(t);t=null;k=0;ring.setAttribute('stroke-dashoffset',C);"+
   "document.getElementById('lab').textContent='Hold to clear';}"+

{c:'N01',p:'N',n:'Accordion sections',t:['live','navigation','reading'],

{c:'N02',p:'N',n:'Breadcrumb trail',t:['live','navigation'],

 h:'<div class="wrap"><div class="split" id="s">'+

 j:"var deck=[['receipt','proof that you paid'],['deadline','the last day to do it'],"+

 h:'<div class="wrap"><canvas id="cv" height="280" style="width:100%;height:280px;'+
   'border:2px solid var(--line);border-radius:var(--r-lg);background:#e8eef4"></canvas>'+

 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var seasons=[['Summer','#1c7a3e','#bfe3c8','green leaves and hot days'],"+
   "['Autumn','#c97a1a','#f6e3c8','the leaves turn orange and fall'],"+
   "['Winter','#8a5210','#e3ecf4','no leaves and cold days'],"+
   "['Spring','#7ac040','#ddf0d8','new leaves and flowers']];var at=0;"+
   "function branch(x,y,len,ang,w,col){if(len<8)return;"+
   "var x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;"+
   "cx.strokeStyle='#8a5210';cx.lineWidth=w;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x2,y2);cx.stroke();"+
   "if(len<26){cx.fillStyle=col;cx.beginPath();cx.arc(x2,y2,9,0,7);cx.fill();}"+
   "branch(x2,y2,len*0.72,ang-0.42,w*0.7,col);branch(x2,y2,len*0.72,ang+0.42,w*0.7,col);}"+
   "function draw(){cv.width=cv.offsetWidth;var s=seasons[at];"+

   "cx.fillStyle='#cfd9c8';cx.fillRect(0,250,cv.width,30);"+

   "document.getElementById('say').textContent=s[0]+'. In '+s[0].toLowerCase()+' we see '+s[3]+'.';}"+
   "seasons.forEach(function(s,i){var b=document.createElement('button');b.className='btn';b.textContent=s[0];"+
   "b.onclick=function(){at=i;draw();};document.getElementById('bs').appendChild(b);});"+
   "window.addEventListener('resize',draw);draw();"},

 k:'.ba{position:relative;display:grid;border:2px solid var(--line);border-radius:var(--r-lg);'+

 j:"var b=document.getElementById('b'),aft=document.getElementById('aft'),h=document.getElementById('h');"+
   "var down=false,anim=null;"+
   "function set(p){p=Math.max(4,Math.min(96,p));"+
   "aft.style.clipPath='inset(0 '+(100-p)+'% 0 0)';h.style.left=p+'%';}"+
   "function fromX(x){var r=b.getBoundingClientRect();if(!r.width)return;set((x-r.left)/r.width*100);}"+
   "function letGo(){down=false;}"+
   "b.addEventListener('pointerdown',function(e){e.preventDefault();down=true;"+
   "try{b.setPointerCapture(e.pointerId);}catch(err){}fromX(e.clientX);});"+
   "b.addEventListener('pointermove',function(e){if(!down)return;e.preventDefault();fromX(e.clientX);});"+
   "['pointerup','pointercancel'].forEach(function(ev){b.addEventListener(ev,letGo);});"+
   "b.addEventListener('touchstart',function(e){e.preventDefault();down=true;"+
   "fromX(e.touches[0].clientX);},{passive:false});"+
   "b.addEventListener('touchmove',function(e){e.preventDefault();"+
   "fromX(e.touches[0].clientX);},{passive:false});"+
   "b.addEventListener('touchend',letGo);b.addEventListener('touchcancel',letGo);"+
   "b.addEventListener('click',function(e){fromX(e.clientX);});"+
   "document.getElementById('lf').onclick=function(){set(4);};"+

{c:'T10',p:'T',n:'Orrery',t:['live','time','canvas'],

 pairs:['Q06','L11','B04'],
 note:'A slow circling model of the year. Tap it to name the month and the season it sits in.',
 h:'<div class="wrap" style="text-align:center">'+
   '<canvas id="cv" height="300" style="width:100%;max-width:340px;height:300px"></canvas>'+
   '<div class="q" id="out"></div>'+
   '<div class="barrow" style="justify-content:center"><button class="btn" id="go">Next month</button>'+
   '<button class="btn quiet" id="off">Stop turning</button></div></div>',
 j:"var months=['January','February','March','April','May','June','July','August','September',"+
   "'October','November','December'];"+
   "var season=['Summer','Summer','Autumn','Autumn','Autumn','Winter','Winter','Winter',"+
   "'Spring','Spring','Spring','Summer'];"+
   "var cv=document.getElementById('cv'),cx=cv.getContext('2d'),at=0,ang=0,run=true;"+
   "if(matchMedia('(prefers-reduced-motion:reduce)').matches)run=false;"+
   "function say(){document.getElementById('out').textContent=months[at]+' is in '+season[at].toLowerCase()+'.';}"+
   "function draw(){cv.width=cv.offsetWidth;var w=cv.width,h=cv.height,cxp=w/2,cyp=h/2;"+
   "cx.clearRect(0,0,w,h);cx.strokeStyle='#e3ddd0';cx.lineWidth=2;"+
   "[60,95].forEach(function(r){cx.beginPath();cx.arc(cxp,cyp,r,0,7);cx.stroke();});"+
   "cx.fillStyle='#c97a1a';cx.beginPath();cx.arc(cxp,cyp,16,0,7);cx.fill();"+
   "var a=ang+at*Math.PI/6;"+
   "cx.fillStyle='#0f7d7d';cx.beginPath();cx.arc(cxp+Math.cos(a)*95,cyp+Math.sin(a)*95,12,0,7);cx.fill();"+
   "cx.fillStyle='#5a6772';cx.beginPath();cx.arc(cxp+Math.cos(a*3)*60,cyp+Math.sin(a*3)*60,7,0,7);cx.fill();"+
   "if(run)ang+=0.004;requestAnimationFrame(draw);}draw();say();"+
   "document.getElementById('go').onclick=function(){at=(at+1)%12;say();};"+
   "document.getElementById('off').onclick=function(){run=!run;this.textContent=run?'Stop turning':'Start turning';};"},

{c:'T11',p:'T',n:'Breathing circle',t:['live','wellbeing','motion'],

 pairs:['T12','U06','B04'],
 note:'A one minute break between two hard tasks. Breathe in for four, hold for four, out for six.',
 h:'<div class="wrap" style="text-align:center"><div class="brc" id="c"><span id="word">Ready</span></div>'+
   '<p class="sub" id="left"></p>'+
   '<div class="barrow" style="justify-content:center"><button class="btn solid" id="go">Start</button>'+
   '<button class="btn quiet" id="stop">Stop</button></div></div>',
 k:'.brc{width:min(240px,70vw);aspect-ratio:1;margin:var(--s5) auto;border-radius:var(--r-pill);'+
   'background:var(--accent-wash);border:4px solid var(--accent);display:flex;align-items:center;'+
   'justify-content:center;font-family:var(--f-display);font-weight:900;font-size:var(--fs-lg);'+
   'color:var(--accent-deep);transform:scale(.72);transition:transform 4s ease-in-out}'+
   '.brc.big{transform:scale(1)}',
 j:"var c=document.getElementById('c'),word=document.getElementById('word'),t=null,left=60;"+
   "var steps=[['Breathe in',4,true],['Hold',4,null],['Breathe out',6,false]],at=0;"+
   "var red=matchMedia('(prefers-reduced-motion:reduce)').matches;"+
   "function tick(){var s=steps[at];word.textContent=s[0];"+
   "if(!red&&s[2]!==null)c.classList.toggle('big',s[2]);"+
   "left-=s[1];document.getElementById('left').textContent=Math.max(left,0)+' seconds left';"+
   "at=(at+1)%steps.length;"+

   "document.getElementById('stop').onclick=function(){stop();word.textContent='Ready';"+
   "document.getElementById('left').textContent='';};"},

{c:'T12',p:'T',n:'Kaleidoscope calm',t:['live','wellbeing','canvas','motion'],
 s:['canvas','stop'],
 pairs:['T11','J09','B04'],
 note:'A quiet screen for the few minutes after an assessment. Slow, mirrored, and it stops on a tap.',
 h:'<div class="wrap"><canvas id="cv" height="300" style="width:100%;height:300px;'+
   'border-radius:var(--r-lg);background:#071f36"></canvas>'+
   '<button class="btn quiet" id="off" style="margin-top:var(--s4)">Stop</button></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),a=0,run=true,N=8;"+
   "if(matchMedia('(prefers-reduced-motion:reduce)').matches)run=false;"+
   "function size(){cv.width=cv.offsetWidth;}size();window.addEventListener('resize',size);"+
   "var cols=['#3fb3b3','#f2c98a','#7ac0c0','#c97a1a'];"+
   "function draw(){cx.fillStyle='rgba(7,31,54,.10)';cx.fillRect(0,0,cv.width,cv.height);"+
   "var cxp=cv.width/2,cyp=cv.height/2;"+
   "for(var i=0;i<N;i++){cx.save();cx.translate(cxp,cyp);cx.rotate(i*Math.PI*2/N+a);"+
   "cx.scale(i%2?-1:1,1);"+
   "cx.strokeStyle=cols[i%4];cx.lineWidth=2;cx.beginPath();"+
   "cx.moveTo(18,0);"+
   "cx.quadraticCurveTo(70+Math.sin(a*2)*26,40+Math.cos(a*3)*22,120,10+Math.sin(a)*18);"+
   "cx.stroke();cx.restore();}"+
   "if(run)a+=0.004;requestAnimationFrame(draw);}draw();"+
   "document.getElementById('off').onclick=function(){run=!run;this.textContent=run?'Stop':'Start';};"}

{c:'F11',p:'F',n:'Circular wave',t:['audio','record','canvas','live'],
 s:['ring','level'],
 pairs:['F09','F12','F01'],
 note:'Your voice as a ring that swells. Easier to read across the room than bars, and it needs no numbers.',
 h:'<div class="wrap" style="text-align:center">'+
   '<canvas id="cv" height="260" style="width:100%;max-width:300px;height:260px"></canvas>'+
   '<p class="sub" id="say">Tap Start, then say the sentence.</p>'+
   '<div class="barrow" style="justify-content:center"><button class="btn solid" id="go">Start</button>'+
   '<button class="btn quiet" id="stop">Stop</button></div>'+
   '<div class="fb" id="fb" style="display:none"></div></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),ac=null,an=null,st=null,run=false;"+
   "function note(k,m){var f=document.getElementById('fb');f.className='fb '+k;f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">Note</span>'+m;}"+
   "function draw(){if(!run)return;cv.width=cv.offsetWidth;"+
   "var a=new Uint8Array(an.frequencyBinCount);an.getByteTimeDomainData(a);"+
   "var peak=0;for(var i=0;i<a.length;i++){var v=Math.abs(a[i]-128)/128;if(v>peak)peak=v;}"+
   "var cxp=cv.width/2,cyp=cv.height/2,base=52,r=base+peak*62;"+
   "cx.clearRect(0,0,cv.width,cv.height);"+
   "cx.strokeStyle='#e3ddd0';cx.lineWidth=3;cx.beginPath();cx.arc(cxp,cyp,base,0,7);cx.stroke();"+
   "cx.strokeStyle=peak>0.8?'#b3261e':(peak<0.12?'#c9d4de':'#0f7d7d');cx.lineWidth=10;"+
   "cx.beginPath();cx.arc(cxp,cyp,r,0,7);cx.stroke();"+
   "document.getElementById('say').textContent=peak<0.12?'Too quiet. Move closer.':"+
   "(peak>0.85?'Too loud. Move back a little.':'That level is good.');"+
   "requestAnimationFrame(draw);}"+
   "document.getElementById('go').onclick=function(){if(!navigator.mediaDevices){"+
   "note('info','This device will not record. Say it to a partner instead.');return;}"+
   "navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){st=s;"+
   "ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=512;"+
   "ac.createMediaStreamSource(s).connect(an);run=true;draw();})"+
   ".catch(function(){note('info','The microphone was not allowed. Everything else still works.');});};"+
   "document.getElementById('stop').onclick=function(){run=false;"+
   "if(st)st.getTracks().forEach(function(t){t.stop();});try{if(ac)ac.close();}catch(e){}"+
   "cx.clearRect(0,0,cv.width,cv.height);};"},

{c:'F12',p:'F',n:'Radial spectrum',t:['audio','record','canvas','live'],
 s:['bars','circle'],
 pairs:['F11','F09','F01'],
 note:'Bars around a circle instead of across a line. Use it where the mic meter would take too much width.',
 h:'<div class="wrap" style="text-align:center">'+
   '<canvas id="cv" height="260" style="width:100%;max-width:300px;height:260px"></canvas>'+
   '<div class="barrow" style="justify-content:center"><button class="btn solid" id="go">Start</button>'+
   '<button class="btn quiet" id="stop">Stop</button></div>'+
   '<div class="fb" id="fb" style="display:none"></div></div>',
 j:"var cv=document.getElementById('cv'),cx=cv.getContext('2d'),ac=null,an=null,st=null,run=false,N=48;"+
   "function note(m){var f=document.getElementById('fb');f.className='fb info';f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">Note</span>'+m;}"+
   "function draw(){if(!run)return;cv.width=cv.offsetWidth;"+
   "var a=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(a);"+
   "var cxp=cv.width/2,cyp=cv.height/2,base=48;"+
   "cx.clearRect(0,0,cv.width,cv.height);"+
   "for(var i=0;i<N;i++){var v=a[Math.floor(i*an.frequencyBinCount/N/2)]/255;"+
   "var ang=i/N*Math.PI*2-Math.PI/2,len=8+v*58;"+
   "cx.strokeStyle=v>0.7?'#c97a1a':'#0f7d7d';cx.lineWidth=5;cx.lineCap='round';"+
   "cx.beginPath();cx.moveTo(cxp+Math.cos(ang)*base,cyp+Math.sin(ang)*base);"+
   "cx.lineTo(cxp+Math.cos(ang)*(base+len),cyp+Math.sin(ang)*(base+len));cx.stroke();}"+
   "requestAnimationFrame(draw);}"+
   "document.getElementById('go').onclick=function(){if(!navigator.mediaDevices){"+
   "note('This device will not record. Everything else still works.');return;}"+
   "navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){st=s;"+
   "ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;"+
   "ac.createMediaStreamSource(s).connect(an);run=true;draw();})"+
   ".catch(function(){note('The microphone was not allowed.');});};"+
   "document.getElementById('stop').onclick=function(){run=false;"+
   "if(st)st.getTracks().forEach(function(t){t.stop();});try{if(ac)ac.close();}catch(e){}"+
   "cx.clearRect(0,0,cv.width,cv.height);};"},

{c:'U01',p:'U',n:'Sound on correct',t:['live','feedback','audio'],

 note:'A short tone from the Web Audio API, so there is no sound file to ship. The mute is remembered on the device.',
 h:'<div class="wrap"><div class="card"><div class="q">Tap an answer</div>'+
   '<button class="opt" data-ok="1">Could you send it, please?</button>'+
   '<button class="opt" data-ok="0">Send it now.</button></div>'+
   '<button class="btn quiet" id="mute">Sound is on</button></div>',
 j:"var on=true;try{on=localStorage.getItem('demo.sound')!=='off';}catch(e){}"+
   "var ac=null;"+
   "function beep(good){if(!on)return;"+
   "try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();"+
   "if(ac.state==='suspended')ac.resume();"+
   "var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);"+
   "o.type='sine';o.frequency.value=good?880:220;"+
   "g.gain.setValueAtTime(0.0001,ac.currentTime);"+
   "g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+0.01);"+
   "g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(good?0.25:0.4));"+
   "o.start();o.stop(ac.currentTime+(good?0.26:0.42));}catch(e){}}"+
   "document.addEventListener('click',function(e){var b=e.target.closest('.opt');if(!b)return;"+
   "var ok=b.getAttribute('data-ok')==='1';b.classList.add(ok?'right':'wrong');beep(ok);});"+
   "var m=document.getElementById('mute');function paint(){m.textContent=on?'Sound is on':'Sound is off';"+
   "m.className='btn '+(on?'quiet':'wait');}"+
   "m.onclick=function(){on=!on;try{localStorage.setItem('demo.sound',on?'on':'off');}catch(e){}paint();};paint();"},

{c:'U03',p:'U',n:'Streak burst',t:['live','feedback','motion'],
 s:['streak','burst'],
 pairs:['I01','T04','D01'],
 note:'The burst grows with the run of right answers, and a wrong one takes it back to nothing. It rewards the run, not the question.',
 h:'<div class="wrap"><div class="card" id="host" style="position:relative;text-align:center">'+
   '<div class="q" id="lab">No run yet</div>'+
   '<div class="barrow" style="justify-content:center">'+
   '<button class="btn go" id="ok">Right</button>'+
   '<button class="btn quiet" id="no">Wrong</button></div></div></div>',
 j:"var run=0,host=document.getElementById('host');"+
   "function burst(n){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;"+
   "var cols=["+"TOK('--accent','#0f7d7d')"+","+"TOK('--warm','#c97a1a')"+","+"TOK('--good','#1c7a3e')"+"],count=Math.min(8+n*8,44);"+
   "for(var i=0;i<count;i++){(function(i){var dot=document.createElement('i');"+
   "dot.style.cssText='position:absolute;left:50%;top:40%;width:'+(8+n)+'px;height:'+(8+n)+'px;"+
   "border-radius:3px;background:'+cols[i%3];host.appendChild(dot);"+
   "var a=(Math.PI*2/count)*i,dist=60+n*22+Math.random()*40;"+
   "dot.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},"+
   "{transform:'translate(calc(-50% + '+(Math.cos(a)*dist)+'px), calc(-50% + '+(Math.sin(a)*dist)+'px)) scale(.2)',opacity:0}],"+
   "{duration:600+n*90,easing:'cubic-bezier(.2,.7,.3,1)'});"+
   "setTimeout(function(){dot.remove();},700+n*90);})(i);}}"+
   "function paint(){document.getElementById('lab').textContent=run?run+' in a row':'No run yet';}"+
   "document.getElementById('ok').onclick=function(){run++;burst(run);paint();};"+
   "document.getElementById('no').onclick=function(){run=0;paint();};paint();"},

{c:'U04',p:'U',n:'Part crossfade',t:['live','navigation','motion'],

 j:"var rows=[['G02','Lesson menu tiles','the front door, one tile per part'],['D01','Option pills','the main item shape'],['D03','Sort into bins','for prepositions and sorting tasks'],['D07','Gap tap','the tap-only replacement for a typed gap'],['I21','Gated next bar','counts what is left and jumps to it'],['I22','Change my answer','so a student can go back'],['I19','Save and resume','answers survive a closed tab'],['H01','Results screen','score, stars and the band sentence']];"+

{c:'W01',p:'W',n:'Word search grid',t:['game','vocabulary','tap','live'],

 k:'.wsg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:var(--s4);max-width:520px}'+

   "for(var r=0;r<N;r++){grid[r]=[];for(var c=0;c<N;c++)grid[r][c]=AZ[Math.floor(Math.random()*26)];}"+

   "var g=document.getElementById('g'),pick=null,found={};"+
   "for(var r2=0;r2<N;r2++){for(var c2=0;c2<N;c2++){(function(r,c){"+

   "b.onclick=function(){if(!pick){pick={r:r,c:c,el:b};b.classList.add('pick');return;}"+
   "var a=pick,z={r:r,c:c},ok=null;"+
   "for(var w in spots){var s=spots[w];"+
   "if(a.r===s.r&&z.r===s.r&&Math.min(a.c,z.c)===s.c1&&Math.max(a.c,z.c)===s.c2&&!found[w])ok=w;}"+

   "(Object.keys(found).length)+' of '+words.length+' now.';"+

   "else{f.className='fb bad';f.innerHTML='<span class=\"lead\">Not a word.</span>'+"+
   "'Tap the first letter, then the last letter of the same word.';}"+

{c:'F13',p:'F',n:'Say it and check',t:['audio','speaking','recognition','live'],
 s:['sentence','listen','heard','score'],
 pairs:['F04','F09','F14'],
 note:'The browser listens and marks the words it heard. It scores on meaning, not exact wording, and it says plainly when the device cannot do it rather than leaving a dead button.',
 h:'<div class="wrap"><div class="card">'+
   '<div class="q" id="target"></div>'+

   '<p class="sub">How did it go?</p><div class="selfr" id="rate"></div></div>'+
   '</div></div>',
 k:'.srec{background:var(--surface-quiet);border:2px solid var(--line);border-radius:var(--r-md);'+
   'padding:var(--s4);margin:var(--s4) 0;font-size:var(--fs-sm);color:var(--ink-soft)}'+
   '.srec.live{background:var(--good-wash);border-color:var(--good);color:var(--good)}'+
   '.heard{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)}'+
   '.wtok{border-radius:var(--r-pill);padding:var(--s1) var(--s3);font-size:var(--fs-sm);'+
   'background:var(--band);color:var(--ink-soft)}'+
   '.wtok.got{background:var(--good-wash);color:var(--good)}'+
   '.wtok.extra{background:var(--warm-wash);color:#8a5210}'+
   '.selfr{display:flex;gap:var(--s2);flex-wrap:wrap}',
 j:"var target='Could you tell me where the library is?';"+
   "var key=['could','you','tell','where','library'];"+
   "document.getElementById('target').textContent=target;"+
   "var rec=null,live=false;"+
   "function state(t,on){var s=document.getElementById('state');s.textContent=t;"+
   "s.classList.toggle('live',!!on);}"+
   "function note(k,lead,msg){var f=document.getElementById('fb');f.className='fb '+k;"+
   "f.style.display='block';f.innerHTML='<span class=\"lead\">'+lead+'</span>'+msg;}"+
   "function fallback(reason){document.getElementById('fallback').style.display='block';"+
   "state(reason,false);}"+
   "var rate=document.getElementById('rate');"+
   "[['I said it well','Good. Say it once more at normal speed.'],"+
   "['Nearly','Say it again slowly, then at normal speed.'],"+
   "['Not yet','Listen to the model twice, then try one part at a time.']]"+
   ".forEach(function(o){var b=document.createElement('button');b.className='btn';b.textContent=o[0];"+
   "b.onclick=function(){note('info','Noted.',o[1]);};rate.appendChild(b);});"+
   "document.getElementById('model').onclick=function(){"+
   "try{var u=new SpeechSynthesisUtterance(target);u.rate=0.85;"+
   "var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++){if(vs[i].lang==='en-AU'){u.voice=vs[i];break;}}"+
   "speechSynthesis.cancel();speechSynthesis.speak(u);}"+
   "catch(e){note('info','No voice here.','Your teacher can read it for you.');}};"+
   "function score(said){var words=said.toLowerCase().replace(/[^a-z ]/g,'').split(/\\s+/);"+
   "var host=document.getElementById('heard');host.innerHTML='';var got={};"+
   "words.forEach(function(w){var s=document.createElement('span');s.textContent=w;"+
   "if(key.indexOf(w)>=0){s.className='wtok got';got[w]=1;}"+
   "else if(target.toLowerCase().indexOf(w)>=0){s.className='wtok';}"+
   "else{s.className='wtok extra';}host.appendChild(s);});"+
   "var n=Object.keys(got).length;"+
   "if(n===key.length)note('good','All the important words.','That is clear enough for anyone to understand.');"+
   "else if(n>=3)note('good',n+' of '+key.length+' important words.',"+
   "'Understandable. The missing ones are: '+key.filter(function(w){return !got[w];}).join(', ')+'.');"+
   "else note('bad',n+' of '+key.length+' important words.',"+
   "'Say it slower and louder. Listen to the model once more first.');}"+
   "document.getElementById('go').onclick=function(){"+
   "var SR=window.SpeechRecognition||window.webkitSpeechRecognition;"+
   "if(!SR){fallback('This browser cannot listen. Everything else on the page still works.');"+
   "note('info','Not available here.','Use Record and compare, or say it to a partner.');return;}"+
   "try{rec=new SR();}catch(e){fallback('This device would not start listening.');return;}"+
   "rec.lang='en-AU';rec.interimResults=false;rec.maxAlternatives=1;"+
   "rec.onstart=function(){live=true;state('Listening. Say the sentence now.',true);};"+
   "rec.onresult=function(e){var said=e.results[0][0].transcript;"+
   "state('I heard: '+said,false);score(said);};"+
   "rec.onerror=function(e){live=false;state('Stopped.',false);"+
   "var why=e&&e.error;"+
   "if(why==='not-allowed'||why==='service-not-allowed')"+
   "note('info','The microphone was not allowed.','Allow it in the browser, or say it to a partner.');"+
   "else if(why==='network')"+
   "fallback('Listening needs the internet, and this device is offline.');"+
   "else if(why==='no-speech')"+
   "note('info','I did not hear anything.','Move closer and try again.');"+
   "else fallback('Listening stopped on this device.');};"+
   "rec.onend=function(){live=false;if(document.getElementById('state').textContent.indexOf('Listening')===0)"+
   "state('Finished listening.',false);};"+
   "try{rec.start();}catch(e){fallback('Listening is already running or blocked here.');}};"+
   "document.getElementById('stop').onclick=function(){if(rec&&live){try{rec.stop();}catch(e){}}"+
   "state('Stopped.',false);};"}

{c:'Z13',p:'Z',n:'What changed',t:['writing','feedback','tap','live'],
 s:['two versions','added','taken out'],
 pairs:['Z12','Z10','D08'],
 note:'Puts a draft beside its corrected version and marks every word added and every word taken out. A capital letter or a comma counts as a change, so the small fixes show up too.',
 h:'<div class="wrap"><p class="sub">Tap a draft to see what the teacher changed.</p>'+
   '<div id="picks"></div>'+
   '<div class="diffb" id="out">Nothing chosen yet.</div>'+
   '<div class="barrow"><button class="btn quiet" id="only">Show only what changed</button></div>'+
   '<p class="sub" id="tally"></p></div>',
 k:'.diffb{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);'+
   'padding:var(--s5);margin:var(--s4) 0;font-size:var(--fs-md);line-height:2.1}'+
   '.dline{display:block;margin-bottom:var(--s3)}'+
   '.dadd{background:var(--good-wash);color:var(--good);border-radius:var(--r-sm);'+
   'padding:0 var(--s1);font-weight:700}'+
   '.ddel{background:var(--bad-wash);color:var(--bad);border-radius:var(--r-sm);'+
   'padding:0 var(--s1);text-decoration:line-through}'+
   '.dsame{color:var(--ink)}'+
   '.diffb.tight .dsame{opacity:.32}',
 j:"var pairs=[['i cant come on saturday because i work','I cannot come on Saturday because I am working.'],"+
   "['dear sir i want the form for the bus','Dear Sir, I would like the form for the bus pass, please.'],"+
   "['thanks for you help see you','Thank you for your help. See you on Monday.']];"+
   "function words(s){return s.split(/\\s+/).filter(Boolean);}"+
   "function diff(a,b){var m=a.length,n=b.length,dp=[],i,j2;"+
   "for(i=0;i<=m;i++){dp[i]=[];for(j2=0;j2<=n;j2++)dp[i][j2]=0;}"+
   "for(i=m-1;i>=0;i--)for(j2=n-1;j2>=0;j2--){"+
   "dp[i][j2]=a[i].toLowerCase().replace(/[^a-z]/g,'')===b[j2].toLowerCase().replace(/[^a-z]/g,'')?"+
   "dp[i+1][j2+1]+1:Math.max(dp[i+1][j2],dp[i][j2+1]);}"+
   "var out=[];i=0;j2=0;"+
   "while(i<m&&j2<n){"+
   "if(a[i].toLowerCase().replace(/[^a-z]/g,'')===b[j2].toLowerCase().replace(/[^a-z]/g,'')){"+
   "if(a[i]===b[j2])out.push(['same',b[j2]]);"+
   "else{out.push(['del',a[i]]);out.push(['add',b[j2]]);}i++;j2++;}"+
   "else if(dp[i+1][j2]>=dp[i][j2+1]){out.push(['del',a[i]]);i++;}"+
   "else{out.push(['add',b[j2]]);j2++;}}"+
   "while(i<m){out.push(['del',a[i++]]);}while(j2<n){out.push(['add',b[j2++]]);}return out;}"+
   "var picks=document.getElementById('picks'),out=document.getElementById('out');"+
   "pairs.forEach(function(p,i){var b=document.createElement('button');b.className='opt';"+
   "b.textContent='Draft '+(i+1)+': '+p[0];"+
   "b.onclick=function(){show(p);[].forEach.call(picks.children,function(c){c.classList.remove('picked');});"+
   "b.classList.add('picked');};picks.appendChild(b);});"+
   "function show(p){var ops=diff(words(p[0]),words(p[1])),added=0,taken=0;"+
   "var html='<span class=\"dline\">';"+
   "ops.forEach(function(o){"+
   "if(o[0]==='same')html+='<span class=\"dsame\">'+o[1]+'</span> ';"+
   "else if(o[0]==='add'){html+='<span class=\"dadd\">'+o[1]+'</span> ';added++;}"+
   "else{html+='<span class=\"ddel\">'+o[1]+'</span> ';taken++;}});"+
   "out.innerHTML=html+'</span>';"+
   "document.getElementById('tally').textContent=added+' word'+(added===1?'':'s')+' added, '+"+
   "taken+' taken out. Read the green words out loud.';}"+
   "document.getElementById('only').onclick=function(){out.classList.toggle('tight');"+
   "this.textContent=out.classList.contains('tight')?'Show the whole sentence':'Show only what changed';};"},

{c:'M11',p:'M',n:'Thumbwheel',t:['control','pointer','drag','live'],
 s:['wheel','ticks','readout'],
 pairs:['M06','M01','P10'],
 note:'A ribbed wheel you flick. It carries on spinning, slows down and clicks onto the nearest step, so setting a number feels like turning something real.',
 h:'<div class="wrap" style="text-align:center"><div class="wheelv" id="v">1</div>'+
   '<p class="sub" id="lab"></p>'+
   '<div class="thumbw"><canvas id="cv"></canvas></div>'+
   '<p class="sub">Flick it, or drag it slowly.</p></div>',
 k:'.thumbw{position:relative;height:calc(var(--base)*3.4);border-radius:var(--r-lg);'+
   'background:var(--brand);overflow:hidden;touch-action:none;margin:var(--s4) 0;'+
   'box-shadow:inset 0 0 calc(var(--base)*.8) rgba(0,0,0,.45)}'+
   '.thumbw canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}'+
   '.wheelv{font-family:var(--f-num);font-size:calc(var(--base)*2.2);font-weight:900;color:var(--brand)}',
 j:"var steps=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];"+
   "var wrap=document.querySelector('.thumbw'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var off=0,vel=0,down=false,lastX=0,lastT=0,raf=null,PITCH=54;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;draw();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function idx(){var n=Math.round(-off/PITCH);return Math.max(0,Math.min(steps.length-1,n));}"+
   "function draw(){var w=cv.width,h=cv.height;if(!w)return;"+
   "cx.clearRect(0,0,w,h);"+
   "for(var x=(off%PITCH+PITCH)%PITCH-PITCH;x<w+PITCH;x+=PITCH){"+
   "var d=Math.abs(x-w/2)/(w/2);"+
   "cx.fillStyle='rgba(255,255,255,'+(0.75-d*0.55).toFixed(3)+')';"+
   "cx.fillRect(x,h*0.18,3,h*0.64);}"+
   "cx.fillStyle='rgba(242,165,65,1)';cx.fillRect(w/2-2,0,4,h);"+
   "document.getElementById('v').textContent=idx()+1;"+
   "document.getElementById('lab').textContent=steps[idx()];}"+
   "function settle(){if(raf)cancelAnimationFrame(raf);"+
   "function tick(){vel*=0.94;off+=vel;"+
   "var target=-idx()*PITCH;"+
   "if(Math.abs(vel)<0.4){off+=(target-off)*0.25;"+
   "if(Math.abs(target-off)<0.5){off=target;draw();raf=null;return;}}"+

   "cv.addEventListener('pointerdown',function(e){e.preventDefault();down=true;vel=0;"+

   "cv.addEventListener('pointermove',function(e){if(!down)return;e.preventDefault();"+
   "var dx=e.clientX-lastX,dt=Math.max(1,Date.now()-lastT);"+
   "off+=dx;vel=dx/dt*14;lastX=e.clientX;lastT=Date.now();draw();});"+
   "['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){"+
   "if(!down)return;down=false;"+

{c:'M12',p:'M',n:'Rolling stepper',t:['control','numeracy','tap','live'],

 k:'.stepq{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin:var(--s5) 0}'+

 j:"var n=0,col=document.getElementById('col'),answer=6;"+

{c:'X11',p:'X',n:'Rope match',t:['matching','pointer','drag','live'],
 s:['two columns','rope','check'],
 pairs:['X02','X03','D06'],
 note:'Tap one side then the other and a rope drops between them, sagging under its own weight. Drag the rope to make it swing. Easier to see across a room than a thin straight line.',
 h:'<div class="wrap"><div class="ropew" id="w">'+
   '<canvas id="cv"></canvas>'+
   '<div class="ropec" id="lf"></div><div class="ropec" id="rt4"></div></div>'+
   '<div class="fb" id="fb" style="display:none"></div>'+
   '<button class="btn quiet" id="rs">Cut all the ropes</button></div>',
 k:'.ropew{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--base)*3);'+
   'margin-bottom:var(--s4);touch-action:none}'+
   '.ropew canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:auto}'+
   '.ropec{display:flex;flex-direction:column;gap:var(--s4);position:relative;z-index:2}'+
   '.ropec button{min-height:var(--tap-opt);border:3px solid var(--line);border-radius:var(--r-md);'+
   'background:var(--surface);font-family:var(--f-body);font-size:var(--fs-sm);color:var(--ink);cursor:pointer}'+
   '.ropec button.grab{border-color:var(--brand);background:var(--brand-soft)}'+
   '.ropec button.roped{border-color:var(--good);background:var(--good-wash)}',
 j:"var pairs=[['bond','money you pay before you move in'],"+
   "['lease','the paper you sign for a flat'],"+
   "['notice','telling the agent you are leaving']];"+
   "var order=[1,2,0],held=null,ropes=[],raf=null;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var w=document.getElementById('w'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var lf=document.getElementById('lf'),rt=document.getElementById('rt4');"+
   "function size(){cv.width=w.offsetWidth;cv.height=w.offsetHeight;draw();}"+
   "setTimeout(size,40);window.addEventListener('resize',size);"+
   "pairs.forEach(function(p,i){var b=document.createElement('button');b.textContent=p[0];"+
   "b.setAttribute('data-i',i);"+
   "b.onclick=function(){if(b.classList.contains('roped'))return;"+
   "if(held)held.classList.remove('grab');held=b;b.classList.add('grab');};lf.appendChild(b);});"+
   "order.forEach(function(i){var b=document.createElement('button');b.textContent=pairs[i][1];"+
   "b.setAttribute('data-i',i);"+
   "b.onclick=function(){if(!held||b.classList.contains('roped'))return;"+
   "var ok=held.getAttribute('data-i')===b.getAttribute('data-i');"+
   "var f=document.getElementById('fb');f.className='fb '+(ok?'good':'bad');f.style.display='block';"+
   "f.innerHTML='<span class=\"lead\">'+(ok?'Tied on.':'Not that one.')+'</span>'+"+
   "'Bond is money, a lease is paper, notice is what you tell them.';"+
   "if(ok){held.classList.remove('grab');held.classList.add('roped');b.classList.add('roped');"+
   "addRope(held,b);}else{held.classList.remove('grab');}held=null;};rt.appendChild(b);});"+
   "function anchor(el,side){var r=el.getBoundingClientRect(),rw=w.getBoundingClientRect();"+
   "return {x:(side==='l'?r.right:r.left)-rw.left,y:r.top-rw.top+r.height/2};}"+
   "function addRope(a,b){var A=anchor(a,'l'),B=anchor(b,'r'),N=14,pts=[];"+
   "for(var i=0;i<=N;i++){var t=i/N;"+
   "pts.push({x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t+Math.sin(t*Math.PI)*(calm?18:4),"+
   "ox:A.x+(B.x-A.x)*t,oy:A.y+(B.y-A.y)*t});}"+
   "ropes.push({pts:pts,a:A,b:B});if(!calm)run();else draw();}"+
   "function step(){ropes.forEach(function(r){"+
   "r.pts.forEach(function(p,i){if(i===0||i===r.pts.length-1)return;"+
   "var vx=(p.x-p.ox)*0.96,vy=(p.y-p.oy)*0.96;p.ox=p.x;p.oy=p.y;"+
   "p.x+=vx;p.y+=vy+0.7;});"+
   "for(var k=0;k<6;k++){for(var i=0;i<r.pts.length-1;i++){"+
   "var p1=r.pts[i],p2=r.pts[i+1];"+
   "var dx=p2.x-p1.x,dy=p2.y-p1.y,dist=Math.sqrt(dx*dx+dy*dy)||1;"+
   "var rest=Math.hypot(r.b.x-r.a.x,r.b.y-r.a.y)/(r.pts.length-1)*1.08;"+
   "var diff=(dist-rest)/dist*0.5;"+
   "if(i>0){p1.x+=dx*diff;p1.y+=dy*diff;}"+
   "if(i+1<r.pts.length-1){p2.x-=dx*diff;p2.y-=dy*diff;}}"+
   "r.pts[0].x=r.a.x;r.pts[0].y=r.a.y;"+
   "r.pts[r.pts.length-1].x=r.b.x;r.pts[r.pts.length-1].y=r.b.y;}});}"+
   "function draw(){if(!cv.width)return;cx.clearRect(0,0,cv.width,cv.height);"+
   "cx.lineWidth=6;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1c7a3e';"+
   "ropes.forEach(function(r){cx.beginPath();"+
   "r.pts.forEach(function(p,i){if(i)cx.lineTo(p.x,p.y);else cx.moveTo(p.x,p.y);});cx.stroke();});}"+
   "var spins=0;"+
   "function run(){if(raf)cancelAnimationFrame(raf);spins=0;"+
   "function tick(){step();draw();spins++;"+
   "if(spins<240){raf=requestAnimationFrame(tick);}else{raf=null;}}"+
   "raf=requestAnimationFrame(tick);}"+
   "cv.addEventListener('pointerdown',function(e){if(calm)return;e.preventDefault();"+
   "var rw=w.getBoundingClientRect(),x=e.clientX-rw.left,y=e.clientY-rw.top;"+
   "ropes.forEach(function(r){r.pts.forEach(function(p,i){"+
   "if(i===0||i===r.pts.length-1)return;"+
   "if(Math.hypot(p.x-x,p.y-y)<60){p.x+=(x-p.x)*0.6;p.y+=(y-p.y)*0.6;}});});run();});"+
   "document.getElementById('rs').onclick=function(){ropes=[];held=null;"+
   "[].forEach.call(w.querySelectorAll('button'),function(b){b.classList.remove('grab','roped');});"+
   "draw();document.getElementById('fb').style.display='none';};"},

{c:'L13',p:'L',n:'Class scale',t:['data','teacher','tap','live'],
 s:['question','scale','dots'],
 pairs:['Z07','L01','P02'],
 note:'Everyone taps where they sit and their dot drops onto the scale, nudging sideways so no dot hides another. The shape of the class answer is the thing to talk about.',
 h:'<div class="wrap"><div class="q">How hard was that reading?</div>'+
   '<div class="swarm"><canvas id="cv"></canvas></div>'+
   '<div class="swaxis" id="ax"></div>'+
   '<p class="sub" id="say">Tap where you sit.</p>'+
   '<button class="btn quiet" id="rs">Clear the board</button></div>',
 k:'.swarm{position:relative;height:calc(var(--base)*7);background:var(--surface);'+
   'border:2px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;'+
   'overflow:hidden;touch-action:none}'+
   '.swarm canvas{position:absolute;inset:0;width:100%;height:100%}'+
   '.swaxis{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-bottom:var(--s3)}'+
   '.swaxis button{min-height:var(--tap-opt);border:2px solid var(--line);border-top:0;'+
   'background:var(--surface-quiet);font-family:var(--f-body);font-size:var(--fs-xs);'+
   'color:var(--ink);cursor:pointer;padding:var(--s2)}'+
   '.swaxis button:hover{background:var(--accent-wash)}'+
   '.swaxis button b{display:block;font-family:var(--f-num);font-size:var(--fs-sm);color:var(--brand)}',
 j:"var labels=['Too easy','Easy','About right','Hard','Too hard'];"+
   "var dots=[],counts=[0,0,0,0,0],R=11,raf=null;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var wrap=document.querySelector('.swarm'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;draw();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "var ax=document.getElementById('ax');"+
   "labels.forEach(function(t,i){var b=document.createElement('button');"+
   "b.innerHTML=t+'<b>0</b>';b.onclick=function(){drop(i);};ax.appendChild(b);});"+
   "function slot(i){var x=cv.width*(i+0.5)/labels.length,y=cv.height-R-2,tries=0;"+
   "while(tries<400){var clash=false;"+
   "for(var k=0;k<dots.length;k++){var dd=dots[k];"+
   "if(Math.hypot(dd.x-x,dd.y-y)<R*2+1){clash=true;break;}}"+
   "if(!clash)return {x:x,y:y};"+
   "x+=(tries%2?1:-1)*(R*0.9);"+
   "if(Math.abs(x-cv.width*(i+0.5)/labels.length)>cv.width/labels.length/2-R){"+
   "x=cv.width*(i+0.5)/labels.length;y-=R*1.7;}tries++;}"+
   "return {x:x,y:y};}"+
   "function drop(i){if(!cv.width)size();"+
   "counts[i]++;ax.children[i].querySelector('b').textContent=counts[i];"+
   "var to=slot(i);"+
   "dots.push({x:to.x,y:calm?to.y:-R,ty:to.y,i:i});"+
   "document.getElementById('say').textContent=counts.reduce(function(a,b){return a+b;},0)+"+
   "' in the class so far. '+labels[counts.indexOf(Math.max.apply(null,counts))]+' is the biggest group.';"+
   "if(calm)draw();else run();}"+
   "function draw(){if(!cv.width)return;cx.clearRect(0,0,cv.width,cv.height);"+
   "var cols=["+"TOK('--good','#1c7a3e')"+","+"TOK('--accent','#0f7d7d')"+","+"TOK('--brand','#0b2e4f')"+","+"TOK('--warm','#c97a1a')"+","+"TOK('--bad','#b3261e')"+"];"+
   "dots.forEach(function(dd){cx.beginPath();cx.arc(dd.x,dd.y,R,0,7);"+
   "cx.fillStyle=cols[dd.i];cx.fill();});}"+
   "function run(){if(raf)return;"+
   "function tick(){var moving=false;"+
   "dots.forEach(function(dd){if(dd.y<dd.ty){dd.y=Math.min(dd.ty,dd.y+Math.max(4,(dd.ty-dd.y)*0.18));moving=true;}});"+
   "draw();if(moving)raf=requestAnimationFrame(tick);else raf=null;}"+
   "raf=requestAnimationFrame(tick);}"+
   "document.getElementById('rs').onclick=function(){dots=[];counts=[0,0,0,0,0];"+
   "[].forEach.call(ax.children,function(b){b.querySelector('b').textContent='0';});"+
   "document.getElementById('say').textContent='Tap where you sit.';draw();};"},

 j:"var words=[['appointment',9],['receipt',7],['deadline',4],['notice',6],['form',8],"+

   "var cols=["+"TOK('--brand','#0b2e4f')"+","+"TOK('--accent','#0f7d7d')"+","+"TOK('--warm','#c97a1a')"+","+"TOK('--good','#1c7a3e')"+",'#7a3f7a'];"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "var wrap=document.querySelector('.bubz'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var bs=[],raf=null,spins=0;"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;seed();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function seed(){bs=[];var w=cv.width||360,h=cv.height||300;"+
   "words.forEach(function(v,i){bs.push({t:v[0],n:v[1],r:14+v[1]*3.2,"+
   "x:w/2+Math.cos(i)*w*0.3,y:h/2+Math.sin(i*1.7)*h*0.3,c:cols[i%cols.length]});});"+
   "spins=0;if(calm){for(var k=0;k<160;k++)step();draw();}else run();}"+
   "function step(){var w=cv.width||360,h=cv.height||300;"+
   "bs.forEach(function(b){b.x+=(w/2-b.x)*0.012;b.y+=(h/2-b.y)*0.012;});"+
   "for(var i=0;i<bs.length;i++)for(var j2=i+1;j2<bs.length;j2++){"+
   "var a=bs[i],b2=bs[j2],dx=b2.x-a.x,dy=b2.y-a.y,dist=Math.hypot(dx,dy)||0.01;"+
   "var min=a.r+b2.r+3;"+
   "if(dist<min){var push=(min-dist)/dist*0.5;"+
   "a.x-=dx*push;a.y-=dy*push;b2.x+=dx*push;b2.y+=dy*push;}}"+
   "bs.forEach(function(b){b.x=Math.max(b.r,Math.min(w-b.r,b.x));"+
   "b.y=Math.max(b.r,Math.min(h-b.r,b.y));});}"+
   "function draw(){if(!cv.width)return;cx.clearRect(0,0,cv.width,cv.height);"+
   "bs.forEach(function(b){cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fillStyle=b.c;cx.fill();"+
   "cx.fillStyle='#ffffff';cx.textAlign='center';cx.textBaseline='middle';"+
   "cx.font='600 '+Math.max(11,Math.round(b.r*0.42))+'px Arial, sans-serif';"+
   "cx.fillText(b.t,b.x,b.y);});}"+
   "function run(){if(raf)cancelAnimationFrame(raf);"+
   "function tick(){step();draw();spins++;"+
   "if(spins<200)raf=requestAnimationFrame(tick);else raf=null;}"+
   "raf=requestAnimationFrame(tick);}"+
   "cv.addEventListener('pointerdown',function(e){e.preventDefault();"+
   "var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;"+
   "var hit=null;bs.forEach(function(b){if(Math.hypot(b.x-x,b.y-y)<=b.r)hit=b;});"+
   "if(!hit)return;"+
   "document.getElementById('say').textContent=hit.t+'. It came up '+hit.n+' times in this unit.';"+
   "try{var u=new SpeechSynthesisUtterance(hit.t);u.rate=0.8;"+
   "speechSynthesis.cancel();speechSynthesis.speak(u);}catch(err){}});"},

{c:'F15',p:'F',n:'Voice shape',t:['audio','pronunciation','microphone','live'],
 s:['model shape','your shape','compare'],
 pairs:['F04','F13','F03'],
 note:'Shows the shape of a voice, not just how loud it is. The model line stays on screen so a student can see where their own rises and falls. It says plainly when a device will not let it listen.',
 h:'<div class="wrap"><div class="q">Could you tell me where the library is?</div>'+
   '<div class="scopebox"><canvas id="cv"></canvas></div>'+
   '<div class="barrow"><button class="btn" id="model">Show the model shape</button>'+
   '<button class="btn solid" id="go">Listen to me</button>'+
   '<button class="btn quiet" id="stop">Stop</button></div>'+
   '<p class="sub miclab" id="state">Nothing is recorded and nothing is sent anywhere.</p></div>',
 k:'.scopebox{position:relative;height:calc(var(--base)*6);background:#0b2e4f;'+
   'border:2px solid var(--line);border-radius:var(--r-lg);overflow:hidden;touch-action:none;'+
   'margin-bottom:var(--s4)}'+
   '.scopebox canvas{position:absolute;inset:0;width:100%;height:100%}'+
   '.miclab{min-height:calc(var(--base)*1.6)}',
 j:"var wrap=document.querySelector('.scopebox'),cv=document.getElementById('cv'),cx=cv.getContext('2d');"+
   "var ctxA=null,an=null,stream=null,raf=null,data=null,model=null;"+
   "var calm=false;try{calm=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}"+
   "function say(t){document.getElementById('state').textContent=t;}"+
   "function size(){cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;grid();}"+
   "setTimeout(size,30);window.addEventListener('resize',size);"+
   "function grid(){if(!cv.width)return;cx.fillStyle='#0b2e4f';cx.fillRect(0,0,cv.width,cv.height);"+
   "cx.strokeStyle='rgba(255,255,255,.12)';cx.lineWidth=1;"+
   "for(var x=0;x<cv.width;x+=cv.width/8){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();}"+
   "for(var y=0;y<cv.height;y+=cv.height/4){cx.beginPath();cx.moveTo(0,y);cx.lineTo(cv.width,y);cx.stroke();}"+
   "if(model)line(model,'#f2a541',3);}"+
   "function line(pts,col,w){cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();"+
   "pts.forEach(function(v,i){var x=i/(pts.length-1)*cv.width,y=cv.height/2-v*cv.height*0.42;"+
   "if(i)cx.lineTo(x,y);else cx.moveTo(x,y);});cx.stroke();}"+
   "document.getElementById('model').onclick=function(){"+
   "model=[];for(var i=0;i<120;i++){var t=i/119;"+
   "var env=Math.sin(t*Math.PI)*(t<0.75?1:0.5);"+
   "model.push(env*Math.sin(t*34)*0.9*(0.6+0.4*Math.sin(t*7)));}"+
   "grid();say('The amber line is the model. Now tap Listen to me and say it.');};"+
   "function fade(){cx.fillStyle='rgba(11,46,79,0.22)';cx.fillRect(0,0,cv.width,cv.height);}"+
   "function frame(){if(!an)return;an.getByteTimeDomainData(data);"+
   "if(calm){grid();}else{fade();if(model)line(model,'rgba(242,165,65,.5)',2);}"+
   "var pts=[];for(var i=0;i<data.length;i+=4)pts.push((data[i]-128)/128);"+
   "line(pts,'#7ee0d0',3);"+
   "if(!calm)raf=requestAnimationFrame(frame);}"+
   "function stopAll(){if(raf)cancelAnimationFrame(raf);raf=null;"+
   "if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}"+
   "if(ctxA&&ctxA.close){try{ctxA.close();}catch(e){}}ctxA=null;an=null;}"+
   "document.getElementById('go').onclick=function(){"+
   "var AC=window.AudioContext||window.webkitAudioContext;"+
   "if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!AC){"+
   "say('This device will not let a web page listen. Say it to a partner, or use Record and compare.');return;}"+
   "if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.protocol!=='file:'){"+
   "say('Listening only works on a secure page. Open this file from the computer itself.');return;}"+
   "say('Asking for the microphone.');"+
   "navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){"+
   "stream=s;ctxA=new AC();"+
   "if(ctxA.state==='suspended'&&ctxA.resume)ctxA.resume();"+
   "an=ctxA.createAnalyser();an.fftSize=1024;data=new Uint8Array(an.fftSize);"+
   "ctxA.createMediaStreamSource(s).connect(an);"+
   "say(calm?'Listening. Tap Stop to freeze the shape.':'Listening. Say the sentence.');"+
   "if(calm){setTimeout(frame,900);}else frame();"+
   "}).catch(function(err){"+
   "var why=err&&err.name;"+
   "if(why==='NotAllowedError')say('The microphone was blocked. Allow it in the browser, or say it to a partner.');"+
   "else if(why==='NotFoundError')say('No microphone on this device. Say it to a partner instead.');"+
   "else say('The microphone would not start here. Say it to a partner instead.');});};"+
   "document.getElementById('stop').onclick=function(){stopAll();"+
   "say('Stopped. The microphone is off again.');};"}
